<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carabox</title>
<style>
:root{
  --bg:#f2eee7; --panel:#fffdf9; --ink:#1e1b18; --muted:#6f685f; --line:#e4ded4;
  --accent:#e4572e; --accent-ink:#fff; --chip:#f2ede5; --chip-on:#1e1b18; --chip-on-ink:#fff;
  --thumb:#f6f1e8; --shadow:0 1px 2px rgba(0,0,0,.05),0 10px 30px rgba(40,30,20,.07);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#000; --panel:#111; --ink:#f2eee8; --muted:#9a948c; --line:#262626;
  --accent:#ff7a50; --accent-ink:#140b06; --chip:#1c1c1c; --chip-on:#f2eee8; --chip-on-ink:#111;
  --thumb:#efe9df; --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
button,input,select{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:14px;padding:14px 24px;border-bottom:1px solid var(--line);position:relative}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{margin:0;font-size:26px;letter-spacing:-.02em;font-weight:800}
.brand h1 span{display:inline-block;transform:rotate(-4deg);color:var(--accent)}
.brand small{color:var(--muted)}
.spacer{flex:1}
.theme{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;color:var(--muted);font-size:13px}
.switch{width:44px;height:24px;border-radius:12px;background:var(--chip);border:1px solid var(--line);position:relative;transition:background .2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--ink);transition:transform .2s}
:root[data-theme="dark"] .switch{background:var(--accent)}
:root[data-theme="dark"] .switch::after{transform:translateX(20px);background:#000}
main{display:grid;grid-template-columns:minmax(300px,500px) minmax(0,1fr);gap:24px;padding:20px 24px 40px;max-width:1500px;margin:0 auto}
.stagecol{position:sticky;top:16px;align-self:start;display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.stage{padding:12px}
.stage .art{aspect-ratio:4/5;border-radius:10px;overflow:hidden;background:repeating-conic-gradient(#ddd 0 25%,#fff 0 50%) 0 0/20px 20px}
.stage svg{display:block;width:100%;height:100%}
.namerow{display:flex;gap:8px;margin-top:10px}
.namerow input{flex:1;min-width:0;background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-weight:600}
.btn{background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
.btn:disabled{opacity:.4;cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px}
.sub{padding:12px 14px}
.sub h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.steps{display:flex;gap:6px;overflow-x:auto;padding:10px;scrollbar-width:thin}
.step{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--chip);cursor:pointer;white-space:nowrap}
.step b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--panel);font-size:12px}
.step.on{background:var(--chip-on);color:var(--chip-on-ink);border-color:transparent}
.step.on b{background:var(--accent);color:var(--accent-ink)}
.panel{padding:6px 18px 18px}
.panel h2{margin:12px 0 2px;font-size:20px}
.panel .lead{color:var(--muted);margin:0 0 6px}
.sec{border-top:1px solid var(--line);padding:14px 0 6px;margin-top:10px}
.sec:first-of-type{border-top:0}
.sec h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.opts.big{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
.opt{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:5px;cursor:pointer;display:flex;flex-direction:column;gap:4px;text-align:center;transition:transform .08s,border-color .15s}
.opt:hover{transform:translateY(-1px);border-color:var(--muted)}
.opt.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.opt .th{aspect-ratio:1;border-radius:8px;background:var(--thumb);overflow:hidden}
.opt .th svg{width:100%;height:100%;display:block}
.opt span{font-size:12px;line-height:1.2;padding:0 2px 2px}
.opt em{font-style:normal;font-size:11px;color:var(--muted);display:block}
.sliders{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:4px 22px}
.sl{display:grid;grid-template-columns:110px 1fr 38px;align-items:center;gap:8px;min-height:30px}
.sl label{font-size:13px}
.sl output{font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted);text-align:right}
input[type=range]{width:100%;accent-color:var(--accent)}
.sw{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.sw button{width:30px;height:30px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.sw button.on{box-shadow:0 0 0 2px var(--accent)}
.sw input[type=color]{width:34px;height:34px;border:0;background:none;padding:0;cursor:pointer}
.sw .match{width:auto;height:30px;border-radius:999px;padding:0 12px;background:var(--chip);color:var(--ink);font-size:12px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--chip);cursor:pointer}
.seg button.on{background:var(--chip-on);color:var(--chip-on-ink);border-color:transparent}
.checks{display:flex;flex-wrap:wrap;gap:8px 18px}
.checks label{display:flex;align-items:center;gap:6px;cursor:pointer}
.checks input{accent-color:var(--accent);width:16px;height:16px}
.gazewrap{display:flex;gap:16px;align-items:center}
.gaze{width:120px;height:90px;border-radius:12px;background:var(--chip);border:1px solid var(--line);position:relative;cursor:crosshair;touch-action:none}
.gaze::before,.gaze::after{content:"";position:absolute;background:var(--line)}
.gaze::before{left:50%;top:8px;bottom:8px;width:1px}
.gaze::after{top:50%;left:8px;right:8px;height:1px}
.gaze i{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--accent);z-index:1}
.nav{display:flex;justify-content:space-between;gap:8px;padding:14px 18px;border-top:1px solid var(--line)}
.bgrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bgrow select{background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:7px 8px}
.bgrow input[type=color]{width:34px;height:34px;border:0;background:none;padding:0;cursor:pointer}
.mini{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;margin-top:10px;font-size:13px}
.hint{color:var(--muted);font-size:12px}
@media (max-width:860px){
  header{padding:12px 16px}
  .brand small{display:none}
  main{grid-template-columns:1fr;padding:12px 16px 32px;gap:14px}
  .stagecol{position:static}
  .stage .art{max-width:380px;margin:0 auto}
  .opts{grid-template-columns:repeat(auto-fill,minmax(80px,1fr))}
  .sl{grid-template-columns:96px 1fr 34px}
}
</style>
</head>
<body>
<header>
  <div class="brand"><h1>Cara<span>box</span></h1><small>character face designer</small></div>
  <div class="spacer"></div>
  <label class="theme" id="themeToggle" title="Toggle dark mode"><span>Dark mode</span><div class="switch" role="switch" aria-checked="false" tabindex="0"></div></label>
</header>
<main>
  <div class="stagecol">
    <div class="card stage">
      <div class="art" id="art"></div>
      <div class="namerow">
        <input id="charName" placeholder="Character name" maxlength="40">
        <button class="btn" id="undoBtn" title="Undo">↶</button>
        <button class="btn" id="redoBtn" title="Redo">↷</button>
      </div>
    </div>
    <div class="card sub">
      <h4>Picture background</h4>
      <div class="bgrow">
        <select id="bgType">
          <option value="solid">Solid</option><option value="gradient">Gradient</option><option value="spot">Spotlight</option>
          <option value="halftone">Halftone dots</option><option value="stripes">Stripes</option><option value="burst">Sunburst</option><option value="none">Transparent</option>
        </select>
        <input type="color" id="bgC1" title="Main colour"><input type="color" id="bgC2" title="Second colour">
        <div class="sw" id="bgSw"></div>
      </div>
      <h4 style="margin-top:14px">Line style</h4>
      <div class="mini">
        <label for="lnW">Line weight</label><input type="range" id="lnW" min="1.2" max="5" step="0.1"><output id="lnWo"></output>
        <label for="lnWob">Hand wobble</label><input type="range" id="lnWob" min="0" max="3" step="0.1"><output id="lnWobo"></output>
        <label for="lnInk">Ink colour</label><input type="color" id="lnInk"><span></span>
        <label for="lnShade">Cel shading</label><input type="checkbox" id="lnShade" style="justify-self:start;accent-color:var(--accent)"><span></span>
      </div>
    </div>
    <div class="card actions">
      <button class="btn primary" id="randBtn">Surprise me</button>
      <button class="btn" id="pngBtn">Export PNG</button>
      <button class="btn" id="svgBtn">Export SVG</button>
      <button class="btn" id="saveBtn">Save .json</button>
      <button class="btn" id="loadBtn">Load .json</button>
      <input type="file" id="loadFile" accept=".json,application/json" hidden>
    </div>
  </div>
  <div class="card">
    <div class="steps" id="steps"></div>
    <div class="panel" id="panel"></div>
    <div class="nav"><button class="btn" id="prevBtn">← Back</button><button class="btn" id="shuffleStep">Shuffle this step</button><button class="btn primary" id="nextBtn">Next →</button></div>
  </div>
</main>
<script>
"use strict";
/* ================================================================
   Carabox — layered parametric face engine.
   Every feature is its own generator working from a shared head
   geometry (sampled outline + ray casting), so hair, beards and ears
   follow whatever head shape is chosen.
   ================================================================ */
const CX=200, Y0=255, VW=400, VH=500;
const f=n=>Math.round(n*10)/10;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const clone=o=>JSON.parse(JSON.stringify(o));
function rng(seed){let a=(seed*2654435761)>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function merge(t,s){for(const k in s){if(s[k]&&typeof s[k]==='object'&&!Array.isArray(s[k])){if(!t[k]||typeof t[k]!=='object')t[k]={};merge(t[k],s[k]);}else t[k]=s[k];}return t;}

/* ---------- colour ---------- */
function h2r(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return[n>>16&255,n>>8&255,n&255];}
function r2h(r){return'#'+r.map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join('');}
function mix(a,b,t){const A=h2r(a),B=h2r(b);return r2h(A.map((v,i)=>v+(B[i]-v)*t));}
const darken=(c,t)=>mix(c,'#000000',t), lighten=(c,t)=>mix(c,'#ffffff',t);

/* ---------- curves ---------- */
// Catmull-Rom → cubic Bézier. A point may carry its own tension as p[2] (0 = sharp corner).
function crSegs(pts,closed,k){
  const n=pts.length,out=[];
  const g=i=>closed?pts[(i+n)%n]:pts[clamp(i,0,n-1)];
  const segs=closed?n:n-1;
  for(let i=0;i<segs;i++){
    const p0=g(i-1),p1=g(i),p2=g(i+1),p3=g(i+2);
    const k1=p1[2]??k,k2=p2[2]??k;
    out.push([p1,[p1[0]+(p2[0]-p0[0])*k1/6,p1[1]+(p2[1]-p0[1])*k1/6],[p2[0]-(p3[0]-p1[0])*k2/6,p2[1]-(p3[1]-p1[1])*k2/6],p2]);
  }
  return out;
}
function segsPath(segs,closed,noM){
  let d=noM?'':`M${f(segs[0][0][0])},${f(segs[0][0][1])}`;
  for(const[,c1,c2,p]of segs)d+=`C${f(c1[0])},${f(c1[1])} ${f(c2[0])},${f(c2[1])} ${f(p[0])},${f(p[1])}`;
  return closed?d+'Z':d;
}
const smooth=(pts,closed,k=1,noM)=>pts.length<2?'':segsPath(crSegs(pts,closed,k),closed,noM);
const poly=(pts,closed)=>pts.map((p,i)=>(i?'L':'M')+f(p[0])+','+f(p[1])).join('')+(closed?'Z':'');
function bez(p0,c1,c2,p1,t){const u=1-t;return[u*u*u*p0[0]+3*u*u*t*c1[0]+3*u*t*t*c2[0]+t*t*t*p1[0],u*u*u*p0[1]+3*u*u*t*c1[1]+3*u*t*t*c2[1]+t*t*t*p1[1]];}
function sampleSegs(segs,steps){const out=[];for(const s of segs)for(let i=0;i<steps;i++)out.push(bez(s[0],s[1],s[2],s[3],i/steps));return out;}
function rayHit(P,cx,cy,ang){
  const dx=Math.cos(ang),dy=Math.sin(ang);let best=0;
  for(let i=0;i<P.length;i++){
    const a=P[i],b=P[(i+1)%P.length],ex=b[0]-a[0],ey=b[1]-a[1],den=dx*ey-dy*ex;
    if(Math.abs(den)<1e-9)continue;
    const ax=a[0]-cx,ay=a[1]-cy,t=(ax*ey-ay*ex)/den,s=(ax*dy-ay*dx)/den;
    if(t>0&&s>=0&&s<=1&&t>best)best=t;
  }
  return best;
}
function spanAt(P,y){
  let l=Infinity,r=-Infinity;
  for(let i=0;i<P.length;i++){const a=P[i],b=P[(i+1)%P.length];
    if((a[1]-y)*(b[1]-y)<=0&&a[1]!==b[1]){const x=a[0]+(b[0]-a[0])*(y-a[1])/(b[1]-a[1]);l=Math.min(l,x);r=Math.max(r,x);}}
  if(l===Infinity)return{l:CX-60,r:CX+60};
  return{l,r};
}

/* ================================================================
   Option catalogues
   ================================================================ */
// w: half-width at eye line, top: crown above eye line, cheek: cheek width ratio,
// jaw/jawY: jaw corner, chin/chinW: chin length and flatness, smooth: jaw softness
const HEADS={
  standard:{w:98, top:140,cheek:.95,jaw:64,jawY:.7, chin:122,chinW:15,smooth:.85},
  round:   {w:102,top:138,cheek:1,  jaw:80,jawY:.64,chin:110,chinW:30,smooth:1},
  sharp:   {w:97, top:142,cheek:.91,jaw:52,jawY:.74,chin:134,chinW:7, smooth:.7},
  long:    {w:90, top:150,cheek:.95,jaw:62,jawY:.75,chin:146,chinW:16,smooth:.8},
  square:  {w:100,top:140,cheek:.98,jaw:84,jawY:.76,chin:128,chinW:36,smooth:.55},
  heart:   {w:104,top:142,cheek:.9, jaw:50,jawY:.72,chin:124,chinW:6, smooth:.85},
  chibi:   {w:114,top:150,cheek:1,  jaw:78,jawY:.6, chin:92, chinW:30,smooth:1},
  rugged:  {w:102,top:140,cheek:.97,jaw:88,jawY:.72,chin:142,chinW:44,smooth:.45},
  oval:    {w:93, top:146,cheek:.94,jaw:60,jawY:.72,chin:128,chinW:18,smooth:.9},
  gaunt:   {w:96, top:146,cheek:.84,jaw:68,jawY:.77,chin:142,chinW:22,smooth:.6},
  broad:   {w:114,top:136,cheek:1.04,jaw:98,jawY:.7,chin:126,chinW:42,smooth:.7},
  pointed: {w:95, top:140,cheek:.9, jaw:44,jawY:.76,chin:140,chinW:3, smooth:.65},
};
const BANGS={
  none:null,
  straight:{blunt:1,part:0,sweep:0},
  parted:{n:6,len:.85,part:0,sweep:.55,shape:'vee'},
  side:{n:6,len:.95,part:-.55,sweep:1,shape:'ramp'},
  spiky:{n:7,len:.9,part:.1,sweep:.25,shape:'jag'},
  choppy:{n:9,len:.5,part:0,sweep:.15,shape:'jag'},
  wispy:{n:5,len:.95,part:0,sweep:.3,shape:'even',thin:1},
  overeye:{n:5,len:1.35,part:-.6,sweep:.9,shape:'ramp'},
  center:{n:5,len:.8,part:0,sweep:.35,shape:'center'},
};
const L=(o)=>Object.entries(o);
const OPT={
  head:L({standard:'Standard',round:'Round',sharp:'Sharp V',long:'Long',square:'Square',heart:'Heart',chibi:'Chibi',rugged:'Rugged',oval:'Oval',gaunt:'Gaunt',broad:'Broad',pointed:'Pointed'}),
  nose:L({none:'None',tick:'Tick',shadow:'Shadow',tip:'Tip curve',side:'Bridge line',hooked:'Hooked',nostrils:'Nostrils',button:'Button',dot:'Dot'}),
  collar:L({crew:'Crew',vneck:'V-neck',collar:'Shirt collar',sailor:'Sailor',turtle:'Turtleneck'}),
  top:L({bald:'Bald',buzz:'Buzz',smooth:'Smooth',layered:'Layered',spiky:'Spiky',messy:'Messy',swept:'Swept',fluffy:'Fluffy',curly:'Curly',afro:'Afro',mohawk:'Mohawk',sides:'Horseshoe'}),
  back:L({none:'None',nape:'Nape',bob:'Bob',medium:'Shoulder',long:'Long',wavy:'Long wavy',ponytail:'Ponytail',twintails:'Twin tails',bun:'Bun'}),
  bangs:L({none:'None',straight:'Straight',parted:'Parted',side:'Side swept',spiky:'Spiky',choppy:'Short choppy',wispy:'Wispy',overeye:'Over one eye',center:'Centre lock'}),
  side:L({none:'None',short:'Short',chin:'Chin length',long:'Long',frame:'Face framing',braids:'Braids'}),
  brows:L({none:'None',thin:'Thin',natural:'Natural',straight:'Straight',arched:'Arched',angular:'Angular',thick:'Thick',bushy:'Bushy',short:'Short round'}),
  beard:L({none:'None',stubble:'Stubble',full:'Full',boxed:'Boxed',long:'Long',goatee:'Goatee',chinstrap:'Chin strap',soulpatch:'Soul patch',mutton:'Mutton chops'}),
  must:L({none:'None',chevron:'Chevron',pencil:'Pencil',handlebar:'Handlebar',walrus:'Walrus',toothbrush:'Toothbrush',curly:'Curled up'}),
  eyes:L({big:'Big',sparkle:'Sparkle',almond:'Almond',sharp:'Sharp (tsurime)',droopy:'Droopy (tareme)',narrow:'Narrow',sleepy:'Half-lidded',heavy:'Heavy lids',dot:'Dot',happy:'Closed happy',closed:'Closed calm'}),
  irisStyle:L({manga:'Manga',gradient:'Gradient',ringed:'Ringed',solid:'Flat'}),
  pupil:L({round:'Round',small:'Pinpoint',slit:'Slit',none:'None'}),
  lashes:L({none:'None',few:'Few',many:'Many'}),
  glasses:L({none:'None',round:'Round',square:'Square',halfmoon:'Half-moon',shades:'Shades'}),
  mouth:L({line:'Line',smile:'Smile',smirk:'Smirk',frown:'Frown',pout:'Pout',tiny:'Tiny',open:'Open',grin:'Grin',shout:'Shout',o:'O',triangle:'Gasp',cat:'Cat',fang:'Fang',wavy:'Wavy',lips:'Lips',gritted:'Gritted'}),
  ears:L({none:'Hidden',round:'Round',small:'Small',large:'Large',pointed:'Pointed',elf:'Long elf',cat:'Cat',bear:'Bear'}),
  ring:L({none:'None',stud:'Stud',hoop:'Hoop'}),
};
const SKINS=['#FFF2E8','#FCE3D3','#F7D5BF','#EFC3A4','#E2AD88','#CC9269','#A8714D','#7E5136','#5A3826','#ECE6EE','#DCEBDD','#D8E2F5'];
const HAIRC=['#18161C','#2E2A3A','#3A2A22','#6B4A32','#A8784E','#D9772B','#B8322A','#E8C35A','#EDE3B8','#D5D8DF','#8C8C8C','#F4A6C6','#A9C8E8','#3FAF6F','#5A3FA0','#5A1E2A'];
const IRISC=['#5A3A28','#8A5A2E','#D98A2B','#E3B22E','#3FAF6F','#2E8F8A','#3F7FD0','#4A8AC8','#8A5BC9','#E0609A','#C0392B','#555555'];
const SHIRTC=['#1F2A44','#F2F0EA','#2C2C2C','#E0B33C','#E86A50','#3D6B4F','#556070','#9C6B8E','#2F4B6E','#B8322A'];
const LIPC=['#D97A7A','#C2546A','#9C2F4A','#E89A92','#B04A3A','#7A2E3A'];
const BGC=['#F4E9D8','#FFFFFF','#E8F1F2','#FCE1E4','#E0F0D9','#FFE9A8','#CFE3FF','#2B2D42','#111111','#E4572E'];

const DEF={
  seed:7, name:'',
  skin:'#FCE3D3',
  head:Object.assign({shape:'standard',asym:0},HEADS.standard),
  nose:{type:'tick',size:1,y:0},
  face:{blush:0,freckles:0,smile:0,forehead:0,cleft:false,mole:false,scar:false,plaster:false},

    o+=`<g transform="translate(${f(x)} ${f(g.earY)}) scale(${sx} 1)"><path d="${sh[0]}Z" ${fs(g,s.skin,W*.85)}/>`;

    o+='</g>';
  }
  return o;
}

/* ---------- hair ---------- */
// Outer locks (out:{n,len,a0,a1,droop,jit,w,curl,sweep}) are drawn behind the crown mass so only their pointed tips show.
const TOPS={
  buzz:{vol:2,buzz:1},
  smooth:{vol:9},
  layered:{vol:10,out:{n:12,len:24,a0:0,a1:1,droop:1,jit:.35,w:.75,sidesOnly:1}},
  spiky:{vol:12,out:{n:12,len:44,a0:-.02,a1:1.02,droop:.15,jit:.55,w:1.3}},
  messy:{vol:12,out:{n:16,len:22,a0:0,a1:1,droop:.6,jit:.8}},
  swept:{vol:11,out:{n:8,len:24,a0:.15,a1:.85,droop:.9,jit:.3,sweep:-.35}},
  fluffy:{vol:17,out:{n:11,len:15,a0:.02,a1:.98,droop:.8,jit:.5,curl:1}},
  curly:{vol:10,scal:14,amp:9},
  afro:{vol:40,scal:20,amp:8,drop:40},

function lock(root,tip,wr,bend){

  return`M${f(rl[0])},${f(rl[1])}Q${f(cl[0])},${f(cl[1])} ${f(tip[0])},${f(tip[1])}Q${f(cr[0])},${f(cr[1])} ${f(rr[0])},${f(rr[1])}Z`;
}
function capInfo(s,g){

function capPath(s,g,ci){

  return smooth(outer,false,1)+`L${f(inner[0][0])},${f(inner[0][1])}`+smooth(inner,false,1,true)+'Z';
}
function outerLocks(s,g,ci,rand){

function bangLocks(s,g,rand){

    pts.push([Rx-1,yb-14,.8],[Rx,yT,0]);
    let d=smooth(pts,false,1)+`Q${CX},${f(yT-30)} ${f(Lx)},${f(yT)}Z`;
    const lines=[-.55,-.2,.2,.55].map(u=>`M${f(CX+u*half)},${f(g.hairY+4)}Q${f(CX+u*half*1.04)},${f(yb-base*.4)} ${f(CX+u*half*1.06)},${f(yb-6)}`).join('');

  }

    if(B.shape==='vee')lf=.65+.5*Math.min(1,Math.abs(x-partX)/half);

function sideLocks(s,g,rand){

  const res=[];

function hairFront(s,g,p){
  const H=s.hair,W=g.W,col=H.color,rand=rng(s.seed+5);
  let behind='',o='',shadowD='',clipD='';
  const lockSt=`stroke="${g.ink}" stroke-width="${f(W*.8)}" stroke-linejoin="round"`;
  const ci=capInfo(s,g);
  if(ci){
    const outs=outerLocks(s,g,ci,rand);
    for(const d of outs){behind+=`<path d="${d}" fill="${col}" ${lockSt}/>`;clipD+=d;}
    const cap=capPath(s,g,ci);
    if(ci.cfg.buzz)o+=`<path d="${cap}" fill="${col}" fill-opacity=".85" stroke="${darken(col,.25)}" stroke-width="${f(W*.5)}"/>`;
    else o+=`<path d="${cap}" fill="${col}" stroke="${g.ink}" stroke-width="${f(W*.95)}" stroke-linejoin="round"/>`;
    shadowD+=cap;clipD+=cap;
    if(!ci.cfg.buzz){
      // a few flow lines fanning out from the parting
      const px=CX+H.part*s.head.w*.5,top=g.crownY-ci.v*.4+18;
      for(const u of[-.55,-.2,.3,.62]){const sx0=px+u*28,ex=CX+u*s.head.w*.9;o+=ink(dense([[sx0,top+Math.abs(u)*10],[(sx0+ex)/2,top+(g.hairY-top)*.4],[ex,g.hairY-10]]),W*.55,g,taper(.3,.4),g.ink,' opacity=".4"');}
    }
  }
  if(H.top==='sides'){
    for(const sx of[1,-1]){
      const pts=[],inn=[];
      for(let i=0;i<=14;i++){const t=i/14,a=(sx>0?-.7+t*1.0:Math.PI+.7-t*1.0),r=g.headR(a);pts.push([g.cc[0]+Math.cos(a)*(r+7*H.vol+4*Math.abs(Math.sin(t*Math.PI*3))),g.cc[1]+Math.sin(a)*(r+7*H.vol+4*Math.abs(Math.sin(t*Math.PI*3)))]);inn.push([g.cc[0]+Math.cos(a)*(r-9),g.cc[1]+Math.sin(a)*(r-9)]);}

      o+=`<path d="${d}" fill="${col}" ${lockSt}/>`;shadowD+=d;
    }

    for(let i=0;i<7;i++){const t=i/6,x=CX-14+28*t,ry=g.crownY+8;o+=`<path d="${lock([x,ry+10],[x+(t-.5)*30,ry-40-26*Math.sin(Math.PI*t)*H.vol*H.spike],14,(t-.5)*8)}" fill="${col}" ${lockSt}/>`;}
  }

    front+=`<path d="${l.d}" fill="${col}"/><path d="${l.d}" fill="none" ${lockSt} clip-path="url(#${clipId})"/>`;shadowD+=l.d;clipD+=l.d;

function hairBack(s,g){

    return`<circle cx="${CX}" cy="${f(y)}" r="${f(r)}" ${fs(g,col,W*.9)}/>`+ink(dense([[CX-r*.6,y+r*.2],[CX-r*.1,y-r*.5],[CX+r*.6,y-r*.1]]),W*.6,g,taper(.2,.3),g.ink,' opacity=".6"');}

    for(let i=0;i<4;i++)o+=`<path d="${lock([tx-4+i*3,ty],[tx+40+i*16,ty+len*(.7+.1*i)],38-i*5,22-i*4)}" fill="${col}" ${lockSt}/>`;

  }
  if(t==='twintails'){
    for(const sx of[1,-1]){const x=CX+sx*(s.head.w+4),y=g.crownY+s.head.top*.4,len=230*H.backLen;
      for(let i=0;i<4;i++)o+=`<path d="${lock([x,y],[x+sx*(30+i*12),y+len*(.7+.1*i)],36-i*4,sx*(26-i*4))}" fill="${col}" ${lockSt}/>`;
      o+=`<circle cx="${f(x)}" cy="${f(y)}" r="7" fill="#C8323A" stroke="${g.ink}" stroke-width="${f(W*.7)}"/>`;}
    return o;
  }
  const bottomBase={nape:g.chinY+8,bob:g.mouthY+18,medium:g.sY+40,long:VH-8,wavy:VH-8}[t];

  o+=`<path d="${smooth(pts,true,.95)}" ${fs(g,col,W*.9)}/>`;
  for(const sx of[1,-1])for(const u of[.35,.7])o+=ink(dense([[CX+sx*wM*u,c[1]+40],[CX+sx*(wM*u+flare*.3),(c[1]+bottom)/2],[CX+sx*(wM*u+flare*.5),bottom-12]]),W*.6,g,taper(.2,.4),g.ink,' opacity=".45"');
  return o;
}

/* ---------- face details ---------- */

/* ---------- nose ---------- */
function nose(s,g){
  const N=s.nose,k=N.size,W=g.W/k;let o='';
  const I=(pts,w,prof,col,ex)=>ink(dense(pts),w,g,prof||taper(.3,.3),col,ex);

/* ---------- eyes ---------- */
const EYE={

    }else if(E.shape==='happy'){

    }else if(E.shape==='closed'){
      e+=ink(dense([[-ew0*.48,-ew0*.02],[-ew0*.1,ew0*.1],[ew0*.25,ew0*.08],[ew0*.5,-ew0*.06]]),ew0*.08,g,taper(.15,.2,.5));
      if(E.lashes!=='none')e+=ink(dense([[ew0*.42,-ew0*.02],[ew0*.52,ew0*.06]]),W*.9,g);

      const I=[-ew/2,eh*sh.iy*.5+ti*.3],O=[ew/2,eh*sh.oy*.5-ti];
      let c1,c2;
      if(sh.flat){c1=[I[0]+ew*.25,-eh*.62];c2=[O[0]-ew*.2,-eh*.62+O[1]*.3];}
      else{c1=[I[0]+ew*(.2+sh.peak*.7),-eh*1.1];c2=[O[0]-ew*(.24-sh.peak*.7),-eh*1.02+O[1]*.6];}
      const l1=[O[0]-ew*.18,eh*sh.low*.95+O[1]*.3],l2=[I[0]+ew*.26,eh*sh.low];
      const up=`M${f(I[0])},${f(I[1])}C${f(c1[0])},${f(c1[1])} ${f(c2[0])},${f(c2[1])} ${f(O[0])},${f(O[1])}`;
      const lo=`C${f(l1[0])},${f(l1[1])} ${f(l2[0])},${f(l2[1])} ${f(I[0])},${f(I[1])}`;

      iris+=`<ellipse cx="${f(icx)}" cy="${f(icy)}" rx="${f(rx)}" ry="${f(ry)}" fill="none" stroke="${darken(ic,.65)}" stroke-width="${f(W*.6)}"/>`;
      const hl=[[-.36,-.36,.32,.25],[.36,.36,.13,.13],[.08,-.68,.08,.08]];
      for(let i=0;i<E.highlights;i++){const h=hl[i];iris+=`<ellipse cx="${f(icx+h[0]*rx*sx)}" cy="${f(icy+h[1]*ry)}" rx="${f(rx*h[2])}" ry="${f(ry*h[3])}" fill="#fff"/>`;}

function eyeTop(s,g){

/* ---------- brows ---------- */
const BROW={
  thin:{arch:.22,peak:.55,taper:.75,th:.55},natural:{arch:.25,peak:.6,taper:.7,th:.9},straight:{arch:.04,peak:.5,taper:.5,th:.85},
  arched:{arch:.5,peak:.55,taper:.75,th:.75},angular:{arch:.42,peak:.68,taper:.7,th:.9,ang:1},thick:{arch:.15,peak:.55,taper:.35,th:1.9},
  bushy:{arch:.2,peak:.5,taper:.25,th:2.3,rag:1},

function brows(s,g){
  const B=s.brows;if(B.type==='none')return'';
  const col=B.color||darken(s.hair.color,.25);
  const W=g.W,bw=g.ew*1.12,top=eyeTop(s,g);
  let o='';const r=rng(s.seed*5+2);
  for(const sx of[1,-1]){
    const by=g.eyeY-top-g.ew*.36-B.height-sx*B.asym*6;
    let d='';
    if(B.type==='short'){
      const T=W*2.4*B.thick;
      d=`<ellipse cx="${f(-bw*.15)}" cy="${f(B.tilt*4)}" rx="${f(T*1.1)}" ry="${f(T*.6)}" transform="rotate(${f(-B.tilt*20)} ${f(-bw*.15)} 0)" fill="${col}"/>`;
    }else{
      const C=BROW[B.type],T=W*1.3*C.th*B.thick,N=14,up=[],lo=[];
      const xi=-bw/2,kexp=Math.log(.5)/Math.log(C.peak);
      for(let i=0;i<=N;i++){
        const t=i/N,x=xi+bw*t;
        let y=C.ang?(t<C.peak?-C.arch*bw*.3*(t/C.peak):-C.arch*bw*.3*(1-(t-C.peak)/(1-C.peak)*.9)):-C.arch*bw*.3*Math.sin(Math.PI*Math.pow(t,kexp));

    }
    o+=`<g transform="translate(${f(CX+sx*(g.eyeDX+g.ew*.04))} ${f(by)}) scale(${sx} 1)">${d}</g>`;
  }
  return o;
}

/* ---------- mouth ---------- */

      const d=`M${f(Lp[0])},${f(t0+h*.2)}Q0,${f(t0-c*5)} ${f(Rp[0])},${f(t0+h*.2)}L${f(Rp[0]*.9)},${f(t0+h*.85)}Q0,${f(t0+h-c*5)} ${f(Lp[0]*.9)},${f(t0+h*.85)}Z`;
      let ln=`M${f(Lp[0]*.95)},${f(t0+h*.52)}L${f(Rp[0]*.95)},${f(t0+h*.52)}`;
      for(let i=1;i<5;i++){const x=Lp[0]+mw*i/5;ln+=`M${f(x)},${f(t0+2)}L${f(x)},${f(t0+h-2)}`;}
      out=`<path d="${d}" ${fs(g,teeth,W*.9)}/><path d="${ln}" ${st(g,W*.45)}/>`;break;}
  }
  if(M.lips>0&&M.type!=='lips'){
    const y=(['open','grin','shout'].includes(M.type)?c*mw*.22+o*mw*.75:c*mw*.3)+6;
    out+=ink(dense([[-mw*.16,y],[0,y+2],[mw*.16,y]]),W*.8*M.lips+.3,g,taper(.3,.3),g.ink,' opacity=".6"');
  }
  return`<g transform="translate(${CX} ${f(g.mouthY)})">${out}</g>`;
}

/* ---------- facial hair ---------- */
function facialHair(s,g,p){
  const F=s.facial,col=F.color||s.hair.color,W=g.W;let beard='',must='';
  const bt=F.beard,len=F.len,mw=g.fw;
  const C=[CX,Y0-20];
  const push=(pt,d)=>{const dx=pt[0]-C[0],dy=pt[1]-C[1],l=Math.hypot(dx,dy)||1;return[pt[0]+dx/l*d,pt[1]+dy/l*d];};
  const jawRun=y0=>g.poly.filter(q=>q[1]>y0);
  if(['full','boxed','long','stubble'].includes(bt)){
    const y0=g.earY-12,run=jawRun(y0);
    const L0=bt==='long'?95*len:bt==='full'?16*len:bt==='boxed'?7*len:0;
    const th=bt==='stubble'?0:bt==='boxed'?4:8;
    const outer=run.map(pt=>{const q=push(pt,th);const dx=Math.abs(pt[0]-CX)/s.head.jaw;q[1]+=L0*Math.max(0,1-dx*dx);return q;});
    const sr=g.span(y0);
    const inner=[[sr.l+12,y0],[CX-mw*.82,g.noseY+6],[CX-mw*.72,g.mouthY+2],[CX-mw*.38,g.mouthY+12],[CX,g.mouthY+14],[CX+mw*.38,g.mouthY+12],[CX+mw*.72,g.mouthY+2],[CX+mw*.82,g.noseY+6],[sr.r-12,y0]];
    const d=smooth(outer,false,.6)+`L${f(inner[0][0])},${f(inner[0][1])}`+smooth(inner,false,1,true)+'Z';
    if(bt==='stubble'){
      const r=rng(s.seed+99);let dots='';
      beard=`<defs><clipPath id="${p}stb"><path d="${d}"/></clipPath></defs><path d="${d}" fill="${col}" opacity=".13"/><g clip-path="url(#${p}stb)" fill="${darken(col,.1)}" opacity=".5">`;
      for(let i=0;i<240;i++){const x=CX-s.head.jaw-10+r()*(s.head.jaw*2+20),y=y0+r()*(g.chinY-y0+10);dots+=`<circle cx="${f(x)}" cy="${f(y)}" r=".8"/>`;}
      beard+=dots+'</g>';
    }else{
      beard=`<path d="${d}" ${fs(g,col,W*.9)}/>`;
      for(let i=0;i<5;i++){const x=CX+(i-2)*mw*.32,y=g.mouthY+20+(bt==='long'?18:0);beard+=ink(dense([[x,y],[x+(i-2)*2,y+10+L0*.25],[x+(i-2)*3,y+16+L0*.45]]),W*.6,g,taper(.2,.4),g.ink,' opacity=".45"');}
    }
  }
  if(bt==='chinstrap'||bt==='mutton'){
    const y0=g.earY-12,run=jawRun(y0);
    const sel=bt==='mutton'?[run.filter(q=>q[0]>CX+mw*.75),run.filter(q=>q[0]<CX-mw*.75)]:[run];
    for(const seg of sel){if(seg.length<3)continue;
      const outer=seg.map(q=>push(q,3)),inner=seg.map(q=>push(q,bt==='mutton'?-20:-10)).reverse();
      beard+=`<path d="${smooth(outer,false,.8)}L${f(inner[0][0])},${f(inner[0][1])}${smooth(inner,false,.8,true)}Z" ${fs(g,col,W*.85)}/>`;}
  }
  if(bt==='goatee'){const pts=[[CX-mw*.34,g.mouthY+8],[CX-mw*.4,(g.mouthY+g.chinY)/2+6],[CX,g.chinY+6+18*len],[CX+mw*.4,(g.mouthY+g.chinY)/2+6],[CX+mw*.34,g.mouthY+8],[CX,g.mouthY+11]];beard=`<path d="${smooth(pts,true,.8)}" ${fs(g,col,W*.85)}/>`;}
  if(bt==='soulpatch')beard=`<path d="M${CX-5},${f(g.mouthY+9)}L${CX+5},${f(g.mouthY+9)}L${CX},${f(g.mouthY+20+6*len)}Z" ${fs(g,col,W*.7)}/>`;
  const mt=F.must;
  if(mt!=='none'){
    const my=g.mouthY-(g.mouthY-g.noseY)*.45,mm=mw*.55+4;let h='';
    if(mt==='chevron')h=`M0,-7Q${f(mm*.5)},-10 ${f(mm)},4Q${f(mm*.5)},5 0,2Z`;
    if(mt==='pencil')h=`M0,-1Q${f(mm*.6)},-4 ${f(mm*1.05)},1Q${f(mm*.6)},-1 0,1.5Z`;
    if(mt==='handlebar')h=`M0,-6C${f(mm*.5)},-10 ${f(mm*.9)},-2 ${f(mm*1.3)},-13C${f(mm*1.42)},-19 ${f(mm*1.26)},-23 ${f(mm*1.12)},-18C${f(mm*1.22)},-9 ${f(mm*.8)},4 0,1Z`;
    if(mt==='walrus')h=`M0,-9C${f(mm*.6)},-13 ${f(mm*1.12)},-4 ${f(mm*1.06)},16Q${f(mm*.6)},12 0,9Z`;
    if(mt==='toothbrush')h=`M0,-5L${f(mm*.35)},-5L${f(mm*.35)},4L0,4Z`;
    if(mt==='curly')h=`M0,-5C${f(mm*.5)},-9 ${f(mm*.95)},-4 ${f(mm*1.12)},-20C${f(mm*1.12)},-9 ${f(mm*.62)},3 0,1Z`;
    let piece=`<path d="${h}" ${fs(g,col,W*.8)}/>`;
    if(mt==='walrus'||mt==='chevron')piece+=`<path d="M${f(mm*.25)},-3l2,8M${f(mm*.5)},-2l3,8M${f(mm*.75)},0l3,7" ${st(g,W*.45,' opacity=".5"')}/>`;
    must=`<g transform="translate(${CX} ${f(my)})">${piece}<g transform="scale(-1 1)">${piece}</g></g>`;
  }
  return{beard,must};
}

/* ---------- main render ---------- */
function render(s,opt={}){
  const p=opt.prefix||'m';
  const g=geom(s),W=g.W;
  const vb=opt.vb||`0 0 ${VW} ${VH}`;
  let defs=`<filter id="${p}wob" filterUnits="userSpaceOnUse" x="-20" y="-20" width="${VW+40}" height="${VH+40}"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="${s.seed%97}"/><feDisplacementMap in="SourceGraphic" scale="${f(s.line.wob*2)}" xChannelSelector="R" yChannelSelector="G"/></filter>`;
  defs+=`<clipPath id="${p}head"><path d="${g.path}"/></clipPath>`;
  const B=body(s,g);
  defs+=`<clipPath id="${p}neck"><path d="${B.neck}"/></clipPath>`;
  const HF=hairFront(s,g,p);
  const E=eyes(s,g,p);
  const FH=facialHair(s,g,p);
  let c=hairBack(s,g);
  c+=`<path d="${B.neck}" fill="${s.skin}"/>`;
  if(s.line.shade)c+=`<g clip-path="url(#${p}neck)"><path d="${g.path}" transform="translate(0 18)" fill="${g.skinSh}"/></g>`;
  for(const sx of[1,-1])c+=ink([[CX+sx*g.nw,B.nTop],[CX+sx*(g.nw+.5),g.sY-14],[CX+sx*(g.nw+3),g.sY+4]],W*.95,g,taper(.05,.3));
  c+=B.shoulders;
  c+=collarSVG(s,g);
  c+=ears(s,g);
  c+=`<path d="${g.path}" fill="${s.skin}"/>`;
  if(s.line.shade){
    c+=`<g clip-path="url(#${p}head)" opacity=".35"><rect x="0" y="0" width="${VW}" height="${VH}" fill="${g.skinSh}"/><path d="${g.path}" transform="translate(${f(-s.head.w*.08)} -5)" fill="${s.skin}"/></g>`;
    if(HF.shadowD)c+=`<g clip-path="url(#${p}head)"><path d="${HF.shadowD}" transform="translate(2 8)" fill="${g.skinSh}" opacity=".75"/></g>`;
  }
  // thin outline everywhere (shows on bald heads) + tapered contour along cheeks and jaw
  c+=`<path d="${g.path}" ${st(g,W*.7)}/>`;
  const run=g.poly.filter(q=>q[1]>Y0-s.head.top*.3);
  c+=ink(run,W*1.35,g,t=>Math.pow(clamp(Math.min(t/.18,(1-t)/.18),0,1),.6)*(t>.5?.82:1));
  c+=faceDetails(s,g);
  c+=FH.beard;
  c+=nose(s,g);
  c+=mouth(s,g,p);
  c+=FH.must;
  c+=E.o;
  c+=brows(s,g);
  c+=HF.behind;
  c+=HF.o;
  c+=glasses(s,g);
  defs+=E.defs;
  const bg=opt.noBg?'':bgSVG(s,p);
  const wob=s.line.wob>0?` filter="url(#${p}wob)"`:'';
  return`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb}" preserveAspectRatio="xMidYMid meet"><defs>${defs}</defs>${bg}<g${wob}>${c}</g></svg>`;
}

/* ---------- thumbnail crops ---------- */
function crop(name,s){
  const g=geom(s),h=s.head;
  const box=(x,y,w,hh)=>{const m=Math.max(w,hh);return`${f(x-(m-w)/2)} ${f(y-(m-hh)/2)} ${f(m)} ${f(m)}`;};
  switch(name){
    case'full':return box(CX-170,Math.max(0,g.crownY-70),340,Math.min(VH,g.chinY+80)-Math.max(0,g.crownY-70));
    case'head':return box(CX-h.w-34,g.crownY-36,2*h.w+68,g.chinY-g.crownY+56);
    case'hair':return box(CX-175,Math.max(0,g.crownY-80),350,400);
    case'eyes':return box(CX-g.eyeDX-g.ew*.95,g.eyeY-g.ew*1.2,2*(g.eyeDX+g.ew*.95),g.ew*2);
    case'brows':return box(CX-g.eyeDX-g.ew*.95,g.eyeY-g.ew*1.7,2*(g.eyeDX+g.ew*.95),g.ew*2.3);
    case'nose':return box(CX-44,g.noseY-52,88,88);
    case'mouth':return box(CX-42,g.mouthY-32,84,64);
    case'lower':return box(CX-h.w-20,g.noseY-30,2*h.w+40,g.chinY-g.noseY+(s.facial.beard==='long'?150:70));
    case'ears':return box(CX-h.w-55,g.earY-90,2*h.w+110,160);
  }
  return`0 0 ${VW} ${VH}`;
}

    if(sec.t==='presets')h+=`<div class="opts big">`+PRESETS.map((p,i)=>`<button class="opt${i===presetIx?' on':''}" data-preset="${i}"><div class="th"></div><span>${p.name}</span></button>`).join('')+`</div>`;
    if(sec.t==='opts')h+=`<div class="opts">`+sec.opts.map((o,i)=>`<button class="opt" data-sec="${si}" data-ix="${i}"><div class="th"></div><span>${o[1]}</span></button>`).join('')+`</div>`;
    if(sec.t==='sliders')h+=`<div class="sliders">`+sec.items.map(it=>`<div class="sl"><label>${it[1]}</label><input type="range" min="${it[2]}" max="${it[3]}" step="${it[4]}" data-path="${it[0]}" value="${getP(it[0])}"><output>${fmt(getP(it[0]))}</output></div>`).join('')+`</div>`;
    if(sec.t==='swatch'){const cur=getP(sec.path);h+=`<div class="sw" data-path="${sec.path}">`+(sec.match?`<button class="match${cur==null?' on':''}" data-c="">${sec.match}</button>`:'')+sec.colors.map(c=>`<button style="background:${c}" data-c="${c}" class="${cur&&cur.toLowerCase()===c.toLowerCase()?'on':''}" title="${c}"></button>`).join('')+`<input type="color" value="${cur||darken(S.hair.color,.15)}" title="Custom colour"></div>`;}
    if(sec.t==='checks')h+=`<div class="checks">`+sec.items.map(it=>`<label><input type="checkbox" data-path="${it[0]}"${getP(it[0])?' checked':''}>${it[1]}</label>`).join('')+`</div>`;
    if(sec.t==='seg'){const cur=getP(sec.path);h+=`<div class="seg" data-path="${sec.path}">`+sec.opts.map(o=>`<button data-v="${o[0]}" class="${String(cur)===String(o[0])?'on':''}">${o[1]}</button>`).join('')+`</div>`;}
    if(sec.t==='expr')h+=`<div class="seg">`+Object.keys(EXPR).map(k=>`<button data-expr="${k}">${k}</button>`).join('')+`</div>`;
    if(sec.t==='gaze')h+=`<div class="gazewrap"><div class="gaze" id="gaze"><i></i></div><button class="btn" id="gazeReset">Look ahead</button><span class="hint">Drag to move both irises</span></div>`;
    h+=`</div>`;
  });
  P.innerHTML=h;
  // presets
  P.querySelectorAll('[data-preset]').forEach(b=>{const i=+b.dataset.preset;b.querySelector('.th').innerHTML=render(buildPreset(i,S),{prefix:'p'+i+'_',vb:crop('full',buildPreset(i,S)),noBg:true});
    b.onclick=()=>{S=buildPreset(i,S);presetIx=i;commit();syncAll();};});
  P.querySelectorAll('.opt[data-sec]').forEach(b=>b.onclick=()=>{const sec=step.secs[+b.dataset.sec],v=sec.opts[+b.dataset.ix][0];
    if(sec.apply)sec.apply(S,v);else setP(sec.path,v);
    commit();drawMain();if(sec.apply)renderPanel();else refreshThumbs();});
  P.querySelectorAll('input[type=range][data-path]').forEach(r=>{
    r.oninput=()=>{setP(r.dataset.path,+r.value);r.nextElementSibling.textContent=fmt(+r.value);drawMain();};
    r.onchange=()=>{commit();refreshThumbs();};});
  P.querySelectorAll('.sw[data-path]').forEach(w=>{const path=w.dataset.path;
    w.querySelectorAll('button').forEach(b=>b.onclick=()=>{setP(path,b.dataset.c||null);commit();drawMain();w.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));refreshThumbs();});
    const ci=w.querySelector('input[type=color]');ci.oninput=()=>{setP(path,ci.value);drawMain();};ci.onchange=()=>{commit();w.querySelectorAll('button').forEach(x=>x.classList.remove('on'));refreshThumbs();};});
  P.querySelectorAll('input[type=checkbox][data-path]').forEach(c=>c.onchange=()=>{setP(c.dataset.path,c.checked);commit();drawMain();refreshThumbs();});
  P.querySelectorAll('.seg[data-path]').forEach(sg=>sg.querySelectorAll('button').forEach(b=>b.onclick=()=>{const cur=getP(sg.dataset.path);setP(sg.dataset.path,typeof cur==='number'?+b.dataset.v:b.dataset.v);commit();drawMain();sg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));refreshThumbs();}));
  P.querySelectorAll('[data-expr]').forEach(b=>b.onclick=()=>{const e=EXPR[b.dataset.expr];
    if(S.eyes.shape==='happy'&&!e.eyes.shape)S.eyes.shape='almond';
    merge(S,clone(e));commit();syncAll();});
  const gz=$('gaze');
  if(gz){
    const dot=gz.querySelector('i');
    const place=()=>{dot.style.left=(50+S.eyes.gazeX*40)+'%';dot.style.top=(50+S.eyes.gazeY*40)+'%';};place();
    const mv=e=>{const r=gz.getBoundingClientRect();S.eyes.gazeX=clamp(((e.clientX-r.left)/r.width-.5)/.4,-1,1);S.eyes.gazeY=clamp(((e.clientY-r.top)/r.height-.5)/.4,-1,1);place();drawMain();};
    gz.onpointerdown=e=>{gz.setPointerCapture(e.pointerId);mv(e);gz.onpointermove=mv;};
    gz.onpointerup=()=>{gz.onpointermove=null;commit();refreshThumbs();};
    $('gazeReset').onclick=()=>{S.eyes.gazeX=0;S.eyes.gazeY=0;place();commit();drawMain();refreshThumbs();};
  }
  refreshThumbs();
}
function fmt(v){return v==null?'':Math.abs(v)>=10?Math.round(v):(+v).toFixed(2).replace(/\.?0+$/,'')||'0';}
function syncSide(){
  $('charName').value=S.name||'';
  $('bgType').value=S.bg.type;$('bgC1').value=S.bg.c1;$('bgC2').value=S.bg.c2;
  $('lnW').value=S.line.w;$('lnWo').textContent=fmt(S.line.w);$('lnWob').value=S.line.wob;$('lnWobo').textContent=fmt(S.line.wob);
  $('lnInk').value=S.line.ink;$('lnShade').checked=!!S.line.shade;
}
function renderAll(){renderSteps();renderPanel();drawMain();}
function syncAll(){syncSide();renderAll();updUndo();}

/* side panel controls */
$('bgSw').innerHTML=BGC.map(c=>`<button style="background:${c}" data-c="${c}" title="${c}"></button>`).join('');
$('bgSw').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.bg.c1=b.dataset.c;if(S.bg.type==='none')S.bg.type='solid';commit();syncSide();drawMain();});
$('bgType').onchange=e=>{S.bg.type=e.target.value;commit();drawMain();};
$('bgC1').oninput=e=>{S.bg.c1=e.target.value;drawMain();};$('bgC1').onchange=commit;
$('bgC2').oninput=e=>{S.bg.c2=e.target.value;drawMain();};$('bgC2').onchange=commit;
$('lnW').oninput=e=>{S.line.w=+e.target.value;$('lnWo').textContent=fmt(S.line.w);drawMain();};$('lnW').onchange=()=>{commit();refreshThumbs();};
$('lnWob').oninput=e=>{S.line.wob=+e.target.value;$('lnWobo').textContent=fmt(S.line.wob);drawMain();};$('lnWob').onchange=()=>{commit();refreshThumbs();};
$('lnInk').oninput=e=>{S.line.ink=e.target.value;drawMain();};$('lnInk').onchange=()=>{commit();refreshThumbs();};
$('lnShade').onchange=e=>{S.line.shade=e.target.checked;commit();drawMain();refreshThumbs();};
$('charName').oninput=e=>{S.name=e.target.value;};$('charName').onchange=commit;
$('undoBtn').onclick=()=>{if(hIx>0){hIx--;S=JSON.parse(hist[hIx]);lsSet(LS,hist[hIx]);syncAll();}};
$('redoBtn').onclick=()=>{if(hIx<hist.length-1){hIx++;S=JSON.parse(hist[hIx]);lsSet(LS,hist[hIx]);syncAll();}};
$('prevBtn').onclick=()=>{if(stepIx>0){stepIx--;renderAll();}};
$('nextBtn').onclick=()=>{if(stepIx<STEPS.length-1){stepIx++;renderAll();}else{$('pngBtn').focus();}};
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!/INPUT/.test(document.activeElement.tagName)){e.preventDefault();(e.shiftKey?$('redoBtn'):$('undoBtn')).click();}});

/* randomness */
const pick=a=>a[Math.floor(Math.random()*a.length)];
const rr=(a,b)=>a+Math.random()*(b-a);
function randomStep(i,s){
  const k=o=>pick(o)[0];
  if(i===0){Object.assign(s,buildPreset(Math.floor(Math.random()*PRESETS.length),s));}
  if(i===1){const sh=k(OPT.head);s.head=Object.assign({shape:sh,asym:rr(-.2,.2)},HEADS[sh]);s.head.w+=rr(-5,5);s.head.jaw+=rr(-6,6);s.skin=pick(SKINS.slice(0,9));s.nose.type=k(OPT.nose.slice(1));s.nose.size=rr(.85,1.2);s.face.blush=Math.random()<.35?rr(.3,1):0;s.face.freckles=Math.random()<.2?rr(.4,1.1):0;s.face.scar=Math.random()<.1;s.face.plaster=Math.random()<.1;s.body.collar=k(OPT.collar);s.body.shirt=pick(SHIRTC);}
  if(i===2){s.hair.top=k(OPT.top.slice(2,8));s.hair.back=Math.random()<.5?'none':k(OPT.back);s.hair.bangs=Math.random()<.15?'none':k(OPT.bangs.slice(1));const b=BANGS[s.hair.bangs];s.hair.part=b?b.part:0;s.hair.sweep=b?b.sweep:0;s.hair.side=Math.random()<.6?'none':k(OPT.side);s.hair.color=pick(HAIRC);s.hair.vol=rr(.85,1.25);s.hair.spike=rr(.6,1.4);s.hair.ahoge=Math.random()<.2;}
  if(i===3){s.brows.type=k(OPT.brows.slice(1));s.brows.thick=rr(.7,1.3);s.brows.tilt=rr(-.4,.6);s.brows.asym=Math.random()<.25?rr(-.6,.6):0;s.facial.beard=Math.random()<.75?'none':k(OPT.beard);s.facial.must=Math.random()<.8?'none':k(OPT.must);}
  if(i===4){s.eyes.shape=k(OPT.eyes.slice(0,8));s.eyes.size=rr(.9,1.15);s.eyes.tilt=rr(-.15,.25);s.eyes.iris=pick(IRISC);s.eyes.irisStyle=Math.random()<.7?'manga':k(OPT.irisStyle);s.eyes.pupil=Math.random()<.85?'round':k(OPT.pupil);s.eyes.lashes=k(OPT.lashes);s.eyes.highlights=1+Math.floor(rr(0,3));s.eyes.gazeX=rr(-.35,.35);s.eyes.glasses=Math.random()<.85?'none':k(OPT.glasses);s.eyes.open=rr(.85,1.05);}
  if(i===5){s.mouth.type=k(OPT.mouth);s.mouth.width=rr(.8,1.2);s.mouth.curve=rr(-.2,.9);s.mouth.open=rr(.2,.7);s.mouth.lipColor=pick(LIPC);}
  if(i===6){s.ears.type=Math.random()<.15?pick(['cat','elf','pointed']):k(OPT.ears.slice(1,4));s.ears.size=rr(.9,1.15);s.ears.ring=Math.random()<.75?'none':k(OPT.ring);}
  s.seed=Math.floor(Math.random()*9999);
}
$('randBtn').onclick=()=>{for(let i=1;i<7;i++)randomStep(i,S);S.name='';presetIx=-1;commit();syncAll();};
$('shuffleStep').onclick=()=>{randomStep(stepIx,S);commit();syncAll();};

/* export */
function fileBase(){return(S.name||'carabox-character').trim().replace(/[^\w\- ]+/g,'').replace(/\s+/g,'-').toLowerCase()||'carabox';}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
$('svgBtn').onclick=()=>download(new Blob([render(S,{prefix:'x'})],{type:'image/svg+xml'}),fileBase()+'.svg');
$('pngBtn').onclick=()=>{
  const svg=render(S,{prefix:'x'}).replace('<svg ','<svg width="1600" height="2000" ');
  const img=new Image();
  img.onload=()=>{const c=document.createElement('canvas');c.width=1600;c.height=2000;c.getContext('2d').drawImage(img,0,0,1600,2000);c.toBlob(b=>download(b,fileBase()+'.png'),'image/png');};
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
};
$('saveBtn').onclick=()=>download(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}),fileBase()+'.carabox.json');
$('loadBtn').onclick=()=>$('loadFile').click();
$('loadFile').onchange=e=>{const fl=e.target.files[0];if(!fl)return;fl.text().then(t=>{try{const o=JSON.parse(t);if(!o.head||!o.eyes)throw 0;S=merge(clone(DEF),o);commit();syncAll();}catch(err){alert('That file is not a Carabox character.');}});e.target.value='';};

/* theme */
function setTheme(t){document.documentElement.dataset.theme=t;document.querySelector('.switch').setAttribute('aria-checked',t==='dark');lsSet('carabox.theme',t);}
setTheme(lsGet('carabox.theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
const flip=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
$('themeToggle').onclick=e=>{e.preventDefault();flip();};
document.querySelector('.switch').onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();flip();}};

syncAll();
</script>
</body>
