<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carabox</title>
<style>
:root{
  --bg:#f2eee7; --panel:#fffdf9; --ink:#1e1b18; --muted:#6f685f; --line:#e4ded4;
  --accent:#e4572e; --accent-ink:#fff; --chip:#f2ede5; --chip-on:#1e1b18; --chip-on-ink:#fff;
  --thumb:#f6f1e8; --shadow:0 1px 2px rgba(0,0,0,.05),0 10px 30px rgba(40,30,20,.07);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#000; --panel:#111; --ink:#f2eee8; --muted:#9a948c; --line:#262626;
  --accent:#ff7a50; --accent-ink:#140b06; --chip:#1c1c1c; --chip-on:#f2eee8; --chip-on-ink:#111;
  --thumb:#efe9df; --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
button,input,select{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:14px;padding:14px 24px;border-bottom:1px solid var(--line);position:relative}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{margin:0;font-size:26px;letter-spacing:-.02em;font-weight:800}
.brand h1 span{display:inline-block;transform:rotate(-4deg);color:var(--accent)}
.brand small{color:var(--muted)}
.spacer{flex:1}
.theme{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;color:var(--muted);font-size:13px}
.switch{width:44px;height:24px;border-radius:12px;background:var(--chip);border:1px solid var(--line);position:relative;transition:background .2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--ink);transition:transform .2s}
:root[data-theme="dark"] .switch{background:var(--accent)}
:root[data-theme="dark"] .switch::after{transform:translateX(20px);background:#000}
main{display:grid;grid-template-columns:minmax(300px,500px) minmax(0,1fr);gap:24px;padding:20px 24px 40px;max-width:1500px;margin:0 auto}
.stagecol{position:sticky;top:16px;align-self:start;display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.stage{padding:12px}
.stage .art{aspect-ratio:4/5;border-radius:10px;overflow:hidden;background:repeating-conic-gradient(#ddd 0 25%,#fff 0 50%) 0 0/20px 20px}
.stage svg{display:block;width:100%;height:100%}
.namerow{display:flex;gap:8px;margin-top:10px}
.namerow input{flex:1;min-width:0;background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-weight:600}
.btn{background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
.btn:disabled{opacity:.4;cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px}
.sub{padding:12px 14px}
.sub h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.steps{display:flex;gap:6px;overflow-x:auto;padding:10px;scrollbar-width:thin}
.step{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--chip);cursor:pointer;white-space:nowrap}
.step b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--panel);font-size:12px}
.step.on{background:var(--chip-on);color:var(--chip-on-ink);border-color:transparent}
.step.on b{background:var(--accent);color:var(--accent-ink)}
.panel{padding:6px 18px 18px}
.panel h2{margin:12px 0 2px;font-size:20px}
.panel .lead{color:var(--muted);margin:0 0 6px}
.sec{border-top:1px solid var(--line);padding:14px 0 6px;margin-top:10px}
.sec:first-of-type{border-top:0}
.sec h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.opts.big{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
.opt{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:5px;cursor:pointer;display:flex;flex-direction:column;gap:4px;text-align:center;transition:transform .08s,border-color .15s}
.opt:hover{transform:translateY(-1px);border-color:var(--muted)}
.opt.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.opt .th{aspect-ratio:1;border-radius:8px;background:var(--thumb);overflow:hidden}
.opt .th svg{width:100%;height:100%;display:block}
.opt span{font-size:12px;line-height:1.2;padding:0 2px 2px}
.opt em{font-style:normal;font-size:11px;color:var(--muted);display:block}
.sliders{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:4px 22px}
.sl{display:grid;grid-template-columns:110px 1fr 38px;align-items:center;gap:8px;min-height:30px}
.sl label{font-size:13px}
.sl output{font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted);text-align:right}
input[type=range]{width:100%;accent-color:var(--accent)}
.sw{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.sw button{width:30px;height:30px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.sw button.on{box-shadow:0 0 0 2px var(--accent)}
.sw input[type=color]{width:34px;height:34px;border:0;background:none;padding:0;cursor:pointer}
.sw .match{width:auto;height:30px;border-radius:999px;padding:0 12px;background:var(--chip);color:var(--ink);font-size:12px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--chip);cursor:pointer}
.seg button.on{background:var(--chip-on);color:var(--chip-on-ink);border-color:transparent}
.checks{display:flex;flex-wrap:wrap;gap:8px 18px}
.checks label{display:flex;align-items:center;gap:6px;cursor:pointer}
.checks input{accent-color:var(--accent);width:16px;height:16px}
.gazewrap{display:flex;gap:16px;align-items:center}
.gaze{width:120px;height:90px;border-radius:12px;background:var(--chip);border:1px solid var(--line);position:relative;cursor:crosshair;touch-action:none}
.gaze::before,.gaze::after{content:"";position:absolute;background:var(--line)}
.gaze::before{left:50%;top:8px;bottom:8px;width:1px}
.gaze::after{top:50%;left:8px;right:8px;height:1px}
.gaze i{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--accent);z-index:1}
.nav{display:flex;justify-content:space-between;gap:8px;padding:14px 18px;border-top:1px solid var(--line)}
.bgrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bgrow select{background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:7px 8px}
.bgrow input[type=color]{width:34px;height:34px;border:0;background:none;padding:0;cursor:pointer}
.mini{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;margin-top:10px;font-size:13px}
.hint{color:var(--muted);font-size:12px}
@media (max-width:860px){
  header{padding:12px 16px}
  .brand small{display:none}
  main{grid-template-columns:1fr;padding:12px 16px 32px;gap:14px}
  .stagecol{position:static}
  .stage .art{max-width:380px;margin:0 auto}
  .opts{grid-template-columns:repeat(auto-fill,minmax(80px,1fr))}
  .sl{grid-template-columns:96px 1fr 34px}
}
</style>
</head>
<body>
<header>
  <div class="brand"><h1>Cara<span>box</span></h1><small>character face designer</small></div>
  <div class="spacer"></div>
  <label class="theme" id="themeToggle" title="Toggle dark mode"><span>Dark mode</span><div class="switch" role="switch" aria-checked="false" tabindex="0"></div></label>
</header>
<main>
  <div class="stagecol">
    <div class="card stage">
      <div class="art" id="art"></div>
      <div class="namerow">
        <input id="charName" placeholder="Character name" maxlength="40">
        <button class="btn" id="undoBtn" title="Undo">↶</button>
        <button class="btn" id="redoBtn" title="Redo">↷</button>
      </div>
    </div>
    <div class="card sub">
      <h4>Picture background</h4>
      <div class="bgrow">
        <select id="bgType">
          <option value="solid">Solid</option><option value="gradient">Gradient</option><option value="spot">Spotlight</option>
          <option value="halftone">Halftone dots</option><option value="stripes">Stripes</option><option value="burst">Sunburst</option><option value="none">Transparent</option>
        </select>
        <input type="color" id="bgC1" title="Main colour"><input type="color" id="bgC2" title="Second colour">
        <div class="sw" id="bgSw"></div>
      </div>
      <h4 style="margin-top:14px">Line style</h4>
      <div class="mini">
        <label for="lnW">Line weight</label><input type="range" id="lnW" min="1.2" max="5" step="0.1"><output id="lnWo"></output>
        <label for="lnWob">Hand wobble</label><input type="range" id="lnWob" min="0" max="3" step="0.1"><output id="lnWobo"></output>
        <label for="lnInk">Ink colour</label><input type="color" id="lnInk"><span></span>
        <label for="lnShade">Cel shading</label><input type="checkbox" id="lnShade" style="justify-self:start;accent-color:var(--accent)"><span></span>
      </div>
    </div>
    <div class="card actions">
      <button class="btn primary" id="randBtn">Surprise me</button>
      <button class="btn" id="pngBtn">Export PNG</button>
      <button class="btn" id="svgBtn">Export SVG</button>
      <button class="btn" id="saveBtn">Save .json</button>
      <button class="btn" id="loadBtn">Load .json</button>
      <input type="file" id="loadFile" accept=".json,application/json" hidden>
    </div>
  </div>
  <div class="card">
    <div class="steps" id="steps"></div>
    <div class="panel" id="panel"></div>
    <div class="nav"><button class="btn" id="prevBtn">← Back</button><button class="btn" id="shuffleStep">Shuffle this step</button><button class="btn primary" id="nextBtn">Next →</button></div>
  </div>
</main>
<script>
"use strict";
/* ================================================================
   Carabox — layered parametric face engine.
   Every feature is its own generator working from a shared head
   geometry (sampled outline + ray casting), so hair, beards and ears
   follow whatever head shape is chosen.
   ================================================================ */
const CX=200, Y0=245, VW=400, VH=500;
const f=n=>Math.round(n*10)/10;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const clone=o=>JSON.parse(JSON.stringify(o));
function rng(seed){let a=(seed*2654435761)>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function merge(t,s){for(const k in s){if(s[k]&&typeof s[k]==='object'&&!Array.isArray(s[k])){if(!t[k]||typeof t[k]!=='object')t[k]={};merge(t[k],s[k]);}else t[k]=s[k];}return t;}

/* ---------- colour ---------- */
function h2r(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return[n>>16&255,n>>8&255,n&255];}
function r2h(r){return'#'+r.map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join('');}
function mix(a,b,t){const A=h2r(a),B=h2r(b);return r2h(A.map((v,i)=>v+(B[i]-v)*t));}
const darken=(c,t)=>mix(c,'#000000',t), lighten=(c,t)=>mix(c,'#ffffff',t);

/* ---------- curves ---------- */
// Catmull-Rom → cubic Bézier. A point may carry its own tension as p[2] (0 = sharp corner).
function crSegs(pts,closed,k){
  const n=pts.length,out=[];
  const g=i=>closed?pts[(i+n)%n]:pts[clamp(i,0,n-1)];
  const segs=closed?n:n-1;
  for(let i=0;i<segs;i++){
    const p0=g(i-1),p1=g(i),p2=g(i+1),p3=g(i+2);
    const k1=p1[2]??k,k2=p2[2]??k;
    out.push([p1,[p1[0]+(p2[0]-p0[0])*k1/6,p1[1]+(p2[1]-p0[1])*k1/6],[p2[0]-(p3[0]-p1[0])*k2/6,p2[1]-(p3[1]-p1[1])*k2/6],p2]);
  }
  return out;
}
function segsPath(segs,closed,noM){
  let d=noM?'':`M${f(segs[0][0][0])},${f(segs[0][0][1])}`;
  for(const[,c1,c2,p]of segs)d+=`C${f(c1[0])},${f(c1[1])} ${f(c2[0])},${f(c2[1])} ${f(p[0])},${f(p[1])}`;
  return closed?d+'Z':d;
}
const smooth=(pts,closed,k=1,noM)=>pts.length<2?'':segsPath(crSegs(pts,closed,k),closed,noM);
const poly=(pts,closed)=>pts.map((p,i)=>(i?'L':'M')+f(p[0])+','+f(p[1])).join('')+(closed?'Z':'');
function bez(p0,c1,c2,p1,t){const u=1-t;return[u*u*u*p0[0]+3*u*u*t*c1[0]+3*u*t*t*c2[0]+t*t*t*p1[0],u*u*u*p0[1]+3*u*u*t*c1[1]+3*u*t*t*c2[1]+t*t*t*p1[1]];}
function sampleSegs(segs,steps){const out=[];for(const s of segs)for(let i=0;i<steps;i++)out.push(bez(s[0],s[1],s[2],s[3],i/steps));return out;}
function rayHit(P,cx,cy,ang){
  const dx=Math.cos(ang),dy=Math.sin(ang);let best=0;
  for(let i=0;i<P.length;i++){
    const a=P[i],b=P[(i+1)%P.length],ex=b[0]-a[0],ey=b[1]-a[1],den=dx*ey-dy*ex;
    if(Math.abs(den)<1e-9)continue;
    const ax=a[0]-cx,ay=a[1]-cy,t=(ax*ey-ay*ex)/den,s=(ax*dy-ay*dx)/den;
    if(t>0&&s>=0&&s<=1&&t>best)best=t;
  }
  return best;
}
function spanAt(P,y){
  let l=Infinity,r=-Infinity;
  for(let i=0;i<P.length;i++){const a=P[i],b=P[(i+1)%P.length];
    if((a[1]-y)*(b[1]-y)<=0&&a[1]!==b[1]){const x=a[0]+(b[0]-a[0])*(y-a[1])/(b[1]-a[1]);l=Math.min(l,x);r=Math.max(r,x);}}
  if(l===Infinity)return{l:CX-60,r:CX+60};
  return{l,r};
}

/* ================================================================
   Option catalogues
   ================================================================ */
const HEADS={
  round:   {w:118,top:150,tw:.97,cheek:20,jaw:100,chin:125,chinW:46,smooth:1},
  oval:    {w:108,top:155,tw:.95,cheek:14,jaw:84, chin:140,chinW:28,smooth:1},
  long:    {w:96, top:168,tw:.97,cheek:22,jaw:82, chin:168,chinW:30,smooth:.95},
  square:  {w:114,top:148,tw:.98,cheek:16,jaw:110,chin:135,chinW:64,smooth:.5},
  heart:   {w:118,top:155,tw:1,  cheek:4, jaw:72, chin:140,chinW:10,smooth:.9},
  diamond: {w:108,top:152,tw:.8, cheek:22,jaw:74, chin:140,chinW:12,smooth:.75},
  pear:    {w:110,top:140,tw:.8, cheek:34,jaw:116,chin:132,chinW:60,smooth:.95},
  vshape:  {w:120,top:152,tw:1,  cheek:10,jaw:64, chin:152,chinW:4, smooth:.6},
  bean:    {w:142,top:165,tw:.98,cheek:30,jaw:132,chin:112,chinW:72,smooth:1},
  brick:   {w:110,top:156,tw:1.02,cheek:20,jaw:108,chin:152,chinW:74,smooth:.35},
  egg:     {w:104,top:172,tw:.9, cheek:26,jaw:98, chin:118,chinW:52,smooth:1},
  chiseled:{w:110,top:152,tw:.95,cheek:6, jaw:98, chin:150,chinW:32,smooth:.4},
};
const L=(o)=>Object.entries(o);
const OPT={
  head:L({round:'Round',oval:'Oval',long:'Long',square:'Square',heart:'Heart',diamond:'Diamond',pear:'Pear',vshape:'V-shape',bean:'Big bean',brick:'Brick',egg:'Egg',chiseled:'Chiselled'}),
  nose:L({none:'None',dot:'Dot',tiny:'Tiny',button:'Button',bump:'Bump',line:'Line',hook:'Hook',long:'Long',bulb:'Bulb',wide:'Wide',snub:'Snub',aquiline:'Aquiline',triangle:'Triangle'}),
  collar:L({crew:'Crew',vneck:'V-neck',collar:'Collar',turtle:'Turtleneck'}),
  top:L({bald:'Bald',buzz:'Buzz',crop:'Crop',smooth:'Smooth',part:'Side part',swept:'Quiff',spiky:'Spiky',messy:'Messy',curly:'Curly',afro:'Afro',flattop:'Flat top',mohawk:'Mohawk',sides:'Horseshoe',tuft:'Scribble tuft'}),
  back:L({none:'None',bob:'Bob',shoulder:'Shoulder',long:'Long',wavy:'Long wavy',ponytail:'Ponytail',twintails:'Twin tails',bun:'Top bun'}),
  bangs:L({none:'None',blunt:'Blunt',choppy:'Choppy',spikes:'Short spikes',side:'Side swept',curtain:'Curtain',wispy:'Wispy'}),
  side:L({none:'None',short:'Short locks',long:'Long locks',braids:'Braids'}),
  brows:L({none:'None',natural:'Natural',straight:'Straight',arched:'Arched',angular:'Angular',thick:'Thick',thin:'Thin',bushy:'Bushy',dash:'Dash',unibrow:'Unibrow'}),
  beard:L({none:'None',stubble:'Stubble',full:'Full',boxed:'Boxed',long:'Long',goatee:'Goatee',chinstrap:'Chin strap',soulpatch:'Soul patch',mutton:'Mutton chops'}),
  must:L({none:'None',chevron:'Chevron',pencil:'Pencil',handlebar:'Handlebar',walrus:'Walrus',toothbrush:'Toothbrush',curly:'Curled up'}),
  eyes:L({dot:'Dot',bean:'Bean',round:'Round',almond:'Almond',manga:'Manga',sharp:'Sharp',droopy:'Droopy',narrow:'Narrow',hooded:'Hooded',sleepy:'Sleepy',wide:'Wide',happy:'Closed happy'}),
  irisStyle:L({solid:'Solid',gradient:'Gradient',ringed:'Ringed',manga:'Manga shine'}),
  pupil:L({round:'Round',small:'Pinpoint',slit:'Slit',none:'None'}),
  lashes:L({none:'None',few:'Few',many:'Many',wing:'Winged liner'}),
  glasses:L({none:'None',round:'Round',square:'Square',halfmoon:'Half-moon',shades:'Shades'}),
  mouth:L({line:'Line',smile:'Smile',open:'Open',grin:'Grin',laugh:'Laugh',tiny:'Tiny',o:'O',smirk:'Smirk',frown:'Frown',flat:'Flat',wavy:'Wavy',cat:'Cat',lips:'Full lips',buck:'Buck teeth',gritted:'Gritted',fang:'Fang'}),
  ears:L({none:'Hidden',round:'Round',small:'Small',jug:'Jug',flat:'Flat',lobe:'Lobed',pointed:'Pointed',cat:'Cat',bear:'Bear'}),
  ring:L({none:'None',stud:'Stud',hoop:'Hoop'}),
};
const SKINS=['#FFE6D3','#F7D4B8','#F0C19C','#E3AA80','#D09267','#B7784F','#99603B','#7B4629','#5C3320','#3F2417','#D7E8CF','#CBD8F2','#ECE4EA'];
const HAIRC=['#141210','#2B1D16','#4A3122','#6E4A2E','#9C7650','#B5452B','#D98A3A','#E8D08C','#C9C4BD','#EEEAE2','#F2A7C3','#36C26E','#3A6FD8','#7A4FB8'];
const IRISC=['#3D2314','#6B4226','#8A6A2E','#5B7F3A','#2E7D32','#2BA39A','#4A6A8A','#3A6FD8','#7A4FB8','#B3122E','#C77D1A','#5A5A5A'];
const SHIRTC=['#3E6FB0','#E3B23C','#D9534F','#2F8F6B','#7B5EA7','#222222','#EDEAE4','#E07A5F','#5C6B73','#F2A7C3'];
const LIPC=['#C96A6A','#B23A48','#9C2F4A','#D98880','#8E3B3B','#6A2C3A','#E59A9A'];
const BGC=['#F4E9D8','#FFFFFF','#E8F1F2','#FCE1E4','#E0F0D9','#FFE9A8','#CFE3FF','#2B2D42','#111111','#E4572E'];

const DEF={
  seed:7, name:'',
  skin:'#F0C19C',
  head:Object.assign({shape:'oval',asym:0},HEADS.oval),
  nose:{type:'button',size:1,y:0},
  face:{blush:0,freckles:0,smile:0,forehead:0,cleft:false,mole:false},
  body:{shirt:'#3E6FB0',collar:'crew'},
  hair:{top:'crop',back:'none',bangs:'none',side:'none',color:'#3B2A20',vol:1,hairline:.5,bangLen:1,shine:true,ahoge:false,peak:false},
  brows:{type:'natural',thick:1,tilt:0,height:0,asym:0,color:null},
  facial:{beard:'none',must:'none',len:1,color:null},
  eyes:{shape:'almond',size:1,spacing:1,y:0,tilt:0,open:1,iris:'#5B7F3A',irisSize:1,irisStyle:'gradient',pupil:'round',pupilSize:1,highlights:2,lashes:'few',lower:false,crease:true,bags:false,gazeX:0,gazeY:0,glasses:'none',glassColor:'#2A2522'},
  mouth:{type:'smile',width:1,curve:.4,open:.5,y:0,skew:0,lips:0,lipColor:'#C96A6A'},
  ears:{type:'round',size:1,y:0,ring:'none'},
  bg:{type:'solid',c1:'#F4E9D8',c2:'#E7C9A0'},
  line:{w:2.6,wob:1,ink:'#1E1B18',shade:true},
};

  const p=PRESETS[i],o=clone(p.o),st=merge(clone(DEF),o);

  st.head=Object.assign({shape,asym:0},HEADS[shape],o.head||{});

/* ================================================================
   Geometry
   ================================================================ */
function geom(s){
  const h=s.head,a=h.asym||0,w=h.w,top=h.top,chin=h.chin;
  const P=(sx,dx,dy)=>[CX+sx*dx*(sx<0?1-a*.07:1+a*.03),Y0+dy+(sx<0&&dy>0?a*5:0)];
  const up=w*.7*(.55+.45*h.tw);
  const ctrl=[[CX+a*3,Y0-top],P(1,up,-top*.86),P(1,w*h.tw,-top*.4),P(1,w,h.cheek),P(1,h.jaw,chin*.62),P(1,h.chinW,chin*.94),[CX+a*7,Y0+chin],
    P(-1,h.chinW,chin*.94),P(-1,h.jaw,chin*.62),P(-1,w,h.cheek),P(-1,w*h.tw,-top*.4),P(-1,up,-top*.86)];
  const segs=crSegs(ctrl,true,h.smooth);
  const g={W:s.line.w,ink:s.line.ink,path:segsPath(segs,true),poly:sampleSegs(segs,12)};
  g.cc=[CX,Y0-top*.12];
  g.headR=ang=>rayHit(g.poly,g.cc[0],g.cc[1],ang);
  g.span=y=>spanAt(g.poly,y);
  g.crownY=Y0-top;g.chinY=Y0+chin;
  const sz=Math.sqrt(w/112);
  g.ew=33*s.eyes.size*sz;
  g.eyeY=Y0+s.eyes.y;
  g.eyeDX=w*.4*s.eyes.spacing;
  g.noseY=Y0+chin*.36+s.nose.y;
  g.mouthY=Y0+chin*.64+s.mouth.y;
  g.mw=44*s.mouth.width*sz;
  g.earY=Y0+16+s.ears.y;
  g.hairY=Y0-top*s.hair.hairline;
  g.nw=clamp(h.jaw*.46,26,62);
  g.sY=Math.min(Y0+chin+38,468);
  g.skinSh=mix(s.skin,'#7a3b2a',.2);
  g.skinHi=lighten(s.skin,.35);
  return g;
}

const st=(g,w,extra='')=>`fill="none" stroke="${g.ink}" stroke-width="${f(w)}" stroke-linecap="round" stroke-linejoin="round"${extra}`;

function bgSVG(s,p){
  const b=s.bg;let d='',r='';

  if(b.type==='spot'){d=`<radialGradient id="${p}bg" cx=".5" cy=".42" r=".7"><stop offset="0" stop-color="${b.c1}"/><stop offset="1" stop-color="${b.c2}"/></radialGradient>`;r=`<rect width="${VW}" height="${VH}" fill="url(#${p}bg)"/>`;}
  if(b.type==='halftone'){d=`<pattern id="${p}bg" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><circle cx="7" cy="7" r="3.2" fill="${b.c2}"/></pattern>`;r=`<rect width="${VW}" height="${VH}" fill="${b.c1}"/><rect width="${VW}" height="${VH}" fill="url(#${p}bg)"/>`;}
  if(b.type==='stripes'){d=`<pattern id="${p}bg" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)"><rect width="14" height="28" fill="${b.c2}"/></pattern>`;r=`<rect width="${VW}" height="${VH}" fill="${b.c1}"/><rect width="${VW}" height="${VH}" fill="url(#${p}bg)"/>`;}
  if(b.type==='burst'){let rays='';const n=24,cx=CX,cy=230,R=520;for(let i=0;i<n;i+=2){const a1=i/n*Math.PI*2,a2=(i+1)/n*Math.PI*2;rays+=`M${cx},${cy}L${f(cx+Math.cos(a1)*R)},${f(cy+Math.sin(a1)*R)}L${f(cx+Math.cos(a2)*R)},${f(cy+Math.sin(a2)*R)}Z`;}r=`<rect width="${VW}" height="${VH}" fill="${b.c1}"/><path d="${rays}" fill="${b.c2}"/>`;}
  return(d?`<defs>${d}</defs>`:'')+r;

    (col==='vneck'?`L${CX},${f(sY+38)}L${f(CX+nw)},${f(sY-6)}`:`Q${CX},${f(sY+20)} ${f(CX+nw)},${f(sY-6)}`)+
    `C${CX+120},${f(sY-4)} ${CX+170},${f(sY+4)} ${VW+10},${f(sY+44)}L${VW+10},${VH+10}Z`;

  return{shoulders:o,neck,neckFill:`<path d="${neck}" fill="${s.skin}"/>`};
}
function collarSVG(s,g){

  if(c==='vneck')return`<path d="M${f(CX-nw-4)},${f(sY-8)}L${CX},${f(sY+42)}L${f(CX+nw+4)},${f(sY-8)}" ${st(g,g.W*.9)}/>`;

/* ---------- ears ---------- */
function earShape(t,h){
  switch(t){
    case'small':h*=.72;/* falls through */
    case'round':return[`M0,${f(-h*.45)}C${f(h*.5)},${f(-h*.62)} ${f(h*.62)},${f(h*.15)} ${f(h*.18)},${f(h*.45)}L-2,${f(h*.4)}`,`M${f(h*.1)},${f(-h*.22)}C${f(h*.34)},${f(-h*.3)} ${f(h*.38)},${f(h*.08)} ${f(h*.14)},${f(h*.2)}`,[h*.2,h*.36]];
    case'jug':return[`M0,${f(-h*.4)}C${f(h*.8)},${f(-h*.8)} ${f(h*.9)},${f(h*.22)} ${f(h*.2)},${f(h*.46)}L-2,${f(h*.38)}`,`M${f(h*.14)},${f(-h*.2)}C${f(h*.55)},${f(-h*.4)} ${f(h*.55)},${f(h*.12)} ${f(h*.18)},${f(h*.22)}`,[h*.22,h*.38]];
    case'flat':return[`M0,${f(-h*.4)}C${f(h*.3)},${f(-h*.46)} ${f(h*.34)},${f(h*.3)} ${f(h*.08)},${f(h*.42)}L-2,${f(h*.38)}`,`M${f(h*.06)},${f(-h*.18)}C${f(h*.2)},${f(-h*.2)} ${f(h*.2)},${f(h*.1)} ${f(h*.06)},${f(h*.16)}`,[h*.1,h*.36]];
    case'lobe':return[`M0,${f(-h*.45)}C${f(h*.5)},${f(-h*.6)} ${f(h*.56)},${f(h*.1)} ${f(h*.34)},${f(h*.32)}C${f(h*.32)},${f(h*.64)} ${f(h*.06)},${f(h*.66)} -2,${f(h*.46)}`,`M${f(h*.1)},${f(-h*.22)}C${f(h*.34)},${f(-h*.28)} ${f(h*.36)},${f(h*.06)} ${f(h*.14)},${f(h*.16)}`,[h*.18,h*.5]];
    case'pointed':return[`M0,${f(-h*.3)}C${f(h*.25)},${f(-h*.42)} ${f(h*.72)},${f(-h*.85)} ${f(h*.98)},${f(-h*.98)}C${f(h*.78)},${f(-h*.45)} ${f(h*.56)},${f(h*.15)} ${f(h*.16)},${f(h*.42)}L-2,${f(h*.38)}`,`M${f(h*.12)},${f(-h*.18)}C${f(h*.4)},${f(-h*.4)} ${f(h*.55)},${f(-h*.55)} ${f(h*.62)},${f(-h*.6)}`,[h*.18,h*.36]];

function ears(s,g,p){

  const h=56*E.size*Math.sqrt(s.head.w/112);
  if(E.type==='cat'||E.type==='bear'){
    let o='';
    for(const sx of[1,-1]){
      const ang=-Math.PI/2+sx*.62,r=g.headR(ang),bx=g.cc[0]+Math.cos(ang)*r,by=g.cc[1]+Math.sin(ang)*r,rot=sx*34;
      const sc=E.size;
      if(E.type==='cat')o+=`<g transform="translate(${f(bx)} ${f(by+8)}) rotate(${rot}) scale(${f(sc)})"><path d="M-26,10L-4,-46Q0,-50 4,-46L26,10Z" ${fs(g,s.hair.top==='bald'||s.hair.top==='tuft'?s.skin:s.hair.color,g.W/sc)}/><path d="M-13,4L-1,-28L12,4Z" fill="#F2A7B5" opacity=".9"/></g>`;
      else o+=`<g transform="translate(${f(bx)} ${f(by+6)}) rotate(${rot}) scale(${f(sc)})"><circle cx="0" cy="-12" r="22" ${fs(g,s.hair.top==='bald'||s.hair.top==='tuft'?s.skin:s.hair.color,g.W/sc)}/><circle cx="0" cy="-12" r="11" fill="#E9A7A0" opacity=".85"/></g>`;
    }
    return o;
  }
  const sh=earShape(E.type,h);if(!sh)return'';
  let o='';
  for(const sx of[1,-1]){
    const sp=g.span(g.earY),x=(sx>0?sp.r:sp.l)-sx*4;
    const tilt=E.type==='jug'?-6:E.type==='pointed'?-4:0;
    o+=`<g transform="translate(${f(x)} ${f(g.earY)}) scale(${sx} 1) rotate(${tilt})"><path d="${sh[0]}Z" ${fs(g,s.skin,g.W)}/><path d="${sh[1]}" ${st(g,g.W*.6)}/>`;
    if(s.line.shade)o+=`<path d="${sh[1]}" fill="none" stroke="${g.skinSh}" stroke-width="${f(g.W*2.2)}" opacity=".45"/>`;
    if(E.ring==='stud')o+=`<circle cx="${f(sh[2][0])}" cy="${f(sh[2][1])}" r="3.4" fill="#E8C35A" stroke="${g.ink}" stroke-width="${f(g.W*.4)}"/>`;

}

const TOPS={

function capPath(s,g,rand){

      if(E.highlights>0)e+=`<circle cx="${f(cx-rx*.35*sx)}" cy="${f(cy-ry*.4)}" r="${f(rx*.38)}" fill="#fff"/>`;
    }else if(E.shape==='happy'){
      const w=ew0*.95;
      e+=`<path d="M${f(-w/2)},${f(w*.12)}Q0,${f(-w*.42)} ${f(w/2)},${f(w*.12)}" ${st(g,W*1.3)}/>`;
      if(E.lashes!=='none')e+=`<path d="M${f(w/2)},${f(w*.12)}l${f(w*.15)},${f(-w*.08)}" ${st(g,W)}/>`;
    }else{
      const sh=EYE[E.shape]||EYE.almond;
      const ew=ew0*sh.w,eh=ew*sh.h*E.open,ti=(sh.tilt+E.tilt)*ew*.25;
      const I=[-ew/2,ti*.3],O=[ew/2,-ti];
      const u1=[I[0]+ew*(.15+sh.up),-eh*sh.uh],u2=[O[0]-ew*(.2-sh.up),-eh*sh.uh*sh.uo+(-ti*.5)];
      const l1=[O[0]-ew*.2,eh*sh.lh-ti*.3],l2=[I[0]+ew*.22,eh*sh.lh];
      const up=`M${f(I[0])},${f(I[1])}C${f(u1[0])},${f(u1[1])} ${f(u2[0])},${f(u2[1])} ${f(O[0])},${f(O[1])}`;
      const low=`C${f(l1[0])},${f(l1[1])} ${f(l2[0])},${f(l2[1])} ${f(I[0])},${f(I[1])}`;
      const id=`${p}ec${sx>0?'r':'l'}`;
      defs+=`<clipPath id="${id}"><path d="${up}${low}Z"/></clipPath>`;
      // iris
      const ir=ew*.31*E.irisSize*(sh.big?1.12:1);
      const icx=gx*ew*.22,icy=eh*.08+E.gazeY*eh*.35;
      const iry=ir*(sh.big?1.22:1);
      let iris='';
      const fill=E.irisStyle==='solid'?ic:E.irisStyle==='manga'?`url(#${p}im)`:E.irisStyle==='gradient'?`url(#${p}ig)`:ic;
      iris+=`<ellipse cx="${f(icx)}" cy="${f(icy)}" rx="${f(ir)}" ry="${f(iry)}" fill="${fill}" stroke="${darken(ic,.55)}" stroke-width="${f(W*.55)}"/>`;
      if(E.irisStyle==='ringed')iris+=`<ellipse cx="${f(icx)}" cy="${f(icy)}" rx="${f(ir*.62)}" ry="${f(iry*.62)}" fill="none" stroke="${lighten(ic,.4)}" stroke-width="${f(W*.6)}" opacity=".9"/>`;
      if(E.irisStyle==='manga')iris+=`<ellipse cx="${f(icx)}" cy="${f(icy+iry*.45)}" rx="${f(ir*.6)}" ry="${f(iry*.28)}" fill="${lighten(ic,.6)}" opacity=".55"/>`;
      const pr=ir*.45*E.pupilSize;
      if(E.pupil==='round')iris+=`<ellipse cx="${f(icx)}" cy="${f(icy)}" rx="${f(pr)}" ry="${f(pr*(sh.big?1.15:1))}" fill="#120e0c"/>`;
      if(E.pupil==='small')iris+=`<circle cx="${f(icx)}" cy="${f(icy)}" r="${f(pr*.45)}" fill="#120e0c"/>`;
      if(E.pupil==='slit')iris+=`<ellipse cx="${f(icx)}" cy="${f(icy)}" rx="${f(ir*.16*E.pupilSize)}" ry="${f(iry*.82)}" fill="#120e0c"/>`;
      const hl=[[-.38,-.42,.3],[.36,.36,.14],[.12,-.62,.09]];
      for(let i=0;i<E.highlights;i++){const h=hl[i];iris+=`<circle cx="${f(icx+h[0]*ir*sx)}" cy="${f(icy+h[1]*iry)}" r="${f(ir*h[2]*(sh.big?1.2:1))}" fill="#fff"/>`;}
      e+=`<path d="${up}${low}Z" fill="#FBF8F2"/>`;
      e+=`<g clip-path="url(#${id})">${iris}`;
      // lid shadow on the eyeball
      e+=`<path d="${up}" fill="none" stroke="${mix(s.skin,'#000',.35)}" stroke-width="${f(eh*.5)}" opacity=".18"/></g>`;
      // lids
      e+=`<path d="M${f(O[0])},${f(O[1])}${low}" ${st(g,W*.6,' opacity=".85"')}/>`;
      e+=`<path d="${up}" ${st(g,W*(sh.big?2:1.6))}/>`;
      if(E.crease&&!sh.hood)e+=`<path d="M${f(-ew*.28)},${f(-eh*sh.uh*.82-5)}Q${f(ew*.02)},${f(-eh*sh.uh-8)} ${f(ew*.42)},${f(-eh*sh.uh*.6-ti-4)}" ${st(g,W*.55,' opacity=".75"')}/>`;
      if(sh.hood)e+=`<path d="M${f(-ew*.45)},${f(-eh*.9)}Q${f(ew*.05)},${f(-eh*1.45-4)} ${f(ew*.6)},${f(-eh*.4-ti)}" ${st(g,W*1.1)}/>`;
      if(E.bags)e+=`<path d="M${f(-ew*.3)},${f(eh*sh.lh*.8+6)}Q${f(ew*.05)},${f(eh*sh.lh+11)} ${f(ew*.38)},${f(eh*sh.lh*.6+6)}" ${st(g,W*.5,' opacity=".55"')}/>`;
      // lashes
      const pt=t=>bez(I,u1,u2,O,t);
      if(E.lashes==='few'||E.lashes==='many'){
        const ts=E.lashes==='few'?[.86,.97]:[.5,.62,.74,.86,.97];
        for(const t of ts){const q=pt(t),len=ew*(E.lashes==='many'?.16:.13)*(.6+t*.5);e+=`<path d="M${f(q[0])},${f(q[1])}q${f(len*.5)},${f(-len*.4)} ${f(len)},${f(-len*.75+t*len*.3)}" ${st(g,W*.8)}/>`;}
      }
      if(E.lashes==='wing')e+=`<path d="M${f(O[0]-ew*.12)},${f(O[1]-eh*.25)}L${f(O[0]+ew*.3)},${f(O[1]-ew*.2)}L${f(O[0]-ew*.02)},${f(O[1]+1)}Z" fill="${ink}"/>`;
      if(E.lower)for(const t of[.25,.45,.65]){const x=I[0]+ew*(.35+t*.55),y=eh*sh.lh*.72;e+=`<path d="M${f(x)},${f(y)}l${f(ew*.04)},${f(ew*.08)}" ${st(g,W*.55)}/>`;}
    }
    o+=`<g transform="translate(${f(ex)} ${f(ey)}) scale(${sx} 1)">${e}</g>`;
  }
  return{defs,o};
}
function glasses(s,g){
  const E=s.eyes,t=E.glasses;if(t==='none')return'';
  const W=g.W,c=E.glassColor,r=g.ew*.78;let o='';
  const stc=`stroke="${c}" stroke-width="${f(W*1.05)}" stroke-linejoin="round"`;
  for(const sx of[1,-1]){
    const x=CX+sx*g.eyeDX,y=g.eyeY+2;
    if(t==='round')o+=`<circle cx="${f(x)}" cy="${f(y)}" r="${f(r)}" fill="#cfe6f5" fill-opacity=".18" ${stc}/>`;
    if(t==='square')o+=`<rect x="${f(x-r*1.05)}" y="${f(y-r*.75)}" width="${f(r*2.1)}" height="${f(r*1.5)}" rx="${f(r*.25)}" fill="#cfe6f5" fill-opacity=".18" ${stc}/>`;
    if(t==='halfmoon')o+=`<path d="M${f(x-r)},${f(y)}L${f(x+r)},${f(y)}A${f(r)},${f(r*.8)} 0 0 1 ${f(x-r)},${f(y)}Z" fill="#cfe6f5" fill-opacity=".18" ${stc}/>`;
    if(t==='shades')o+=`<path d="M${f(x-r*1.1)},${f(y-r*.55)}L${f(x+r*1.1)},${f(y-r*.55)}Q${f(x+r*1.05)},${f(y+r*.85)} ${f(x)},${f(y+r*.8)}Q${f(x-r*1.05)},${f(y+r*.85)} ${f(x-r*1.1)},${f(y-r*.55)}Z" fill="#1d1d24" fill-opacity=".92" ${stc}/><path d="M${f(x-r*.6*sx)},${f(y-r*.25)}l${f(r*.35*sx)},0" stroke="#fff" stroke-width="${f(W)}" stroke-linecap="round" opacity=".5"/>`;
    const sp=g.span(y);const ox=sx>0?sp.r:sp.l;
    o+=`<path d="M${f(x+sx*r*(t==='square'||t==='shades'?1.08:1))},${f(y-r*.3)}L${f(ox)},${f(y-r*.45)}" fill="none" ${stc}/>`;
  }
  const by=t==='halfmoon'?g.eyeY+2:g.eyeY-r*.25;
  o+=`<path d="M${f(CX-g.eyeDX+r*.95)},${f(by)}Q${CX},${f(by-8)} ${f(CX+g.eyeDX-r*.95)},${f(by)}" fill="none" ${stc}/>`;
  return o;
}

/* ---------- brows ---------- */
const BROW={
  natural:{arch:.25,peak:.6,taper:.55,th:1},straight:{arch:.03,peak:.5,taper:.2,th:1},arched:{arch:.55,peak:.55,taper:.6,th:.9},
  angular:{arch:.45,peak:.68,taper:.6,th:1,ang:1},thick:{arch:.15,peak:.55,taper:.25,th:1.9},thin:{arch:.3,peak:.6,taper:.5,th:.45},
  bushy:{arch:.2,peak:.5,taper:.2,th:2.1,rag:1},unibrow:{arch:.2,peak:.55,taper:.3,th:1.4,uni:1},
};
function brows(s,g){
  const B=s.brows;if(B.type==='none')return'';
  const col=B.color||darken(s.hair.color,.15);
  const W=g.W,bw=g.ew*1.3;
  const sh=s.eyes.shape,ehN=['dot','bean','happy'].includes(sh)?g.ew*.35:g.ew*(EYE[sh]?.h||.55)*Math.max(.7,s.eyes.open)*.85;
  let o='';
  const r=rng(s.seed*5+2);
  for(const sx of[1,-1]){
    const by=g.eyeY-ehN-14-B.height-sx*B.asym*7;
    let d='';
    if(B.type==='dash'){
      const T=W*1.6*B.thick;
      d=`<path d="M${f(-bw*.24)},${f(B.tilt*bw*.1)}L${f(bw*.24)},${f(-B.tilt*bw*.08)}" fill="none" stroke="${col}" stroke-width="${f(T)}" stroke-linecap="round"/>`;
    }else{
      const C=BROW[B.type],T=W*1.7*C.th*B.thick,N=14,up=[],lo=[];
      const xi=C.uni?-g.eyeDX:-bw/2;
      const kexp=Math.log(.5)/Math.log(C.peak);
      for(let i=0;i<=N;i++){
        const t=i/N,x=xi+(bw/2-xi)*t;
        let y=C.ang?(t<C.peak?-C.arch*bw*.3*(t/C.peak):-C.arch*bw*.3*(1-(t-C.peak)/(1-C.peak)*.9)):-C.arch*bw*.3*Math.sin(Math.PI*Math.pow(t,kexp));
        y+=B.tilt*(.5-t)*bw*.32;
        const th=T*(1-C.taper*t)*(.75+.25*Math.min(1,t*6));
        let yu=y-th/2;if(C.rag&&i%2)yu-=th*.3*(.5+r());
        up.push([x,yu]);lo.push([x,y+th/2]);
      }
      d=`<path d="${smooth(up.concat(lo.reverse()),true,C.ang?.5:.85)}" fill="${col}" stroke="${col}" stroke-width="${f(W*.3)}" stroke-linejoin="round"/>`;
    }
    o+=`<g transform="translate(${f(CX+sx*g.eyeDX)} ${f(by)}) scale(${sx} 1)">${d}</g>`;
  }
  return o;
}

/* ---------- mouth ---------- */
function mouth(s,g,p){
  const M=s.mouth,W=g.W,ink=g.ink;
  const mw=g.mw;let c=M.curve;const o=M.open,sk=M.skew||0;
  if(M.type==='frown')c=-Math.abs(c)-.35;
  const cy=-c*mw*.12;
  const Lp=[-mw/2,cy+sk*5],Rp=[mw/2,cy-sk*5];
  const S=(d,w=W*.95)=>`<path d="${d}" ${st(g,w)}/>`;
  const dark='#4a1a1f',tongue='#D8707A',teeth='#FBFAF5';
  let out='';
  const lineD=(cc=c,l=Lp,r=Rp)=>`M${f(l[0])},${f(l[1])}Q0,${f(cc*mw*.26)} ${f(r[0])},${f(r[1])}`;
  const dimples=()=>Math.abs(c)>.45?S(`M${f(Rp[0]+1)},${f(Rp[1]-4)}Q${f(Rp[0]+5)},${f(Rp[1])} ${f(Rp[0]+1)},${f(Rp[1]+4)}M${f(Lp[0]-1)},${f(Lp[1]-4)}Q${f(Lp[0]-5)},${f(Lp[1])} ${f(Lp[0]-1)},${f(Lp[1]+4)}`,W*.6):'';
  const openShape=(oo,cu,teethTop,teethBot,wide=1)=>{
    const l=[Lp[0]*wide,Lp[1]],r=[Rp[0]*wide,Rp[1]];
    const cl=c*mw*.22+oo*mw*.6;
    const d=`M${f(l[0])},${f(l[1])}Q0,${f(cu)} ${f(r[0])},${f(r[1])}Q0,${f(cl)} ${f(l[0])},${f(l[1])}Z`;
    const id=p+'mc';
    let x=`<defs><clipPath id="${id}"><path d="${d}"/></clipPath></defs><path d="${d}" fill="${dark}"/><g clip-path="url(#${id})">`;
    x+=`<ellipse cx="${f(mw*.08)}" cy="${f(cl*.62)}" rx="${f(mw*.32)}" ry="${f(Math.max(4,cl*.32))}" fill="${tongue}"/>`;
    if(teethTop)x+=`<rect x="${f(-mw)}" y="${f(Math.min(l[1],cu)-10)}" width="${f(mw*2)}" height="${f(Math.abs(cu-l[1])*.2+10+mw*.1)}" fill="${teeth}"/>`;
    if(teethBot)x+=`<rect x="${f(-mw)}" y="${f(cl*.55)}" width="${f(mw*2)}" height="${f(mw)}" fill="${teeth}"/>`;
    x+='</g>'+`<path d="${d}" ${st(g,W*.95)}/>`;
    return x;
  };
  switch(M.type){
    case'line':out=S(lineD())+dimples();break;
    case'smile':out=S(lineD())+dimples()+S(`M${f(-mw*.14)},${f(c*mw*.26+7)}Q0,${f(c*mw*.26+9)} ${f(mw*.14)},${f(c*mw*.26+7)}`,W*.55);break;
    case'frown':out=S(lineD());break;
    case'tiny':{const l=[-mw*.18,cy*.4],r=[mw*.18,cy*.4];out=S(`M${f(l[0])},${f(l[1])}Q0,${f(c*mw*.1)} ${f(r[0])},${f(r[1])}`);break;}
    case'flat':out=S(`M${f(Lp[0])},${f(Lp[1]*.2)}L${f(Rp[0])},${f(Rp[1]*.2)}`);break;
    case'open':out=openShape(o,-c*mw*.05,true,false);break;
    case'grin':out=openShape(Math.max(.25,o*.7),-c*mw*.04,true,true,1.08);break;
    case'laugh':out=openShape(.6+o*.5,-c*mw*.02-3,true,false,1.15);break;
    case'o':out=`<ellipse cx="0" cy="${f(2)}" rx="${f(mw*.17)}" ry="${f(mw*.2*(.55+o))}" fill="${dark}" ${st(g,W*.9).replace('fill="none" ','')}/>`;break;
    case'smirk':out=S(`M${f(-mw*.45)},2Q${f(mw*.1)},6 ${f(mw*.48)},${f(-8-c*6)}`)+S(`M${f(mw*.48+1)},${f(-12-c*6)}Q${f(mw*.55+3)},${f(-7-c*6)} ${f(mw*.5)},${f(-3-c*6)}`,W*.6);break;
    case'wavy':{const pts=[];for(let i=0;i<=8;i++)pts.push([-mw/2+mw*i/8,(i%2?3:-2)+(Math.abs(i-4)/4)*cy]);out=S(smooth(pts,false,1));break;}
    case'cat':out=S(`M${f(-mw*.36)},-3Q${f(-mw*.18)},8 0,-1Q${f(mw*.18)},8 ${f(mw*.36)},-3`);break;
    case'lips':{
      const lc=M.lipColor,mid=c*mw*.18;
      const up=`M${f(Lp[0])},${f(Lp[1])}C${f(-mw*.3)},${f(-11-o*2)} ${f(-mw*.1)},-12 0,-7C${f(mw*.1)},-12 ${f(mw*.3)},${f(-11-o*2)} ${f(Rp[0])},${f(Rp[1])}Q0,${f(mid+2)} ${f(Lp[0])},${f(Lp[1])}Z`;
      const lo=`M${f(Lp[0])},${f(Lp[1])}Q0,${f(mid+2)} ${f(Rp[0])},${f(Rp[1])}Q${f(mw*.2)},${f(mid+16)} 0,${f(mid+16)}Q${f(-mw*.2)},${f(mid+16)} ${f(Lp[0])},${f(Lp[1])}Z`;
      out=`<path d="${lo}" ${fs(g,lc,W*.7)}/><path d="${up}" ${fs(g,darken(lc,.12),W*.7)}/><ellipse cx="${f(-mw*.08)}" cy="${f(mid+10)}" rx="${f(mw*.12)}" ry="2.2" fill="#fff" opacity=".35"/>`;
      break;}
    case'buck':out=`<path d="M${f(-mw*.12)},${f(c*mw*.2)}h${f(mw*.24)}v${f(mw*.2)}h${f(-mw*.24)}Z" ${fs(g,teeth,W*.7)}/><path d="M0,${f(c*mw*.2)}v${f(mw*.2)}" ${st(g,W*.6)}/>`+S(lineD());break;
    case'gritted':{
      const h=mw*.34,t=cy-h/2;
      const d=`M${f(Lp[0])},${f(t+h*.2)}Q0,${f(t-c*6)} ${f(Rp[0])},${f(t+h*.2)}L${f(Rp[0])},${f(t+h*.8)}Q0,${f(t+h-c*6)} ${f(Lp[0])},${f(t+h*.8)}Z`;
      let lines=`M${f(Lp[0])},${f(t+h*.5)}L${f(Rp[0])},${f(t+h*.5)}`;
      for(let i=1;i<6;i++){const x=Lp[0]+mw*i/6;lines+=`M${f(x)},${f(t+2)}L${f(x)},${f(t+h-2)}`;}
      out=`<path d="${d}" ${fs(g,teeth,W*.95)}/><path d="${lines}" ${st(g,W*.5)}/>`;break;}
    case'fang':{const m=c*mw*.26;out=`<path d="M${f(mw*.12)},${f(m*.75)}L${f(mw*.2)},${f(m*.75+9)}L${f(mw*.26)},${f(m*.7)}Z" ${fs(g,teeth,W*.6)}/>`+S(lineD());break;}
  }
  if(M.lips>0&&M.type!=='lips'){
    const y=(['open','grin','laugh'].includes(M.type)?c*mw*.22+o*mw*.6:c*mw*.26)+7;
    out+=`<path d="M${f(-mw*.2)},${f(y)}Q0,${f(y+5)} ${f(mw*.2)},${f(y)}" fill="none" stroke="${M.lipColor}" stroke-width="${f(W*1.6*M.lips)}" stroke-linecap="round" opacity=".7"/>`;
  }
  return`<g transform="translate(${CX} ${f(g.mouthY)})">${out}</g>`;
}

/* ---------- facial hair ---------- */
function facialHair(s,g,p){
  const F=s.facial,col=F.color||s.hair.color,W=g.W;let beard='',must='';
  const bt=F.beard,len=F.len;
  const C=[CX,Y0-20];
  const push=(pt,d)=>{const dx=pt[0]-C[0],dy=pt[1]-C[1],l=Math.hypot(dx,dy)||1;return[pt[0]+dx/l*d,pt[1]+dy/l*d];};
  const jawRun=y0=>{const P=g.poly,idx=[];for(let i=0;i<P.length;i++)if(P[i][1]>y0)idx.push(i);
    // poly starts at crown and runs clockwise, so lower points are contiguous
    return idx.map(i=>P[i]);};
  const mw=g.mw;
  if(bt==='full'||bt==='boxed'||bt==='long'||bt==='stubble'){
    const y0=g.earY-14,run=jawRun(y0);
    const L0=bt==='long'?95*len:bt==='full'?18*len:bt==='boxed'?8*len:0;
    const th=bt==='stubble'?0:bt==='boxed'?5:9;
    const outer=run.map(pt=>{const q=push(pt,th);const dx=Math.abs(pt[0]-CX)/s.head.jaw;q[1]+=L0*Math.max(0,1-dx*dx)*(bt==='long'?1:1);return q;});
    if(bt==='long'){const mid=outer.reduce((a,b)=>b[1]>a[1]?b:a);mid[1]+=12;}
    const sr=g.span(y0);
    const inner=[[sr.l+14,y0],[CX-mw*.82,g.noseY+6],[CX-mw*.72,g.mouthY+2],[CX-mw*.38,g.mouthY+15],[CX,g.mouthY+17],[CX+mw*.38,g.mouthY+15],[CX+mw*.72,g.mouthY+2],[CX+mw*.82,g.noseY+6],[sr.r-14,y0]];
    const d=smooth(outer,false,.6)+`L${f(inner[0][0])},${f(inner[0][1])}`+smooth(inner,false,1,true)+'Z';
    if(bt==='stubble'){
      const r=rng(s.seed+99);let dots='';
      beard=`<defs><clipPath id="${p}stb"><path d="${d}"/></clipPath></defs><path d="${d}" fill="${col}" opacity=".16"/><g clip-path="url(#${p}stb)" fill="${darken(col,.1)}" opacity=".55">`;
      for(let i=0;i<260;i++){const x=CX-s.head.jaw-10+r()*(s.head.jaw*2+20),y=y0+r()*(g.chinY-y0+10);dots+=`<circle cx="${f(x)}" cy="${f(y)}" r=".9"/>`;}
      beard+=dots+'</g>';
    }else{
      beard=`<path d="${d}" ${fs(g,col,W)}/>`;
      for(let i=0;i<5;i++){const x=CX+(i-2)*mw*.32,y=g.mouthY+24+(bt==='long'?20:0);beard+=`<path d="M${f(x)},${f(y)}q${f((i-2)*2)},${f(10+L0*.25)} ${f((i-2)*3)},${f(16+L0*.45)}" ${st(g,W*.5,' opacity=".45"')}/>`;}
    }
  }
  if(bt==='chinstrap'||bt==='mutton'){
    const y0=g.earY-14,run=jawRun(y0);
    const sel=bt==='mutton'?[run.filter(q=>q[0]>CX+mw*.75),run.filter(q=>q[0]<CX-mw*.75)]:[run];
    for(const seg of sel){if(seg.length<3)continue;
      const outer=seg.map(q=>push(q,4)),inner=seg.map(q=>push(q,bt==='mutton'?-22:-11)).reverse();
      const d=smooth(outer,false,.8)+`L${f(inner[0][0])},${f(inner[0][1])}`+smooth(inner,false,.8,true)+'Z';
      beard+=`<path d="${d}" ${fs(g,col,W*.9)}/>`;}
  }
  if(bt==='goatee'){
    const pts=[[CX-mw*.34,g.mouthY+9],[CX-mw*.4,(g.mouthY+g.chinY)/2+6],[CX,g.chinY+6+18*len],[CX+mw*.4,(g.mouthY+g.chinY)/2+6],[CX+mw*.34,g.mouthY+9],[CX,g.mouthY+13]];
    beard=`<path d="${smooth(pts,true,.8)}" ${fs(g,col,W*.9)}/>`;
  }
  if(bt==='soulpatch')beard=`<path d="M${CX-6},${f(g.mouthY+10)}L${CX+6},${f(g.mouthY+10)}L${CX},${f(g.mouthY+22+6*len)}Z" ${fs(g,col,W*.7)}/>`;
  // moustache (right half, mirrored)
  const mt=F.must;
  if(mt!=='none'){
    const my=g.mouthY-(g.mouthY-g.noseY)*.42,mm=mw*.55+6;
    let h='';
    if(mt==='chevron')h=`M0,-8Q${f(mm*.5)},-11 ${f(mm)},5Q${f(mm*.5)},6 0,2Z`;
    if(mt==='pencil')h=`M0,-1Q${f(mm*.6)},-5 ${f(mm*1.05)},1Q${f(mm*.6)},-1 0,2Z`;
    if(mt==='handlebar')h=`M0,-7C${f(mm*.5)},-11 ${f(mm*.9)},-2 ${f(mm*1.3)},-14C${f(mm*1.42)},-20 ${f(mm*1.26)},-25 ${f(mm*1.12)},-19C${f(mm*1.22)},-10 ${f(mm*.8)},5 0,1Z`;
    if(mt==='walrus')h=`M0,-10C${f(mm*.6)},-14 ${f(mm*1.12)},-4 ${f(mm*1.06)},18Q${f(mm*.6)},14 0,10Z`;
    if(mt==='toothbrush')h=`M0,-6L${f(mw*.2)},-6L${f(mw*.2)},4L0,4Z`;
    if(mt==='curly')h=`M0,-6C${f(mm*.5)},-10 ${f(mm*.95)},-5 ${f(mm*1.12)},-22C${f(mm*1.12)},-10 ${f(mm*.62)},3 0,1Z`;
    let piece=`<path d="${h}" ${fs(g,col,W*.85)}/>`;
    if(mt==='walrus'||mt==='chevron')piece+=`<path d="M${f(mm*.25)},-4l2,9M${f(mm*.5)},-3l3,9M${f(mm*.75)},0l3,8" ${st(g,W*.45,' opacity=".5"')}/>`;
    must=`<g transform="translate(${CX} ${f(my)})">${piece}<g transform="scale(-1 1)">${piece}</g></g>`;
  }
  return{beard,must};
}

/* ---------- main render ---------- */
function render(s,opt={}){
  const p=opt.prefix||'m';
  const g=geom(s);
  const rand=rng(s.seed);
  const W=g.W;
  const vb=opt.vb||`0 0 ${VW} ${VH}`;
  let defs=`<filter id="${p}wob" filterUnits="userSpaceOnUse" x="-20" y="-20" width="${VW+40}" height="${VH+40}"><feTurbulence type="fractalNoise" baseFrequency="0.032" numOctaves="2" seed="${s.seed%97}"/><feDisplacementMap in="SourceGraphic" scale="${f(s.line.wob*2.2)}" xChannelSelector="R" yChannelSelector="G"/></filter>`;
  defs+=`<clipPath id="${p}head"><path d="${g.path}"/></clipPath>`;
  const B=body(s,g,p);
  defs+=`<clipPath id="${p}neck"><path d="${B.neck}"/></clipPath>`;
  const hairB=hairBack(s,g,p,rng(s.seed+3));
  const front=hairFront(s,g,p,rng(s.seed+5));
  const E=eyes(s,g,p);
  const FH=facialHair(s,g,p);
  let c='';
  c+=B.shoulders;
  c+=hairB;
  c+=B.neckFill;
  if(s.line.shade)c+=`<g clip-path="url(#${p}neck)"><path d="${g.path}" transform="translate(0 16)" fill="${g.skinSh}"/></g>`;
  c+=`<path d="M${f(CX-g.nw)},${f(Y0+s.head.chin*.45)}L${f(CX-g.nw)},${f(g.sY-4)}M${f(CX+g.nw)},${f(Y0+s.head.chin*.45)}L${f(CX+g.nw)},${f(g.sY-4)}" ${st(g,W)}/>`;
  c+=collarSVG(s,g);
  if(s.ears.type==='cat'||s.ears.type==='bear')c+=ears(s,g,p);
  else c+=ears(s,g,p);
  c+=`<path d="${g.path}" fill="${s.skin}"/>`;
  if(s.line.shade){
    if(front.shadowD)c+=`<g clip-path="url(#${p}head)"><path d="${front.shadowD}" transform="translate(3 8)" fill="${g.skinSh}" opacity=".7"/></g>`;
    // soft crescent of shadow on the far side of the face (light from upper left)
    c+=`<g clip-path="url(#${p}head)" opacity=".45"><rect x="0" y="0" width="${VW}" height="${VH}" fill="${g.skinSh}"/><path d="${g.path}" transform="translate(${f(-s.head.w*.1)} -6)" fill="${s.skin}"/></g>`;
  }
  c+=`<path d="${g.path}" ${st(g,W*1.15)}/>`;
  c+=faceDetails(s,g,p);
  c+=FH.beard;
  c+=nose(s,g);
  c+=mouth(s,g,p);
  c+=FH.must;
  c+=E.o;
  c+=brows(s,g);
  c+=front.o;
  c+=glasses(s,g);
  defs+=E.defs;
  const bg=opt.noBg?'':bgSVG(s,p);
  const wob=s.line.wob>0?` filter="url(#${p}wob)"`:'';
  return`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb}" preserveAspectRatio="xMidYMid meet"><defs>${defs}</defs>${bg}<g${wob}>${c}</g></svg>`;
}

/* ---------- thumbnail crops ---------- */
function crop(name,s){
  const g=geom(s),h=s.head;
  const box=(x,y,w,hh)=>{const m=Math.max(w,hh);return`${f(x-(m-w)/2)} ${f(y-(m-hh)/2)} ${f(m)} ${f(m)}`;};
  switch(name){
    case'full':return box(CX-175,Math.max(0,g.crownY-70),350,Math.min(VH,g.chinY+90)-Math.max(0,g.crownY-70));
    case'head':return box(CX-h.w-40,g.crownY-30,2*h.w+80,g.chinY-g.crownY+60);
    case'hair':return box(CX-180,Math.max(0,g.crownY-80),360,420);
    case'eyes':return box(CX-g.eyeDX-g.ew*1.15,g.eyeY-g.ew*1.4,2*(g.eyeDX+g.ew*1.15),g.ew*2.4);
    case'brows':return box(CX-g.eyeDX-g.ew*1.1,g.eyeY-g.ew*2,2*(g.eyeDX+g.ew*1.1),g.ew*2.6);
    case'nose':return box(CX-48,g.noseY-58,96,96);
    case'mouth':return box(CX-68,g.mouthY-48,136,96);
    case'lower':return box(CX-h.w-20,g.noseY-30,2*h.w+40,g.chinY-g.noseY+(s.facial.beard==='long'?150:80));
    case'ears':return box(CX-h.w-60,g.earY-110,2*h.w+120,190);
  }
  return`0 0 ${VW} ${VH}`;
}

let thumbJobs=[];
function drawMain(){$('art').innerHTML=render(S,{prefix:'m'});}
function thumbSVG(sec,v,i){
  const t=clone(S);
  if(sec.apply)sec.apply(t,v);else{const ks=sec.path.split('.'),last=ks.pop();ks.reduce((o,k)=>o[k],t)[last]=v;}
  if(sec.path==='hair.back'&&v!=='none'&&t.hair.top==='bald')t.hair.top='smooth';
  if(/^eyes\.(irisStyle|pupil|lashes)$/.test(sec.path)&&['dot','bean','happy'].includes(t.eyes.shape))t.eyes.shape='round';
  return render(t,{prefix:'t'+i+'_',vb:crop(sec.crop,t),noBg:true});
}
let thumbToken=0;
function refreshThumbs(){
  const tok=++thumbToken;
  const els=[...document.querySelectorAll('#panel .opt[data-sec]')];
  let i=0;
  const sec=STEPS[stepIx].secs;
  const run=()=>{if(tok!==thumbToken)return;const t0=performance.now();
    while(i<els.length&&performance.now()-t0<14){const el=els[i];const s=sec[+el.dataset.sec];const v=s.opts[+el.dataset.ix][0];el.querySelector('.th').innerHTML=thumbSVG(s,v,i);el.classList.toggle('on',String(getP(s.path))===String(v));i++;}
    if(i<els.length)requestAnimationFrame(run);};
  run();
}

  $('steps').innerHTML=STEPS.map((s,i)=>`<button class="step${i===stepIx?' on':''}" data-i="${i}"><b>${i+1}</b>${s.t}</button>`).join('');

    if(S.eyes.shape==='happy'&&!e.eyes.shape)S.eyes.shape='almond';

    const place=()=>{dot.style.left=(50+S.eyes.gazeX*40)+'%';dot.style.top=(50+S.eyes.gazeY*40)+'%';};place();
    const mv=e=>{const r=gz.getBoundingClientRect();S.eyes.gazeX=clamp(((e.clientX-r.left)/r.width-.5)/.4,-1,1);S.eyes.gazeY=clamp(((e.clientY-r.top)/r.height-.5)/.4,-1,1);place();drawMain();};
    gz.onpointerdown=e=>{gz.setPointerCapture(e.pointerId);mv(e);gz.onpointermove=mv;};
    gz.onpointerup=()=>{gz.onpointermove=null;commit();refreshThumbs();};
    $('gazeReset').onclick=()=>{S.eyes.gazeX=0;S.eyes.gazeY=0;place();commit();drawMain();refreshThumbs();};
  }
  refreshThumbs();
}

function syncAll(){syncSide();renderAll();updUndo();}

/* side panel controls */
$('bgSw').innerHTML=BGC.map(c=>`<button style="background:${c}" data-c="${c}" title="${c}"></button>`).join('');
$('bgSw').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.bg.c1=b.dataset.c;if(S.bg.type==='none')S.bg.type='solid';commit();syncSide();drawMain();});
$('bgType').onchange=e=>{S.bg.type=e.target.value;commit();drawMain();};
$('bgC1').oninput=e=>{S.bg.c1=e.target.value;drawMain();};$('bgC1').onchange=commit;
$('bgC2').oninput=e=>{S.bg.c2=e.target.value;drawMain();};$('bgC2').onchange=commit;
$('lnW').oninput=e=>{S.line.w=+e.target.value;$('lnWo').textContent=fmt(S.line.w);drawMain();};$('lnW').onchange=()=>{commit();refreshThumbs();};
$('lnWob').oninput=e=>{S.line.wob=+e.target.value;$('lnWobo').textContent=fmt(S.line.wob);drawMain();};$('lnWob').onchange=()=>{commit();refreshThumbs();};
$('lnInk').oninput=e=>{S.line.ink=e.target.value;drawMain();};$('lnInk').onchange=()=>{commit();refreshThumbs();};
$('lnShade').onchange=e=>{S.line.shade=e.target.checked;commit();drawMain();refreshThumbs();};
$('charName').oninput=e=>{S.name=e.target.value;};$('charName').onchange=commit;
$('undoBtn').onclick=()=>{if(hIx>0){hIx--;S=JSON.parse(hist[hIx]);lsSet(LS,hist[hIx]);syncAll();}};
$('redoBtn').onclick=()=>{if(hIx<hist.length-1){hIx++;S=JSON.parse(hist[hIx]);lsSet(LS,hist[hIx]);syncAll();}};
$('prevBtn').onclick=()=>{if(stepIx>0){stepIx--;renderAll();}};
$('nextBtn').onclick=()=>{if(stepIx<STEPS.length-1){stepIx++;renderAll();}else{$('pngBtn').focus();}};
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!/INPUT/.test(document.activeElement.tagName)){e.preventDefault();(e.shiftKey?$('redoBtn'):$('undoBtn')).click();}});

/* randomness */
const pick=a=>a[Math.floor(Math.random()*a.length)];
const rr=(a,b)=>a+Math.random()*(b-a);
function randomStep(i,s){
  const k=o=>pick(o)[0];
  if(i===0){Object.assign(s,buildPreset(Math.floor(Math.random()*PRESETS.length),s));}
  if(i===1){const sh=k(OPT.head);s.head=Object.assign({shape:sh,asym:rr(-.3,.3)},HEADS[sh]);s.head.w+=rr(-8,8);s.head.jaw+=rr(-8,8);s.skin=pick(SKINS.slice(0,10));s.nose.type=k(OPT.nose);s.nose.size=rr(.8,1.3);s.face.blush=Math.random()<.3?rr(.3,1):0;s.face.freckles=Math.random()<.25?rr(.4,1.2):0;s.body.collar=k(OPT.collar);s.body.shirt=pick(SHIRTC);}
  if(i===2){s.hair.top=k(OPT.top);s.hair.back=Math.random()<.5?'none':k(OPT.back);s.hair.bangs=Math.random()<.4?'none':k(OPT.bangs);s.hair.side=Math.random()<.7?'none':k(OPT.side);s.hair.color=pick(HAIRC);s.hair.vol=rr(.8,1.3);s.hair.hairline=rr(.4,.6);}
  if(i===3){s.brows.type=k(OPT.brows.slice(1));s.brows.thick=rr(.7,1.4);s.brows.tilt=rr(-.5,.6);s.brows.asym=Math.random()<.3?rr(-.7,.7):0;s.facial.beard=Math.random()<.6?'none':k(OPT.beard);s.facial.must=Math.random()<.65?'none':k(OPT.must);}
  if(i===4){s.eyes.shape=k(OPT.eyes.slice(0,11));s.eyes.size=rr(.8,1.3);s.eyes.spacing=rr(.8,1.1);s.eyes.tilt=rr(-.2,.3);s.eyes.iris=pick(IRISC);s.eyes.irisStyle=k(OPT.irisStyle);s.eyes.pupil=Math.random()<.8?'round':k(OPT.pupil);s.eyes.lashes=k(OPT.lashes);s.eyes.highlights=Math.floor(rr(0,4));s.eyes.gazeX=rr(-.4,.4);s.eyes.glasses=Math.random()<.8?'none':k(OPT.glasses);s.eyes.open=rr(.75,1.1);}
  if(i===5){s.mouth.type=k(OPT.mouth);s.mouth.width=rr(.7,1.2);s.mouth.curve=rr(-.3,.9);s.mouth.open=rr(.2,.7);s.mouth.lipColor=pick(LIPC);}
  if(i===6){s.ears.type=Math.random()<.15?pick(['cat','bear','pointed']):k(OPT.ears.slice(1,7));s.ears.size=rr(.85,1.25);s.ears.ring=Math.random()<.7?'none':k(OPT.ring);}
  s.seed=Math.floor(Math.random()*9999);
}
$('randBtn').onclick=()=>{for(let i=1;i<7;i++)randomStep(i,S);S.name='';presetIx=-1;commit();syncAll();};
$('shuffleStep').onclick=()=>{randomStep(stepIx,S);commit();syncAll();};

/* export */
function fileBase(){return(S.name||'carabox-character').trim().replace(/[^\w\- ]+/g,'').replace(/\s+/g,'-').toLowerCase()||'carabox';}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
$('svgBtn').onclick=()=>download(new Blob([render(S,{prefix:'x'})],{type:'image/svg+xml'}),fileBase()+'.svg');
$('pngBtn').onclick=()=>{
  const svg=render(S,{prefix:'x'}).replace('<svg ','<svg width="1600" height="2000" ');
  const img=new Image();
  img.onload=()=>{const c=document.createElement('canvas');c.width=1600;c.height=2000;c.getContext('2d').drawImage(img,0,0,1600,2000);c.toBlob(b=>download(b,fileBase()+'.png'),'image/png');};
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
};
$('saveBtn').onclick=()=>download(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}),fileBase()+'.carabox.json');
$('loadBtn').onclick=()=>$('loadFile').click();
$('loadFile').onchange=e=>{const fl=e.target.files[0];if(!fl)return;fl.text().then(t=>{try{const o=JSON.parse(t);if(!o.head||!o.eyes)throw 0;S=merge(clone(DEF),o);commit();syncAll();}catch(err){alert('That file is not a Carabox character.');}});e.target.value='';};

/* theme */
function setTheme(t){document.documentElement.dataset.theme=t;document.querySelector('.switch').setAttribute('aria-checked',t==='dark');lsSet('carabox.theme',t);}
setTheme(lsGet('carabox.theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
const flip=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
$('themeToggle').onclick=e=>{e.preventDefault();flip();};
document.querySelector('.switch').onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();flip();}};

syncAll();
</script>
</body>
</html>
