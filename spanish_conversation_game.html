<!DOCTYPE html>
<html lang="fi" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Hablemos! - Espanjan keskustelupeli</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">

    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.05); }
        ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.5); border-radius: 3px; }
        .fade-in { animation: fadeIn 0.25s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Auto-hiding header styles */
        #main-header {
            transform: translateY(-85%);
            transition: transform 0.25s ease-in-out;
        }
        #header-hover-trigger:hover #main-header,
        #main-header:hover,
        #main-header:focus-within {
            transform: translateY(0);
        }

        /* Speaking indicator */
        .speaking { animation: pulseRing 1s ease-in-out infinite; }
        @keyframes pulseRing {
            0%, 100% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.55); }
            50% { box-shadow: 0 0 0 6px rgba(251, 191, 36, 0); }
        }
        .chosen { border-color: rgb(52 211 153) !important; background: rgba(6, 78, 59, 0.55) !important; }
        .dimmed { opacity: 0.35; }
        .speak-line { transition: background 0.2s; }
        .speak-line:hover { background: rgba(255, 255, 255, 0.04); }
        .reading { background: rgba(251, 191, 36, 0.14) !important; outline: 1px solid rgba(251, 191, 36, 0.5); }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans h-screen flex flex-col overflow-hidden justify-between transition-colors duration-200">

    <!-- Hover Trigger & Auto-Hiding Top Header -->
    <div id="header-hover-trigger" class="fixed top-0 left-0 w-full z-30 pt-1">
        <header id="main-header" class="max-w-4xl mx-auto px-3 py-1.5 bg-slate-900/95 border-b border-amber-500/30 rounded-b-xl shadow-2xl backdrop-blur transition-transform duration-300">
            <div class="flex items-center justify-between gap-2 flex-wrap">
                <div class="flex items-center space-x-2">
                    <div class="w-7 h-7 rounded-lg bg-gradient-to-tr from-amber-500 to-rose-500 flex items-center justify-center text-white shadow font-bold text-sm">¡H!</div>
                    <div>
                        <h1 class="font-bold text-sm leading-none text-white">¡Hablemos!</h1>
                        <p class="text-[10px] text-slate-400">Vie hiiri yläreunaan nähdäksesi valikon</p>
                    </div>
                </div>

                <!-- Header Controls -->
                <div class="flex items-center gap-1.5 flex-wrap">
                    <button id="toggle-hints-btn" onclick="toggleHints()" class="px-2.5 py-1 rounded-lg bg-slate-800 text-slate-200 hover:bg-slate-700 transition flex items-center gap-1.5 text-xs font-semibold border border-slate-700" title="Käännösvihjeet päälle/pois">
                        <i class="fa-solid fa-language text-amber-400 text-sm"></i>
                        <span id="hints-status">Vihjeet: On</span>
                    </button>

                    <button id="toggle-my-voice-btn" onclick="toggleReadMyAnswers()" class="px-2.5 py-1 rounded-lg bg-slate-800 text-slate-200 hover:bg-slate-700 transition flex items-center gap-1.5 text-xs font-semibold border border-slate-700" title="Lue valitsemani vastaus ääneen">
                        <i id="my-voice-icon" class="fa-solid fa-user text-emerald-400 text-sm"></i>
                        <span id="my-voice-status">Oma vastaus: On</span>
                    </button>

                    <button id="toggle-audio-btn" onclick="toggleAutoAudio()" class="px-2.5 py-1 rounded-lg bg-slate-800 text-slate-200 hover:bg-slate-700 transition flex items-center gap-1.5 text-xs font-semibold border border-slate-700" title="Lue ohjelman puhe automaattisesti">
                        <i id="audio-icon" class="fa-solid fa-volume-high text-amber-500 text-sm"></i>
                        <span id="audio-status">Ohjelma: On</span>
                    </button>

                    <select id="rate-select" onchange="changeRate(this.value)" class="px-1.5 py-1 rounded-lg bg-slate-800 text-slate-200 text-xs font-semibold border border-slate-700" title="Puhenopeus">
                        <option value="0.7">🐢 Hidas</option>
                        <option value="0.9" selected>Normaali</option>
                        <option value="1.05">🐇 Nopea</option>
                    </select>

                    <select id="length-select" onchange="changeLength(this.value)" class="px-1.5 py-1 rounded-lg bg-slate-800 text-slate-200 text-xs font-semibold border border-slate-700" title="Keskustelun pituus (aloittaa alusta)">
                        <option value="5">Lyhyt</option>
                        <option value="8" selected>Normaali</option>
                        <option value="99">Pitkä (kaikki aiheet)</option>
                    </select>

                    <button onclick="restartGame()" class="p-1.5 rounded-lg bg-slate-800 text-slate-200 hover:bg-slate-700 transition border border-slate-700" title="Aloita alusta">
                        <i class="fa-solid fa-rotate-right"></i>
                    </button>
                </div>
            </div>
        </header>
    </div>

    <!-- Main Game Area -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-2 sm:p-3 flex flex-col justify-between overflow-hidden gap-1.5">

        <!-- Progress Tracker Bar -->
        <div class="bg-slate-800/80 px-3 py-1 rounded-lg border border-slate-700 flex items-center justify-between text-xs text-slate-300 shrink-0">
            <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                <span class="font-medium">Aihe: <strong id="step-count" class="text-amber-400 font-bold text-sm">1</strong> / <span id="step-total">10</span></span>
                <span id="followup-badge" class="hidden px-1.5 py-0.5 rounded bg-emerald-700/60 text-emerald-200 text-[10px] font-bold uppercase tracking-wide">jatkokysymys</span>
            </div>
            <div class="flex items-center gap-4">
                <div class="font-medium"><i class="fa-solid fa-code-branch text-amber-400 mr-1"></i> <span id="nodes-explored" class="font-bold text-white">0</span> valintaa</div>
                <button onclick="toggleHistory()" class="text-xs text-amber-400 hover:text-amber-300 font-semibold flex items-center gap-1 bg-slate-700/60 px-2 py-0.5 rounded border border-slate-600">
                    <i class="fa-solid fa-clock-rotate-left"></i> Historia
                </button>
            </div>
        </div>

        <!-- Collapsible History Panel -->
        <div id="history-panel" class="hidden bg-slate-800 p-2.5 rounded-xl border border-amber-500/50 max-h-44 overflow-y-auto text-xs space-y-1.5 shrink-0">
            <div class="font-bold text-slate-200 flex justify-between items-center border-b pb-1 border-slate-700">
                <span>Käyty keskusteluhistoria (klikkaa kuullaksesi)</span>
                <button onclick="toggleHistory()" class="text-slate-400 hover:text-slate-200 font-bold text-base px-1">&times;</button>
            </div>
            <div id="history-content" class="space-y-1 text-slate-300">
                <p class="italic text-slate-400">Ei vielä aiempia siirtoja.</p>
            </div>
        </div>

        <!-- AI Question Box -->
        <div id="ai-box" class="bg-slate-800/90 p-3 sm:p-4 rounded-xl border border-slate-700 shadow-md shrink-0 fade-in">
            <div class="flex items-start gap-3">
                <div id="ai-avatar" class="w-8 h-8 sm:w-9 sm:h-9 rounded-lg bg-gradient-to-tr from-amber-500 to-rose-500 flex-shrink-0 flex items-center justify-center text-white text-sm font-bold shadow mt-0.5">¡H!</div>
                <div class="flex-1 min-w-0 space-y-1.5">
                    <!-- Kuittaus edelliseen vastaukseen -->
                    <div id="ack-block" class="hidden speak-line cursor-pointer rounded-lg px-1 -mx-1" title="Klikkaa kuullaksesi">
                        <p id="ack-es" class="text-base sm:text-lg font-semibold text-slate-200 leading-snug"></p>
                        <p id="ack-fi" class="translation-hint text-xs sm:text-sm text-amber-300/80 italic"></p>
                    </div>

                    <!-- Verbikertaus: 1. persoona -> 2. persoonan kysymys -->
                    <div id="drill-block" class="hidden bg-emerald-950/40 border border-emerald-700/50 rounded-lg px-2.5 py-1.5">
                        <div class="flex items-center gap-2 flex-wrap text-[11px] uppercase tracking-wider font-bold text-emerald-300 mb-1">
                            <i class="fa-solid fa-repeat"></i> Kertaus · kuuntele ja lue
                            <span id="drill-tense" class="px-1.5 py-0.5 rounded bg-emerald-700/60 text-white normal-case tracking-normal text-xs"></span>
                        </div>
                        <div id="drill-list" class="grid grid-cols-1 sm:grid-cols-2 gap-x-3 gap-y-1 max-h-[34vh] overflow-y-auto pr-1"></div>
                    </div>

                    <!-- Seuraava kysymys -->
                    <div id="question-block" class="speak-line cursor-pointer rounded-lg px-1 -mx-1">
                        <div class="flex items-start justify-between gap-2">
                            <p id="ai-question-es" class="text-lg sm:text-xl md:text-2xl font-bold text-white leading-snug tracking-wide"></p>
                            <button id="speak-btn" class="text-amber-400 hover:text-amber-300 transition p-1 text-lg shrink-0" title="Kuuntele kaikki uudelleen (välilyönti)">
                                <i class="fa-solid fa-volume-high"></i>
                            </button>
                        </div>
                        <p id="ai-question-fi" class="translation-hint text-sm sm:text-base text-amber-300/90 border-t border-slate-700/60 pt-1 font-medium italic"></p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Options -->
        <div class="flex-1 flex flex-col justify-end bg-slate-800/90 p-2.5 sm:p-3 rounded-xl border border-slate-700 shadow-xl min-h-0 overflow-hidden">
            <div class="flex items-center justify-between mb-1.5 px-1 shrink-0">
                <span class="text-xs font-bold text-slate-300 uppercase tracking-wider flex items-center gap-1.5">
                    <i class="fa-regular fa-comments text-amber-400"></i> Valitse vastaus <span class="normal-case font-normal text-slate-400">(tai paina numeroa)</span>:
                </span>
                <span id="hint-indicator" class="text-xs text-amber-400 font-semibold">💡 Suomennokset mukana</span>
            </div>

            <div id="options-container" class="grid grid-cols-1 gap-1.5 overflow-y-auto max-h-full pr-0.5"></div>
        </div>
    </main>

    <script>
        // ------------------------------------------------------------------
        //  KESKUSTELUDATA
        //  Jokainen vastausvaihtoehto: O(espanjaksi, suomeksi, kuittaus_es, kuittaus_fi, seuraava_noodi?)
        //  "seuraava_noodi" vie aiheeseen liittyvään jatkokysymykseen.
        // ------------------------------------------------------------------
        function O(es, fi, ack, ackFi, next) {
            return { es: es, fi: fi, ack: ack, ackFi: ackFi, next: next || null };
        }

        var START_NODE = 'start';
        var CLOSING_NODE = 'closing';

        // Pääaiheet, joista arvotaan keskustelun runko
        var MAIN_TOPICS = [
            'evening', 'hobbies', 'yesterday', 'tomorrow', 'food', 'travel', 'learning',
            'emotions', 'weather', 'family', 'pets', 'hometown', 'morning', 'seasons',
            'childhood', 'celebrations', 'tech', 'sleep', 'ideal_weekend'
        ];

        var NODES = {
            // ================= ALOITUS =================
            start: {
                q: "¿Qué tal ha sido tu día hoy?",
                qFi: "Millainen päivä sinulla on ollut tänään?",
                opts: [
                    O("Es fin de semana y trato de limpiar y relajarme.", "On viikonloppu ja yritän siivota ja rentoutua.",
                      "¡Ajá! Así que es fin de semana y tratas de limpiar tu casa y relajarte.", "Ahaa! Eli on viikonloppu ja yrität siivota kotiasi ja rentoutua.", 'cleaning'),
                    O("Hoy fue un día laborable y estuve trabajando.", "Tänään oli arkipäivä, ja olin töissä.",
                      "¡Entiendo! Así que hoy tuviste un día laborable y estuviste trabajando.", "Ymmärrän! Eli sinulla oli tänään arkipäivä ja olit töissä.", 'work_day'),
                    O("Hoy es viernes y ya trato de desconectar y descansar.", "Tänään on perjantai ja yritän jo irrottautua ja levätä.",
                      "¡Qué bien! Así que ya es viernes y tratas de desconectar y descansar.", "Kiva! Eli on jo perjantai ja yrität irrottautua ja levätä.", 'weekend_plans'),
                    O("Es domingo por la tarde y mañana tengo que trabajar.", "On sunnuntai-ilta ja huomenna on työpäivä.",
                      "¡Vaya! Así que ya es domingo por la tarde y mañana tienes que trabajar.", "Voi! Eli on jo sunnuntai-ilta ja huomenna sinun täytyy tehdä töitä.", 'monday_mood'),
                    O("Aunque es fin de semana, he tenido que trabajar bastante.", "Vaikka on viikonloppu, olen joutunut tekemään paljon töitä.",
                      "¡Vaya esfuerzo! Así que aunque es fin de semana, has tenido que trabajar bastante.", "Melkoinen ponnistus! Eli vaikka on viikonloppu, olet joutunut tekemään paljon töitä.", 'work_day'),
                    O("Hoy he hecho deporte y me siento genial.", "Tänään olen urheillut ja oloni on mahtava.",
                      "¡Ajá! Así que hoy has hecho deporte y te sientes genial.", "Ahaa! Eli olet tänään urheillut ja olosi on mahtava.", 'sport_today')
                ]
            },

            // ================= JATKOKYSYMYKSET =================
            cleaning: {
                followup: true,
                q: "¿Y qué es lo que menos te gusta limpiar en casa?",
                qFi: "Ja mitä siivoat kotona kaikkein vastahakoisimmin?",
                opts: [
                    O("El baño, sin duda. Es lo más pesado.", "Kylpyhuonetta, ehdottomasti. Se on raskainta.",
                      "¡Te entiendo! Así que el baño es lo que menos te gusta limpiar, porque es lo más pesado.", "Ymmärrän sinua! Eli kylpyhuone on se, mitä vähiten haluat siivota, koska se on raskainta."),
                    O("Las ventanas, porque siempre quedan manchas.", "Ikkunoita, koska niihin jää aina tahroja.",
                      "¡Es verdad! Así que no te gusta limpiar las ventanas porque siempre quedan manchas.", "Totta! Eli et pidä ikkunoiden pesusta, koska niihin jää aina tahroja."),
                    O("Fregar los platos después de cenar.", "Tiskaamista illallisen jälkeen.",
                      "¡Ajá! Así que lo que menos te gusta es fregar los platos después de cenar.", "Ahaa! Eli vähiten pidät tiskaamisesta illallisen jälkeen."),
                    O("Planchar la ropa, ¡lo odio!", "Vaatteiden silittämistä, inhoan sitä!",
                      "¡Ja, ja! Así que odias planchar la ropa.", "Hah! Eli inhoat vaatteiden silittämistä."),
                    O("En realidad no me importa limpiar si pongo música.", "Oikeastaan siivoaminen ei haittaa, jos laitan musiikkia soimaan.",
                      "¡Qué buena idea! Así que no te importa limpiar si pones música.", "Hyvä idea! Eli siivoaminen ei haittaa sinua, jos laitat musiikkia soimaan.")
                ]
            },
            work_day: {
                followup: true,
                q: "¿Y qué tal en el trabajo? ¿Ha sido un día estresante?",
                qFi: "Entä miten töissä meni? Oliko päivä stressaava?",
                opts: [
                    O("Sí, he tenido muchas reuniones seguidas.", "Kyllä, minulla oli monta palaveria peräkkäin.",
                      "¡Uf! Así que has tenido muchas reuniones seguidas.", "Huh! Eli sinulla on ollut monta palaveria peräkkäin."),
                    O("No, ha sido un día bastante tranquilo.", "Ei, päivä oli melko rauhallinen.",
                      "¡Menos mal! Así que ha sido un día bastante tranquilo en el trabajo.", "Onneksi! Eli työpäivä on ollut melko rauhallinen."),
                    O("He terminado un proyecto importante y estoy contento.", "Sain valmiiksi tärkeän projektin ja olen tyytyväinen.",
                      "¡Enhorabuena! Así que has terminado un proyecto importante y estás contento.", "Onneksi olkoon! Eli sait valmiiksi tärkeän projektin ja olet tyytyväinen."),
                    O("Mi jefe me ha pedido muchas cosas urgentes.", "Pomoni on pyytänyt minulta paljon kiireellisiä asioita.",
                      "¡Vaya! Así que tu jefe te ha pedido muchas cosas urgentes.", "Voi ei! Eli pomosi on pyytänyt sinulta paljon kiireellisiä asioita."),
                    O("He trabajado desde casa y ha ido bien.", "Tein etätöitä kotoa ja se meni hyvin.",
                      "¡Qué cómodo! Así que has trabajado desde casa y ha ido bien.", "Kuinka kätevää! Eli olet tehnyt etätöitä kotoa ja se on mennyt hyvin.")
                ]
            },
            weekend_plans: {
                followup: true,
                q: "¿Y tienes algún plan especial para este fin de semana?",
                qFi: "Onko sinulla jotain erityistä suunnitelmaa tälle viikonlopulle?",
                opts: [
                    O("Voy a ir a la casa de verano con mi familia.", "Menen mökille perheeni kanssa.",
                      "¡Qué maravilla! Así que vas a ir a la casa de verano con tu familia.", "Ihanaa! Eli menet mökille perheesi kanssa.", 'sauna'),
                    O("Quiero dormir mucho y no hacer nada.", "Haluan nukkua paljon enkä tehdä mitään.",
                      "¡Te lo mereces! Así que quieres dormir mucho y no hacer nada.", "Ansaitset sen! Eli haluat nukkua paljon etkä tehdä mitään."),
                    O("He quedado con unos amigos para cenar.", "Olen sopinut illallisen ystävien kanssa.",
                      "¡Qué bien! Así que has quedado con unos amigos para cenar.", "Kiva! Eli olet sopinut illallisen ystävien kanssa."),
                    O("Voy a ver un partido de hockey.", "Aion katsoa jääkiekko-ottelun.",
                      "¡Qué emoción! Así que vas a ver un partido de hockey.", "Jännittävää! Eli aiot katsoa jääkiekko-ottelun."),
                    O("Todavía no lo sé, improvisaré.", "En tiedä vielä, improvisoin.",
                      "¡Me parece bien! Así que todavía no lo sabes y vas a improvisar.", "Hyvältä kuulostaa! Eli et tiedä vielä ja aiot improvisoida.")
                ]
            },
            monday_mood: {
                followup: true,
                q: "¿Y cómo te sientes al pensar en el lunes?",
                qFi: "Ja miltä tuntuu ajatella maanantaita?",
                opts: [
                    O("Un poco perezoso, la verdad.", "Vähän laiskalta, totta puhuen.",
                      "¡Es normal! Así que, la verdad, te sientes un poco perezoso.", "Se on normaalia! Eli totta puhuen olosi on vähän laiska."),
                    O("Bien, me gusta mi trabajo.", "Hyvältä, pidän työstäni.",
                      "¡Qué suerte! Así que te sientes bien porque te gusta tu trabajo.", "Onnekasta! Eli olosi on hyvä, koska pidät työstäsi."),
                    O("Nervioso, porque tengo una semana muy llena.", "Hermostuneelta, koska minulla on todella täysi viikko.",
                      "¡Ánimo! Así que estás nervioso porque tienes una semana muy llena.", "Tsemppiä! Eli olet hermostunut, koska sinulla on todella täysi viikko."),
                    O("Tranquilo, prefiero no pensar en eso todavía.", "Rauhalliselta, en halua vielä ajatella sitä.",
                      "¡Muy sabio! Así que estás tranquilo y prefieres no pensar en eso todavía.", "Viisasta! Eli olet rauhallinen etkä halua vielä ajatella sitä.")
                ]
            },
            sport_today: {
                followup: true,
                q: "¡Qué energía! ¿Y qué deporte has hecho?",
                qFi: "Mikä energia! Ja mitä urheilulajia harrastit?",
                opts: [
                    O("He salido a correr por el parque.", "Kävin juoksemassa puistossa.",
                      "¡Genial! Así que has salido a correr por el parque.", "Mahtavaa! Eli kävit juoksemassa puistossa."),
                    O("He ido al gimnasio a levantar pesas.", "Kävin salilla nostamassa painoja.",
                      "¡Qué fuerte! Así que has ido al gimnasio a levantar pesas.", "Vahvaa! Eli kävit salilla nostamassa painoja."),
                    O("He nadado en la piscina.", "Uin uimahallissa.",
                      "¡Qué bien! Así que has nadado en la piscina.", "Hienoa! Eli uit uimahallissa."),
                    O("He montado en bicicleta durante una hora.", "Pyöräilin tunnin.",
                      "¡Estupendo! Así que has montado en bicicleta durante una hora.", "Loistavaa! Eli pyöräilit tunnin ajan."),
                    O("He hecho esquí de fondo en el bosque.", "Hiihdin metsässä.",
                      "¡Qué finlandés! Así que has hecho esquí de fondo en el bosque.", "Kuinka suomalaista! Eli hiihdit metsässä.")
                ]
            },
            books: {
                followup: true,
                q: "¿Y qué tipo de libros te gustan más?",
                qFi: "Ja minkälaisista kirjoista pidät eniten?",
                opts: [
                    O("Las novelas de misterio y de crimen.", "Mysteeri- ja rikosromaaneista.",
                      "¡Qué intriga! Así que te gustan las novelas de misterio y de crimen.", "Jännittävää! Eli pidät mysteeri- ja rikosromaaneista."),
                    O("Los libros de historia.", "Historiakirjoista.",
                      "¡Interesante! Así que te gustan los libros de historia.", "Mielenkiintoista! Eli pidät historiakirjoista."),
                    O("La ciencia ficción y la fantasía.", "Scifistä ja fantasiasta.",
                      "¡Genial! Así que te gustan la ciencia ficción y la fantasía.", "Mahtavaa! Eli pidät scifistä ja fantasiasta."),
                    O("Las biografías de personas famosas.", "Kuuluisien ihmisten elämäkerroista.",
                      "¡Ajá! Así que te gustan las biografías de personas famosas.", "Ahaa! Eli pidät kuuluisien ihmisten elämäkerroista.")
                ]
            },
            sauna: {
                followup: true,
                q: "¡La sauna es muy finlandesa! ¿Con qué frecuencia vas a la sauna?",
                qFi: "Sauna on hyvin suomalainen! Kuinka usein käyt saunassa?",
                opts: [
                    O("Casi todos los días.", "Melkein joka päivä.",
                      "¡Increíble! Así que vas a la sauna casi todos los días.", "Uskomatonta! Eli käyt saunassa melkein joka päivä."),
                    O("Una vez a la semana, normalmente el sábado.", "Kerran viikossa, yleensä lauantaina.",
                      "¡Qué tradicional! Así que vas a la sauna una vez a la semana, normalmente el sábado.", "Kuinka perinteistä! Eli käyt saunassa kerran viikossa, yleensä lauantaina."),
                    O("Solo cuando estoy en la casa de verano.", "Vain silloin, kun olen mökillä.",
                      "¡Ajá! Así que solo vas a la sauna cuando estás en la casa de verano.", "Ahaa! Eli käyt saunassa vain silloin, kun olet mökillä."),
                    O("Y después me baño en el lago, aunque esté frío.", "Ja sen jälkeen uin järvessä, vaikka olisi kylmä.",
                      "¡Qué valiente! Así que después de la sauna te bañas en el lago, aunque esté frío.", "Kuinka rohkeaa! Eli saunan jälkeen uit järvessä, vaikka olisi kylmä.")
                ]
            },
            cooking: {

        // Kunkin vastauksen aikamuoto (vastausten järjestyksessä)
        var TENSES = {
            start: 'pres indef pres pres perf perf',
            work_day: 'perf perf perf perf perf',
            weekend_plans: 'fut fut perf fut futs',
            sport_today: 'perf perf perf perf perf',
            series: 'pres pres pres perf',
            beach: 'cond cond cond cond',
            evening: 'imperf pres fut fut pres',
            yesterday: 'indef indef indef indef indef',
            tomorrow: 'pres pres pres fut pres',
            food: 'pres pres fut pres futs',
            travel: 'cond cond cond pres cond',
            childhood: 'imperf imperf imperf imperf imperf',
            ideal_weekend: 'cond cond cond cond cond',
            closing: 'perf perf perf pres pres',
            evening_fu: 'fut fut pres pres',
            yesterday_fu: 'indef indef indef indef',
            tomorrow_fu: 'fut fut fut pres',
            travel_fu: 'cond cond cond cond',
            pets_fu: 'cond cond cond cond',
            childhood_fu: 'imperf imperf imperf imperf',
            ideal_weekend_fu: 'cond cond cond cond'
            // muut: presente
        };

        function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

        function buildDrill(verb, entry, tense) {
            var parts = entry.split('|');
            var es = parts[0], fi = parts[1], fiKey = parts[2] || FI_DEFAULT[verb];
            var esF = esForms(verb, tense), fiF = fiForms(fiKey, tense);
            function esLine(p) {
                var c = p === 0
                    ? es.replace(/\{mis\}/g, 'mis').replace(/\{mi\}/g, 'mi').replace(/\{me\}/g, 'me')
                    : es.replace(/\{mis\}/g, 'tus').replace(/\{mi\}/g, 'tu').replace(/\{me\}/g, 'te');
                return capitalize(esF[p] + ' ' + c) + '.';
            }
            function fiLine(p) {
                var c = fi.replace(/\{([^\/}]*)\/([^}]*)\}/g, function(m, a, b) { return p === 0 ? a : b; });
                return capitalize(fiF[p] + (c.charAt(0) === ',' ? '' : ' ') + c) + '.';
            }
            return { verb: verb, forms: esF, es1: esLine(0), es2: esLine(1), fi1: fiLine(0), fi2: fiLine(1) };
        }

        // Liitetään jokaiseen vastaukseen aikamuoto ja 10 kertausparia
        Object.keys(NODES).forEach(function(id) {
            var set = DRILL_SETS[id];
            var tenses = (TENSES[id] || '').split(' ');
            NODES[id].opts.forEach(function(opt, i) {
                opt.tense = tenses[i] || 'pres';
                if (set) opt.drills = VERB_ORDER.map(function(v, k) { return buildDrill(v, set[k], opt.tense); });
            });
        });
        // ------------------------------------------------------------------
        //  TILA
        // ------------------------------------------------------------------
        var state = {
            showHints: true,
            autoAudio: true,        // ohjelman repliikit ääneen
            readMyAnswers: true,    // omat valinnat ääneen
            rate: 0.9,
            sessionLength: 8,
            currentNodeId: null,
            mainQueue: [],
            visited: {},
            topicNumber: 1,
            topicTotal: 10,
            nodesExplored: 0,
            currentOptions: [],
            currentQuestionEs: "",
            currentItems: [],
            busy: false,
            history: []
        };

        function loadSettings() {
            try {
                var s = JSON.parse(localStorage.getItem('hablemos-settings') || '{}');
                if (typeof s.showHints === 'boolean') state.showHints = s.showHints;
                if (typeof s.autoAudio === 'boolean') state.autoAudio = s.autoAudio;
                if (typeof s.readMyAnswers === 'boolean') state.readMyAnswers = s.readMyAnswers;
                if (s.rate) state.rate = parseFloat(s.rate) || 0.9;
                if (s.sessionLength) state.sessionLength = parseInt(s.sessionLength, 10) || 8;
            } catch (e) { /* ei tallennusta saatavilla */ }
        }
        function saveSettings() {
            try {
                localStorage.setItem('hablemos-settings', JSON.stringify({
                    showHints: state.showHints, autoAudio: state.autoAudio, readMyAnswers: state.readMyAnswers,
                    rate: state.rate, sessionLength: state.sessionLength
                }));
            } catch (e) { /* ohitetaan */ }
        }

        // ------------------------------------------------------------------
        //  PUHE (Web Speech API)
        //  Ohjelma ja käyttäjä saavat eri äänen, jos selaimessa on useampi
        //  espanjankielinen ääni; muuten erotetaan äänenkorkeudella.
        // ------------------------------------------------------------------
        var esVoices = [];
        var speechToken = 0;

        function loadVoices() {
            if (!('speechSynthesis' in window)) return;
            var all = window.speechSynthesis.getVoices() || [];
            esVoices = all.filter(function(v) { return v.lang && v.lang.toLowerCase().indexOf('es') === 0; });
            // es-ES ensin
            esVoices.sort(function(a, b) {
                var as = a.lang.toLowerCase() === 'es-es' ? 0 : 1;
                var bs = b.lang.toLowerCase() === 'es-es' ? 0 : 1;
                return as - bs;
            });
        }
        if ('speechSynthesis' in window) {
            loadVoices();
            window.speechSynthesis.onvoiceschanged = loadVoices;
        }

        function voiceFor(role) {
            if (esVoices.length === 0) return null;
            if (role === 'user' && esVoices.length > 1) return esVoices[1];
            return esVoices[0];
        }

        function setSpeakingIndicator(role, on) {
            var avatar = document.getElementById('ai-avatar');
            if (avatar) avatar.classList.toggle('speaking', on && role === 'ai');
            var chosen = document.querySelector('#options-container .chosen');
            if (chosen) chosen.classList.toggle('speaking', on && role === 'user');
        }

        // Puhuu tekstin ja kutsuu onDone kun valmis (myös jos puhe ei toimi)
        function speak(text, role, onDone) {
            var token = ++speechToken;
            var finished = false;
            function done() {
                if (finished) return;
                finished = true;
                clearTimeout(fallback);
                setSpeakingIndicator(role, false);
                if (token === speechToken && onDone) onDone();
            }

            if (!('speechSynthesis' in window)) {
                var fallback = setTimeout(done, 300);
                return;
            }

            // Varmistus: jos onend ei laukea (osa selaimista), jatketaan silti
            var fallback = setTimeout(done, 2500 + text.length * 110 / state.rate);

            try {
                window.speechSynthesis.cancel();
                var u = new SpeechSynthesisUtterance(text);
                u.lang = 'es-ES';
                u.rate = state.rate;
                var v = voiceFor(role);
                if (v) { u.voice = v; u.lang = v.lang; }
                // Jos vain yksi ääni, erotetaan käyttäjän ääni korkeudella
                u.pitch = (role === 'user' && esVoices.length < 2) ? 1.3 : 1.0;
                u.onstart = function() { setSpeakingIndicator(role, true); };
                u.onend = done;
                u.onerror = done;
                window.speechSynthesis.speak(u);
            } catch (e) {
                console.log('Speech error:', e);
                done();
            }
        }

        // Puhejono: lukee rivit peräkkäin ja korostaa luettavan rivin
        var queueToken = 0;
        function clearReading() {
            Array.prototype.forEach.call(document.querySelectorAll('.reading'), function(el) { el.classList.remove('reading'); });
        }
        function speakQueue(items, onDone) {
            var my = ++queueToken;
            var i = 0;
            function next() {
                if (my !== queueToken) return;
                clearReading();
                if (i >= items.length) { if (onDone) onDone(); return; }
                var it = items[i++];
                if (!it.text) { next(); return; }
                if (it.el) {
                    it.el.classList.add('reading');
                    try { it.el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } catch (e) {}
                }
                speak(it.text, it.role, function() {
                    if (my !== queueToken) return;
                    if (it.el) it.el.classList.remove('reading');
                    setTimeout(next, (it.pause || 350) / state.rate);
                });
            }
            next();
        }
        function say(text, role) { speakQueue([{ text: text, role: role }]); }

        function stopSpeech() {
            queueToken++;
            speechToken++;
            try { if ('speechSynthesis' in window) window.speechSynthesis.cancel(); } catch (e) {}
            clearReading();
            setSpeakingIndicator('ai', false);
        }

        // ------------------------------------------------------------------
        //  PELIN KULKU
        // ------------------------------------------------------------------
        function shuffle(arr) {
            var a = arr.slice();
            for (var i = a.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var t = a[i]; a[i] = a[j]; a[j] = t;
            }
            return a;
        }

        function initGame() {
            stopSpeech();
            state.nodesExplored = 0;
            state.history = [];
            state.visited = {};
            state.busy = false;
            state.mainQueue = shuffle(MAIN_TOPICS).slice(0, Math.min(state.sessionLength, MAIN_TOPICS.length));
            state.topicNumber = 1;
            state.topicTotal = state.mainQueue.length + 2; // aloitus + pääaiheet + lopetus

            goToNode(START_NODE, null, false);
            updateHistoryUI();
        }

        function restartGame() { initGame(); }

        function pickNextNodeId(option) {
            if (state.currentNodeId === CLOSING_NODE) return null;
            if (option.next && !state.visited[option.next]) return option.next;
            // Muuten jatkokysymys sen aiheen perusteella, johon juuri vastasit
            var cur = NODES[state.currentNodeId];
            if (cur && cur.fu && !state.visited[cur.fu]) return cur.fu;
            while (state.mainQueue.length) {
                var id = state.mainQueue.shift();
                if (!state.visited[id]) return id;
            }
            return CLOSING_NODE;
        }

        function goToNode(nodeId, option, speakIt) {
            var node = NODES[nodeId];
            state.currentNodeId = nodeId;
            state.visited[nodeId] = true;
            if (option && !node.followup) state.topicNumber++;

            renderScreen(option, node.q, node.qFi, speakIt);
            setOptions(node.opts);

            var badge = document.getElementById('followup-badge');
            if (badge) badge.classList.toggle('hidden', !node.followup);
            updateStats();
        }

        function finishGame(option) {
            state.currentNodeId = null;
            renderScreen(option,
                "¡Excelente trabajo! Has completado esta conversación. ¡Sigue practicando!",
                "Hienoa työtä! Olet suorittanut tämän keskustelun. Jatka harjoittelua!",
                true
            );
            setOptions([]);
            var badge = document.getElementById('followup-badge');
            if (badge) badge.classList.add('hidden');
            updateStats();
        }

        function selectOption(option, btn) {
            if (state.busy) return;
            state.busy = true;

            state.nodesExplored++;
            state.history.push({ q: state.currentQuestionEs, ans: option.es, fi: option.fi });
            updateHistoryUI();
            updateStats();

            // Korostetaan valittu vastaus
            var container = document.getElementById('options-container');
            if (container) {
                Array.prototype.forEach.call(container.children, function(el) {
                    el.style.pointerEvents = 'none';
                    if (el === btn) el.classList.add('chosen'); else el.classList.add('dimmed');
                });
            }

            var proceed = function() {
                var nextId = pickNextNodeId(option);
                if (nextId) goToNode(nextId, option, true);
                else finishGame(option);
                state.busy = false;
            };

            if (state.readMyAnswers) {
                stopSpeech();
                speakQueue([{ text: option.es, role: 'user', el: btn, pause: 250 }], proceed);
            } else {
                stopSpeech();
                setTimeout(proceed, 300);
            }
        }

        // ------------------------------------------------------------------
        //  KÄYTTÖLIITTYMÄ
        // ------------------------------------------------------------------
        function toggleHints() {
            state.showHints = !state.showHints;
            saveSettings();
            applySettingsUI();
            renderOptions();
        }

        function toggleAutoAudio() {
            state.autoAudio = !state.autoAudio;
            if (!state.autoAudio) stopSpeech();
            saveSettings();
            applySettingsUI();
        }

        function toggleReadMyAnswers() {
            state.readMyAnswers = !state.readMyAnswers;
            saveSettings();
            applySettingsUI();
        }

        function changeRate(v) {
            state.rate = parseFloat(v) || 0.9;
            saveSettings();
        }

        function changeLength(v) {
            state.sessionLength = parseInt(v, 10) || 8;
            saveSettings();
            initGame();
        }

        function applySettingsUI() {
            var hintsStatus = document.getElementById('hints-status');
            if (hintsStatus) hintsStatus.textContent = state.showHints ? 'Vihjeet: On' : 'Vihjeet: Off';
            var hintIndicator = document.getElementById('hint-indicator');
            if (hintIndicator) hintIndicator.classList.toggle('hidden', !state.showHints);
            applyHintVisibility();

            var icon = document.getElementById('audio-icon');
            if (icon) icon.className = state.autoAudio
                ? "fa-solid fa-volume-high text-amber-500 text-sm"
                : "fa-solid fa-volume-xmark text-slate-400 text-sm";
            var audioStatus = document.getElementById('audio-status');
            if (audioStatus) audioStatus.textContent = state.autoAudio ? 'Ohjelma: On' : 'Ohjelma: Off';

            var myIcon = document.getElementById('my-voice-icon');
            if (myIcon) myIcon.className = state.readMyAnswers
                ? "fa-solid fa-user text-emerald-400 text-sm"
                : "fa-solid fa-user-slash text-slate-400 text-sm";
            var myStatus = document.getElementById('my-voice-status');
            if (myStatus) myStatus.textContent = state.readMyAnswers ? 'Oma vastaus: On' : 'Oma vastaus: Off';

            var rateSel = document.getElementById('rate-select');
            if (rateSel) rateSel.value = String(state.rate);
            var lenSel = document.getElementById('length-select');
            if (lenSel) lenSel.value = String(state.sessionLength);
        }

        function toggleHistory() {
            var panel = document.getElementById('history-panel');
            if (panel) panel.classList.toggle('hidden');
        }

        function updateStats() {
            var stepCountEl = document.getElementById('step-count');
            var stepTotalEl = document.getElementById('step-total');
            var nodesExploredEl = document.getElementById('nodes-explored');
            if (stepCountEl) stepCountEl.textContent = Math.min(state.topicNumber, state.topicTotal);
            if (stepTotalEl) stepTotalEl.textContent = state.topicTotal;
            if (nodesExploredEl) nodesExploredEl.textContent = state.nodesExplored;
        }

        function setText(id, text) {
            var el = document.getElementById(id);
            if (el) el.textContent = text || '';
        }

        // Näyttää: kuittaus -> verbikertaus (yo / tú) -> seuraava kysymys
        function renderScreen(option, qEsText, qFiText, speakIt) {
            state.currentQuestionEs = qEsText;
            var ackBlock = document.getElementById('ack-block');
            var drillBlock = document.getElementById('drill-block');
            var qBlock = document.getElementById('question-block');
            var box = document.getElementById('ai-box');
            var items = [];

            if (option && option.ack) {
                setText('ack-es', option.ack);
                setText('ack-fi', option.ackFi);
                ackBlock.classList.remove('hidden');
                items.push({ text: option.ack, role: 'ai', el: ackBlock, pause: 450 });
            } else {
                ackBlock.classList.add('hidden');
            }

            var drills = option && option.drills;
            var list = document.getElementById('drill-list');
            list.innerHTML = '';
            if (drills && drills.length) {
                setText('drill-tense', TENSE_LABELS[option.tense] || option.tense);
                drills.forEach(function(d) {
                    var row = document.createElement('div');
                    row.className = 'border-l-2 border-emerald-700/60 pl-2';
                    row.innerHTML =
                        '<div class="text-[10px] font-bold uppercase tracking-wider text-emerald-400">' + escapeHtml(d.verb) +
                        ' <span class="normal-case tracking-normal text-emerald-200/70">· ' + escapeHtml(d.forms[0]) + ' / ' + escapeHtml(d.forms[1]) + '</span></div>' +
                        '<div class="drill-yo speak-line cursor-pointer rounded px-1 -mx-1">' +
                            '<p class="text-sm sm:text-base font-bold text-emerald-100 leading-snug">' + escapeHtml(d.es1) + '</p>' +
                            '<p class="translation-hint text-xs text-emerald-200/60 italic leading-tight">' + escapeHtml(d.fi1) + '</p></div>' +
                        '<div class="drill-tu speak-line cursor-pointer rounded px-1 -mx-1">' +
                            '<p class="text-sm sm:text-base font-bold text-amber-200 leading-snug">' + escapeHtml(d.es2) + '</p>' +
                            '<p class="translation-hint text-xs text-amber-200/60 italic leading-tight">' + escapeHtml(d.fi2) + '</p></div>';
                    var yo = row.querySelector('.drill-yo'), tu = row.querySelector('.drill-tu');
                    yo.onclick = function() { say(d.es1, 'user'); };
                    tu.onclick = function() { say(d.es2, 'ai'); };
                    list.appendChild(row);
                    items.push({ text: d.es1, role: 'user', el: yo, pause: 300 });
                    items.push({ text: d.es2, role: 'ai', el: tu, pause: 500 });
                });
                list.scrollTop = 0;
                drillBlock.classList.remove('hidden');
            } else {
                drillBlock.classList.add('hidden');
            }

            setText('ai-question-es', qEsText);
            setText('ai-question-fi', qFiText);
            items.push({ text: qEsText, role: 'ai', el: qBlock });

            if (option && option.ack) ackBlock.onclick = function() { say(option.ack, 'ai'); };
            qBlock.onclick = function(e) {
                if (e.target.closest('#speak-btn')) return;
                say(qEsText, 'ai');
            };
            var speakBtn = document.getElementById('speak-btn');
            if (speakBtn) speakBtn.onclick = function(e) { e.stopPropagation(); speakQueue(state.currentItems); };

            state.currentItems = items;
            applyHintVisibility();
            if (box) { box.classList.remove('fade-in'); void box.offsetWidth; box.classList.add('fade-in'); }

            if (speakIt && state.autoAudio) speakQueue(items);
        }

        function applyHintVisibility() {
            Array.prototype.forEach.call(document.querySelectorAll('#ai-box .translation-hint'), function(el) {
                el.classList.toggle('hidden', !state.showHints);
            });
        }

        function setOptions(options) {
            state.currentOptions = options;
            renderOptions();
        }

        function renderOptions() {
            var container = document.getElementById('options-container');
            if (!container) return;
            container.innerHTML = '';

            if (!state.currentOptions || state.currentOptions.length === 0) {
                container.innerHTML =
                    '<button onclick="restartGame()" class="w-full py-4 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-lg rounded-xl transition shadow-lg flex items-center justify-center gap-2">' +
                    '<i class="fa-solid fa-rotate-right"></i> Aloita uusi keskustelu (uudet aiheet)</button>';
                return;
            }

            state.currentOptions.forEach(function(opt, idx) {
                var btn = document.createElement('div');
                btn.setAttribute('role', 'button');
                btn.tabIndex = 0;
                btn.className = "w-full text-left p-2.5 sm:p-3 rounded-xl border border-slate-700 hover:border-amber-400 bg-slate-900/80 hover:bg-amber-950/40 transition duration-150 group flex items-center gap-3 shadow cursor-pointer shrink-0";

                var isHiddenClass = state.showHints ? '' : 'hidden';
                btn.innerHTML =
                    '<span class="flex-shrink-0 w-7 h-7 sm:w-8 sm:h-8 rounded-lg bg-slate-800 group-hover:bg-amber-500 group-hover:text-white text-amber-400 font-extrabold text-sm sm:text-base flex items-center justify-center border border-slate-700 transition">' + (idx + 1) + '</span>' +
                    '<div class="flex-1 min-w-0">' +
                        '<p class="text-base sm:text-lg font-bold text-slate-100 group-hover:text-amber-300 leading-tight">' + escapeHtml(opt.es) + '</p>' +
                        (opt.fi ? '<p class="translation-hint ' + isHiddenClass + ' text-xs sm:text-sm text-slate-300/80 mt-0.5 font-medium leading-tight">' + escapeHtml(opt.fi) + '</p>' : '') +
                    '</div>' +
                    '<button class="listen-btn flex-shrink-0 text-slate-400 hover:text-emerald-400 p-1.5 text-base" title="Kuuntele tämä vastaus valitsematta"><i class="fa-solid fa-ear-listen"></i></button>';

                btn.querySelector('.listen-btn').onclick = function(e) {
                    e.stopPropagation();
                    say(opt.es, 'user');
                };
                btn.onclick = function() { selectOption(opt, btn); };
                btn.onkeydown = function(e) { if (e.key === 'Enter') selectOption(opt, btn); };
                container.appendChild(btn);
            });
        }

        function updateHistoryUI() {
            var historyEl = document.getElementById('history-content');
            if (!historyEl) return;

            if (state.history.length === 0) {
                historyEl.innerHTML = '<p class="italic text-slate-400">Ei vielä aiempia siirtoja.</p>';
                return;
            }

            historyEl.innerHTML = '';
            state.history.forEach(function(item, idx) {
                var row = document.createElement('div');
                row.className = "border-b border-slate-700 pb-1 cursor-pointer hover:text-amber-200";
                row.innerHTML = '<span class="font-bold text-amber-500">V' + (idx + 1) + ':</span> ' + escapeHtml(item.ans) +
                    ' <span class="text-slate-500">— ' + escapeHtml(item.fi) + '</span> <i class="fa-solid fa-volume-low text-slate-500 ml-1"></i>';
                row.onclick = function() { say(item.ans, 'user'); };
                historyEl.appendChild(row);
            });
        }

        function escapeHtml(str) {
            return str ? String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : '';
        }

        // Näppäimistö: 1–9 valitsee vastauksen, välilyönti toistaa kysymyksen
        document.addEventListener('keydown', function(e) {
            if (e.target && (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT')) return;
            var n = parseInt(e.key, 10);
            if (!isNaN(n) && n >= 1 && n <= state.currentOptions.length) {
                var container = document.getElementById('options-container');
                selectOption(state.currentOptions[n - 1], container ? container.children[n - 1] : null);
            } else if (e.key === ' ') {
                e.preventDefault();
                speakQueue(state.currentItems || []);
            }
        });

        loadSettings();
        applySettingsUI();
        initGame();
    </script>
</body>
</html>
