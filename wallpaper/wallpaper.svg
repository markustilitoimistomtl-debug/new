<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440">
  <defs>
    <!-- Schulz-henkinen hieman vapiseva mustejälki -->
    <filter id="ink" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="5"/>
    </filter>
    <!-- Rasteripisteet, painetun sarjakuvan tuntu -->
    <pattern id="halftone" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <circle cx="11" cy="11" r="4" fill="#2a1b3d"/>
    </pattern>
    <pattern id="dots" width="44" height="44" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="7" fill="#fff6e4"/>
      <circle cx="33" cy="33" r="7" fill="#fff6e4"/>
    </pattern>
    <pattern id="stripes" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="60" height="30" fill="#f4f0e6"/>
      <rect y="30" width="60" height="30" fill="#e9e2d0"/>
    </pattern>
    <clipPath id="head3"><ellipse cx="0" cy="630" rx="190" ry="172"/></clipPath>
    <radialGradient id="space" cx="50%" cy="60%" r="60%">
      <stop offset="0" stop-color="#4b2a8a"/>
      <stop offset="1" stop-color="#120a2e"/>
    </radialGradient>
  </defs>

  <!-- TAUSTA: sanomalehtipaperi + psykedeelinen pop -->
