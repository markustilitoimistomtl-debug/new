<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}</style>
</head>
<body>
<title>LSP Logo Styler</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;800&family=Barlow:wght@400;500;600&family=Anton&family=Bebas+Neue&family=Oswald:wght@700&family=Graduate&family=Bungee&family=Bungee+Shade&family=Bungee+Inline&family=Black+Ops+One&family=Racing+Sans+One&family=Saira+Stencil+One&family=Alfa+Slab+One&family=Russo+One&family=Press+Start+2P&family=Pirata+One&family=UnifrakturMaguntia&family=Faster+One&family=Monoton&family=Permanent+Marker&family=Sedgwick+Ave+Display&family=Rubik+Spray+Paint&family=Rubik+Mono+One&family=Kaushan+Script&family=Yellowtail&family=Squada+One&family=Changa+One&family=Staatliches&family=Teko:wght@700&family=Bowlby+One+SC&family=Holtwood+One+SC&family=Titan+One&family=Luckiest+Guy&family=Archivo+Black&family=Big+Shoulders+Display:wght@900&family=Lobster&family=Audiowide&family=Orbitron:wght@900&family=Silkscreen&display=swap">
<style>
/* Layout: three-column workbench (add · stage · inspector); stacks to one column on phones. Deliberately dark-only, like a print-shop lightbox. */
:root{
  --bg:#110f18; --panel:#1a1724; --panel2:#221e2f; --line:#322c45; --fg:#ece8f4; --mute:#9d95b4;
  --accent:#f5a524; --accent-ink:#1a1206; --hot:#ff5d3a; --check1:#1d1a27; --check2:#25212f;
  --display:"Saira Condensed","Arial Narrow",sans-serif; --body:"Barlow",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:270px minmax(0,1fr) 330px;grid-template-rows:auto minmax(0,1fr);height:100%;
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
header{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);line-height:1}
.brand small{display:block;font-size:11px;letter-spacing:.2em;color:var(--mute);font-weight:600}
.tb{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.tb .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 9px;cursor:pointer;white-space:nowrap;font-size:13px;line-height:1.2}
.btn:hover{border-color:var(--mute)}
.btn:focus-visible,.tile:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn[disabled]{opacity:.4;cursor:default}
.spacer{flex:1}
aside{overflow-y:auto;background:var(--panel);min-height:0}
aside.left{border-right:1px solid var(--line)}
aside.right{border-left:1px solid var(--line)}
h2{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.12em;font-size:13px;color:var(--mute);margin:0}
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:10px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.tab{background:none;border:1px solid transparent;border-radius:6px;padding:4px 8px;cursor:pointer;font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:13px;color:var(--mute)}
.tab[aria-selected="true"]{color:var(--fg);border-color:var(--line);background:var(--panel2)}
.pane{padding:12px;display:flex;flex-direction:column;gap:10px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tile{aspect-ratio:1;background:var(--panel2);border:1px solid var(--line);border-radius:6px;cursor:pointer;padding:6px;display:flex;align-items:center;justify-content:center;color:var(--fg)}
.tile:hover{border-color:var(--accent);color:var(--accent)}
.tile svg{width:100%;height:100%}
.hint{color:var(--mute);font-size:12.5px;line-height:1.4;margin:0}
.list{display:flex;flex-direction:column;gap:6px}
.list .btn{text-align:left}
main{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column}
.stagewrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:16px}
#stage{width:min(100%,calc(100vh - 140px));aspect-ratio:1;max-width:100%;touch-action:none;border-radius:4px;
  background:repeating-conic-gradient(var(--check1) 0 25%,var(--check2) 0 50%) 0 0/24px 24px;box-shadow:0 0 0 1px var(--line);user-select:none;-webkit-user-select:none}
.status{display:flex;gap:12px;padding:6px 16px;border-top:1px solid var(--line);color:var(--mute);font-size:12px;flex-wrap:wrap}
.layers{display:flex;flex-direction:column;gap:2px;padding:0 12px 12px}
.lrow{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:6px;border:1px solid transparent;cursor:pointer}
.lrow:hover{background:var(--panel2)}
.lrow.on{border-color:var(--accent);background:var(--panel2)}
.lrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .ic{background:none;border:0;cursor:pointer;color:var(--mute);padding:2px 4px;font-size:13px}
.lrow .ic.off{opacity:.35}
.lrow .ty{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
details{border-top:1px solid var(--line)}
details.libgrp{border-top:0}details.libgrp summary{padding:6px 0;font-size:12px;color:var(--mute)}details.libgrp .grid{padding-bottom:8px}
.imgtile{position:relative;aspect-ratio:1;background:repeating-conic-gradient(var(--check1) 0 25%,var(--check2) 0 50%) 0 0/12px 12px;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.imgtile:hover{border-color:var(--accent)}
.imgtile .main{all:unset;cursor:pointer;display:flex;width:100%;height:100%;align-items:center;justify-content:center}
.imgtile .main:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.imgtile img{max-width:88%;max-height:88%}
.imgtile .mini{position:absolute;top:2px;width:20px;height:20px;border-radius:4px;border:0;background:var(--panel);color:var(--fg);font-size:11px;cursor:pointer;line-height:20px;padding:0}
.imgtile .mini.del{right:2px}.imgtile .mini.src{left:2px}
.imgtile .mini.armed{background:var(--hot);color:#fff;width:auto;padding:0 5px}
.wizbtn{border-color:var(--accent);color:var(--accent);font-weight:600}
.wiz .wbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(1120px,100%);height:min(780px,100%);display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden}
.wiz header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:var(--panel)}
.wsteps{display:flex;gap:4px;flex-wrap:wrap}
.wstep{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border-radius:999px;border:1px solid var(--line);color:var(--mute);background:none;cursor:pointer}
.wstep.on{border-color:var(--accent);color:var(--accent-ink);background:var(--accent)}
.wstep.done{color:var(--fg)}
.wbody{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,400px);min-height:0}
.wleft{overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.wright{padding:16px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:8px;min-width:0}
.wright svg{width:100%;aspect-ratio:1;border-radius:8px;background:repeating-conic-gradient(var(--check1) 0 25%,var(--check2) 0 50%) 0 0/20px 20px}
.wiz footer{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);justify-content:flex-end;flex-wrap:wrap}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.wtile{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--fg);font-size:11.5px;line-height:1.2;text-align:center}
.wtile svg{width:100%;aspect-ratio:1}
.wtile:hover{border-color:var(--mute)}
.wtile.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.witem{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
.witem .nm{flex:1;min-width:120px}
.witem select,.witem input[type=text]{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:3px 6px}
.witem input[type=color]{width:40px;height:26px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:1px}
.wform{display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px;align-items:center}
.wform label{color:var(--mute);font-size:12.5px}
.wform input[type=text],.wform select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:5px 7px}
.wform input[type=color]{width:60px;height:28px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:1px}
@media (max-width:900px){.wbody{grid-template-columns:minmax(0,1fr);overflow-y:auto}.wleft{overflow:visible}.wright{border-left:0;border-top:1px solid var(--line);order:-1}.wright svg{max-width:340px;margin:auto}.wiz .wbox{height:100%}}
summary{cursor:pointer;padding:10px 12px;font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.1em;font-size:13px;color:var(--fg);list-style:none;display:flex;justify-content:space-between}
summary::after{content:"+";color:var(--mute)}
details[open] summary::after{content:"−"}
.props{display:flex;flex-direction:column;gap:8px;padding:0 12px 12px}
.row{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px;align-items:center}
.row label{color:var(--mute);font-size:12.5px}
.row .rng{display:flex;gap:6px;align-items:center;min-width:0}
.row input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
.row input[type=number]{width:62px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:3px 4px;font-variant-numeric:tabular-nums}
.row input[type=text],.row select,.row textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:4px 6px}
.row input[type=color]{width:100%;height:28px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:1px}
.row input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
.btnrow{display:flex;gap:4px;flex-wrap:wrap}
.fonts{display:grid;grid-template-columns:1fr 1fr;gap:4px;max-height:190px;overflow-y:auto;padding:2px}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:5px 6px;cursor:pointer;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.chip.on{border-color:var(--accent);color:var(--accent)}
.swatches{display:flex;flex-wrap:wrap;gap:4px}
.sw{width:30px;height:22px;border-radius:4px;border:1px solid var(--line);cursor:pointer;padding:0}
.empty{padding:12px;color:var(--mute)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel2);border:1px solid var(--accent);padding:8px 14px;border-radius:8px;z-index:20;max-width:calc(100% - 32px)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:30;padding:16px}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;max-width:520px;width:100%;display:flex;flex-direction:column;gap:10px}
.modal textarea{width:100%;height:220px;background:var(--bg);border:1px solid var(--line);border-radius:6px;font-family:ui-monospace,monospace;font-size:11px;padding:6px}
.modal img{max-height:50vh;margin:auto;background:repeating-conic-gradient(var(--check1) 0 25%,var(--check2) 0 50%) 0 0/16px 16px}
@media (max-width:900px){
  body{overflow:auto}
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto auto;height:auto;padding-left:0;padding-right:0}
  header{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  main{order:1}
  aside.left{order:2;border-right:0;border-top:1px solid var(--line)}
  aside.right{order:3;border-left:0;border-top:1px solid var(--line)}
  aside{overflow:visible}
  #stage{width:100%}
  .stagewrap{padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
  .grid{grid-template-columns:repeat(6,1fr)}
  .tabs{position:static}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <header>
    <div class="brand">LSP<small>Logo Styler Picture</small></div>
    <div class="tb" role="toolbar" aria-label="Edit">
      <button class="btn" id="bUndo" title="Undo (Ctrl+Z)">↶ Undo</button>
      <button class="btn" id="bRedo" title="Redo (Ctrl+Y)">↷</button>
      <span class="sep"></span>
      <button class="btn" id="bDup" title="Duplicate (Ctrl+D)">Duplicate</button>
      <button class="btn" id="bDel" title="Delete (Del)">Delete</button>
      <span class="sep"></span>
      <button class="btn" id="bFlipH" title="Flip horizontally">⇋ Flip</button>
      <button class="btn" id="bFlipV" title="Flip vertically">⇵</button>
      <button class="btn" id="bRotL" title="Rotate −15°">⟲ 15°</button>
      <button class="btn" id="bRotR" title="Rotate +15°">⟳ 15°</button>
      <button class="btn" id="bUpside" title="Upside down (180°)">180°</button>
      <span class="sep"></span>
      <button class="btn" id="bUp" title="Bring forward">Forward</button>
      <button class="btn" id="bDown" title="Send backward">Backward</button>
      <button class="btn" id="bCenter" title="Center on canvas">Center</button>
    </div>
    <span class="spacer"></span>
    <div class="tb">
      <button class="btn" id="bNew">New</button>
      <button class="btn" id="bOpen">Open .lsp</button>
      <button class="btn" id="bSaveJ">Save .lsp</button>
      <button class="btn wizbtn" id="bWizard">✦ Logo wizard</button>
      <button class="btn pri" id="bExport">Export image</button>
    </div>
  </header>

  <aside class="left" aria-label="Add objects">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div id="addPane"></div>
  </aside>

  <main>
    <div class="stagewrap">
      <svg id="stage" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" aria-label="Logo canvas"></svg>
    </div>
    <div class="status" id="status"></div>
  </main>

  <aside class="right" aria-label="Layers and properties">
    <div class="pane" style="padding-bottom:6px"><h2>Layers</h2></div>
    <div class="layers" id="layers"></div>
    <div id="props"></div>
    <details id="canvasSec">
      <summary>Canvas</summary>
      <div class="props" id="canvasProps"></div>
    </details>
  </aside>
</div>

<input type="file" id="fileSplit" accept="image/png,image/jpeg,image/webp" hidden>

<input type="file" id="fileAdd" accept=".lsp,.json,.svg,.png,application/json,image/svg+xml,image/png" hidden>
<input type="file" id="fileJson" accept=".lsp,.json,.svg,.png,application/json,image/svg+xml,image/png" hidden>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f1=n=>Math.round(n*100)/100;
const RAD=Math.PI/180;

/* ---------- geometry helpers ---------- */
function circ(cx,cy,r,rev){const s=rev?0:1;return `M${f1(cx-r)},${f1(cy)} A${r},${r} 0 1 ${s} ${f1(cx+r)},${f1(cy)} A${r},${r} 0 1 ${s} ${f1(cx-r)},${f1(cy)}Z`;}
function ell(cx,cy,rx,ry,rot=0,rev){const a=rot*RAD,c=Math.cos(a),s=Math.sin(a);const p1=[cx+rx*c,cy+rx*s],p2=[cx-rx*c,cy-rx*s],w=rev?0:1;
  return `M${f1(p1[0])},${f1(p1[1])} A${rx},${ry} ${rot} 1 ${w} ${f1(p2[0])},${f1(p2[1])} A${rx},${ry} ${rot} 1 ${w} ${f1(p1[0])},${f1(p1[1])}Z`;}
const poly=pts=>'M'+pts.map(p=>f1(p[0])+','+f1(p[1])).join(' L')+'Z';
function ngon(n,r,rot=-90,sy=1){const p=[];for(let i=0;i<n;i++){const a=(rot+360*i/n)*RAD;p.push([r*Math.cos(a),r*Math.sin(a)*sy]);}return poly(p);}
function starP(n,ro,ri,rot=-90){const p=[];for(let i=0;i<2*n;i++){const a=(rot+180*i/n)*RAD,r=i%2?ri:ro;p.push([r*Math.cos(a),r*Math.sin(a)]);}return poly(p);}
function gearP(n,ro,ri){const p=[],st=360/n;for(let i=0;i<n;i++){const a=i*st-90;[[a-st*.22,ro],[a+st*.22,ro],[a+st*.32,ri],[a+st*.68,ri]].forEach(([d,r])=>p.push([r*Math.cos(d*RAD),r*Math.sin(d*RAD)]));}return poly(p);}
function scallop(n,r,b){let d='';for(let i=0;i<n;i++){const a0=(i/n*360-90)*RAD,a1=((i+1)/n*360-90)*RAD;const p0=[r*Math.cos(a0),r*Math.sin(a0)],p1=[r*Math.cos(a1),r*Math.sin(a1)];
  d+=(i?'':`M${f1(p0[0])},${f1(p0[1])}`)+` A${b},${b} 0 0 1 ${f1(p1[0])},${f1(p1[1])}`;}return d+'Z';}
/* transforms absolute paths written with "x,y" pairs (M L C Q Z only) */
const tp=(d,fn)=>d.replace(/(-?\d*\.?\d+),(-?\d*\.?\d+)/g,(m,x,y)=>{const [a,b]=fn(+x,+y);return f1(a)+','+f1(b);});
const mir=d=>tp(d,(x,y)=>[-x,y]);
const rotD=(d,deg,ox=0,oy=0)=>{const c=Math.cos(deg*RAD),s=Math.sin(deg*RAD);return tp(d,(x,y)=>[ox+(x-ox)*c-(y-oy)*s,oy+(x-ox)*s+(y-oy)*c]);};
const sclD=(d,k,dx=0,dy=0)=>tp(d,(x,y)=>[x*k+dx,y*k+dy]);
function wedge(x1,y1,x2,y2,w1,w2){const a=Math.atan2(y2-y1,x2-x1)+Math.PI/2,c=Math.cos(a),s=Math.sin(a);
  return poly([[x1+c*w1/2,y1+s*w1/2],[x2+c*w2/2,y2+s*w2/2],[x2-c*w2/2,y2-s*w2/2],[x1-c*w1/2,y1-s*w1/2]]);}
function dripsD(seed){let r=seed*997+13;const rnd=()=>((r=(r*9301+49297)%233280)/233280);
  let d='M-100,-45 L100,-45 L100,-10',x=100,bulbs='';
  while(x>-92){const w=7+rnd()*12,len=12+rnd()*82,xr=x,xl=Math.max(-100,x-w),cx=(xr+xl)/2;
    d+=` L${f1(xr)},-10 L${f1(xr)},${f1(len)} L${f1(xl)},${f1(len)} L${f1(xl)},-10`;bulbs+=circ(cx,len,(xr-xl)*0.62);
    x=xl-(5+rnd()*20);if(x>-100)d+=` L${f1(x)},-10`;}
  return d+' L-100,-10Z'+bulbs;}
function leafD(x,y,ang,L,W){const a=ang*RAD,dx=Math.cos(a),dy=Math.sin(a),nx=-dy,ny=dx,mx=x+dx*L*.5,my=y+dy*L*.5;
  return `M${f1(x)},${f1(y)} Q${f1(mx+nx*W)},${f1(my+ny*W)} ${f1(x+dx*L)},${f1(y+dy*L)} Q${f1(mx-nx*W)},${f1(my-ny*W)} ${f1(x)},${f1(y)}Z`;}
function qline(p0,c,p1,w,n=14){let d='',prev=p0;for(let i=1;i<=n;i++){const t=i/n,u=1-t;
  const p=[u*u*p0[0]+2*u*t*c[0]+t*t*p1[0],u*u*p0[1]+2*u*t*c[1]+t*t*p1[1]];d+=wedge(prev[0],prev[1],p[0],p[1],w,w)+(i<n?circ(p[0],p[1],w/2):'');prev=p;}return d;}

function addPreset(k){const T=(p,s,t)=>addLayer(mk('text',{...TEXT_DEF,...p},s,t));
  switch(k){
    case 'ring':return addLayer(mk('ring',{...RING_DEF},{fill:'solid',c1:'#14111f',o1c:'#f5a524',o1w:6}));
    case 'ringthin':return addLayer(mk('ring',{...RING_DEF,w:24,top:'',bot:'',mark:''},{fill:'solid',c1:'#f5a524'}));
    case 'bigletter':return T({text:'A',font:'Graduate',size:600,ls:0},{fill:'solid',c1:'#13294b',o1c:'#ffffff',o1w:9,o2c:'#c8102e',o2w:8,shOn:true,shO:.35});
    case 'silhouette':return T({text:'A',font:'Graduate',size:600,ls:0},{fill:'none',o1c:'#f5a524',o1w:8});
    case 'mono':return T({text:'NY',font:'UnifrakturMaguntia',size:420,ls:-60},{fill:'solid',c1:'#0b3d91',o1c:'#ffffff',o1w:8});
    case 'text':return T({},{fill:'solid',c1:'#ffffff',o1w:6});
    case 'arcup':return T({text:'KAARITEKSTI',size:90,arc:35},{fill:'solid',c1:'#ffffff',o1w:6});
    case 'arcdown':return T({text:'KAARITEKSTI',size:90,arc:-35},{fill:'solid',c1:'#ffffff',o1w:6});
    case 'script':return T({text:'Tigers',font:'Yellowtail',size:180,ls:0},{fill:'linear',c1:'#ffd166',c2:'#f08c00',o1w:6,o2c:'#ffffff',o2w:5,shOn:true},{rot:-10});
    case 'varsity':return T({text:'VARSITY',font:'Graduate',size:130,ls:2},{fill:'solid',c1:'#c8102e',o1c:'#ffffff',o1w:6,o2c:'#14111f',o2w:6});
    case 'graffiti':return T({text:'GRAFFITI',font:'Sedgwick Ave Display',size:170,ls:-4},{fill:'tri',c1:'#ffe14d',c2:'#ff3cac',c3:'#5b2bff',o1w:7,o2c:'#ffffff',o2w:6,o3c:'#14111f',o3w:6,spray:10,rough:2},{rot:-6});
    case 'retro':return T({text:'RETRO',font:'Bungee',size:170,ls:4},{fill:'chrome',c1:'#7dd3fc',c2:'#1e3a8a',o1c:'#ffffff',o1w:4,o2c:'#ff3cac',o2w:5,exD:12,exC:'#3b0764',cutN:5,cutStart:.5,cutW:.45});
    case 'lpara':return addLayer(mk('lines',{...LINES_DEF},{fill:'solid',c1:'#f5a524',o1w:3}));
    case 'lflat':return addLayer(mk('lines',{...LINES_DEF,taper:0,stag:0,n:4,th:14,gap:10},{fill:'solid',c1:'#f5a524'}));
    case 'lburst':return addLayer(mk('lines',{...LINES_DEF,mode:'burst',n:18,len:700,th:26,taper:1,stag:.3,gap:30},{fill:'solid',c1:'#ffd166',opacity:.85}));
    case 'lswoosh':return addLayer(mk('lines',{...LINES_DEF,mode:'swoosh',n:3,len:420,th:14,gap:16,curve:70,stag:.25},{fill:'solid',c1:'#f5a524',o1w:3}));
    case 'lswish':return addLayer(mk('shape',{k:'swoosh'},{fill:'linear',c1:'#ff5d3a',c2:'#f5a524',angle:0,o1w:4},{sx:2.4,sy:2}));
  }
}

/* ---------- layers list ---------- */
function buildLayers(){const L=$('#layers');
  if(!S.layers.length){L.innerHTML='<p class="hint">No layers yet. Add a background, text or art from the left.</p>';return;}
  L.innerHTML=[...S.layers].reverse().map(l=>`<div class="lrow${l.id===sel?' on':''}" data-id="${l.id}">
    <button class="ic${l.visible?'':' off'}" data-vis title="${l.visible?'Hide':'Show'}" aria-label="Visibility">👁</button>
    <span class="nm">${esc(l.name)}</span><span class="ty">${TYPE_NAMES[l.type]}</span>
    <button class="ic${l.locked?'':' off'}" data-lock title="${l.locked?'Unlock':'Lock'}" aria-label="Lock">🔒</button></div>`).join('');
  L.querySelectorAll('.lrow').forEach(r=>{const id=r.dataset.id,l=S.layers.find(x=>x.id===id);
    r.onclick=e=>{if(e.target.closest('[data-vis]')){l.visible=!l.visible;render();buildLayers();commit();return;}
      if(e.target.closest('[data-lock]')){l.locked=!l.locked;buildLayers();commit();return;}select(id);};});
}

// builds a logo the same way the wizard does, from a plain description (used by tools/make-team-logos.js)
async function wizardLayers(spec){const keep=W;
  W={step:0,bg:null,tint:null,recolor:0,bgImg:null,glyph:{ch:'A',font:'Graduate',fill:false,art:null},style:0,symbols:[],texts:[],...spec};
  W.glyph={ch:'A',font:'Graduate',fill:false,art:null,...(spec.glyph||{})};
  try{if(W.bg==='glyph')W.glyph.art=await glyphArt(W.glyph.ch,W.glyph.font,W.glyph.fill);
    W.symbols=(W.symbols||[]).map(x=>{const a=x.lib?LIB[x.lib]:CLIP[x.k];return{k:x.lib?'':x.k,art:x.lib?{n:a.n,d:a.d,e:a.e?1:0,parts:a.parts}:null,name:a.n,mode:'separate',color:curStyle().ink,...x};});
    W.texts=(W.texts||[]).map(x=>({font:'Graduate',pos:'below',scale:1,look:'clean',color:curStyle().ink,blend:false,mode:'print',...x,arc:x.arc??TPOS[x.pos||'below'][2]}));

  finally{W=keep;}}
