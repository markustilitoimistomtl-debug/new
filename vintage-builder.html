<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vintage Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Chakra+Petch:wght@400;600;700&display=swap">

<style>
/* Layout: a workbench for the Vintage Basket game. Left rail of sections, right pane of tables. Same dark arcade look as the game. */
:root{
  --bg:#0d0b14; --panel:#1a1522; --panel2:#262033; --ink:#f1ece4; --dim:#a39cad; --line:#3a3049;
  --led:#ffb21e; --hot:#ff5a36; --ok:#5fd38a; --warn:#ffcc4d;
  --f-disp:'Silkscreen','Courier New',monospace; --f-body:'Chakra Petch',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body)}
button,input,select{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--led)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--led);outline-offset:1px}
button.big{background:var(--hot);border-color:var(--hot);color:#fff;font-family:var(--f-disp);padding:10px 16px}
button.del{color:#ff8a7a}
button[disabled]{opacity:.45;cursor:default}
input[type=text],input[type=number],select{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:5px 8px;min-width:0}
input[type=color]{width:34px;height:28px;border:1px solid var(--line);background:none;padding:0;border-radius:4px}
#app{display:grid;grid-template-columns:230px minmax(0,1fr);height:100%}
nav{background:var(--panel);border-right:1px solid var(--line);padding:16px 10px;overflow:auto;display:flex;flex-direction:column;gap:4px}
nav h1{font-family:var(--f-disp);font-size:18px;margin:0 6px 12px;color:var(--led);line-height:1.2}
nav button{text-align:left;background:none;border:0;border-radius:4px;padding:7px 10px;color:var(--dim)}
nav button[aria-current=page]{background:var(--panel2);color:var(--ink)}
nav .grp{font-family:var(--f-disp);font-size:10px;letter-spacing:.12em;color:var(--dim);margin:12px 10px 2px}
main{overflow:auto;padding:20px max(16px,2vw) 60px}
h2{font-family:var(--f-disp);font-size:20px;margin:0 0 4px;color:var(--led)}
h3{font-family:var(--f-disp);font-size:13px;letter-spacing:.06em;margin:22px 0 6px}
.lead{color:var(--dim);margin:0 0 14px;max-width:80ch}
.guide{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--led);border-radius:4px;padding:8px 12px;margin:6px 0 10px;color:var(--dim);font-size:13px;max-width:90ch}
.guide b{color:var(--ink)}
table{border-collapse:collapse;width:100%;max-width:1100px}
th{font-family:var(--f-disp);font-size:10px;letter-spacing:.1em;color:var(--dim);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);font-weight:400}
td{padding:5px 8px;border-bottom:1px solid #241e30;vertical-align:middle}
td.sit{color:var(--dim);width:24%}
td.len{font-variant-numeric:tabular-nums;color:var(--dim);white-space:nowrap;width:70px}
td.len.bad{color:var(--warn)}
td.act{white-space:nowrap;width:1%}
td.act button{margin-right:4px}
tr.new td{background:#1d2a1f}
tr.changed td{background:#2a2414}
.tag{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:3px;padding:0 5px;margin-left:6px;color:var(--dim)}
.phrase{width:100%}
.cut{width:64px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:12px;max-width:1300px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;display:grid;gap:10px;min-width:0}
.card h4{margin:0;font-size:15px}
.kv{display:grid;grid-template-columns:90px minmax(0,1fr);gap:6px 8px;align-items:center}
.kv label{color:var(--dim);font-size:12px}
.logos{display:flex;flex-wrap:wrap;gap:8px}
.logo{position:relative;width:72px;height:72px;background:#2b2436;border-radius:4px;display:grid;place-items:center}
.logo img{max-width:64px;max-height:64px}
.logo button{position:absolute;top:-6px;right:-6px;padding:0 5px;font-size:11px}
.kits{display:flex;gap:8px;align-items:flex-end}
.kits svg{width:70px;height:auto}
.kitcols{display:flex;gap:4px}
.stat{display:flex;gap:18px;flex-wrap:wrap;margin:12px 0}
.stat div{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 14px;min-width:120px}
.stat b{display:block;font-family:var(--f-disp);font-size:22px;color:var(--led)}
.drop{border:2px dashed var(--line);border-radius:8px;padding:22px;text-align:center;color:var(--dim);max-width:640px}
.drop.on{border-color:var(--led);color:var(--ink)}
.toast{position:fixed;bottom:16px;right:16px;background:var(--panel2);border:1px solid var(--led);border-radius:6px;padding:10px 14px;max-width:420px;z-index:5}
.muted{color:var(--dim)}
.warn{color:var(--warn)}
.ok{color:var(--ok)}
.filter{margin:6px 0 10px}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:10px;max-width:1300px}
.theme{all:unset;box-sizing:border-box;cursor:pointer;border-radius:6px;padding:10px;border:2px solid transparent;display:grid;gap:6px;min-width:0}
.theme[aria-pressed=true]{border-color:var(--led);box-shadow:0 0 0 2px var(--bg)}
.theme:focus-visible{outline:2px solid var(--led)}
.theme .bug{display:flex;align-items:center;gap:6px;padding:5px 7px;border-radius:4px;font-size:15px}
.theme .bug b{padding:1px 6px;border-radius:2px;font-weight:400}
.theme .nm{font-size:13px}.theme .ds{font-size:11px;opacity:.75}
.sliders{display:grid;grid-template-columns:minmax(0,220px) minmax(0,260px) 50px;gap:8px 12px;align-items:center;max-width:620px}
.sliders output{font-variant-numeric:tabular-nums;color:var(--dim)}
.tipprev{max-width:620px;border-radius:8px;padding:16px;border:1px solid var(--line)}
.tipprev h5{margin:0;font-weight:400;line-height:1.35}
.tipprev img{vertical-align:middle;width:auto}
.tipprev .logos{display:flex;justify-content:center;align-items:center;gap:14px;margin-bottom:8px}
@media (max-width:760px){#app{grid-template-columns:1fr;grid-template-rows:auto 1fr}nav{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line)}nav .grp{display:none}td.sit{width:auto}}
</style>
</head>
<body>
<div id="app">
  <nav id="nav" aria-label="Sections"></nav>
  <main id="main"></main>
</div>
<input type="file" id="pickGame" accept=".html,.htm" hidden>

<input type="file" id="pickAudio" accept="audio/mpeg,.mp3" hidden>
<input type="file" id="pickImage" accept="image/png,image/jpeg,image/webp" hidden>

const THEMES=[["vintage", "Vintage Arcade", "The original: arcade pixels and warm LED amber", ["#0d0b14", "#1a1522", "#262033", "#f1ece4", "#a39cad", "#ffb21e", "#ff5a36", "#3a3049"], ["Silkscreen", "Chakra Petch", "Teko"]], ["jam", "Jam Session", "Early-90s arcade two-on-two: loud blue, yellow and red", ["#0a0f2a", "#14204d", "#1d2d66", "#ffffff", "#9fb3ff", "#ffd400", "#ff2d2d", "#2c3f8a"], ["Press Start 2P", "Rubik", "Bungee"]], ["network80", "Network '80s", "Saturday-afternoon network broadcast in navy and gold", ["#071a33", "#0e2a52", "#163a6b", "#f4f1e6", "#a8b8cf", "#f2c14e", "#d7263d", "#23497d"], ["Oswald", "Source Sans 3", "Oswald"]], ["cable90", "Cable Sports '90s", "Black, white and a red bar, like a 90s sports channel", ["#0b0b0b", "#1a1a1a", "#2a2a2a", "#ffffff", "#b5b5b5", "#ffffff", "#e1261c", "#3a3a3a"], ["Archivo Black", "Archivo", "Archivo Narrow"]], ["showtime", "Showtime", "Purple and gold, fast-break glamour", ["#1d0b33", "#2c1250", "#3c1b6a", "#fff6e0", "#c9b4e8", "#fdb927", "#fdb927", "#4e2a80"], ["Bebas Neue", "Lato", "Bebas Neue"]], ["hardwood", "Hardwood Classics", "Warm wood, cream and slab serifs from the old programs", ["#2a1a10", "#3b2618", "#4d3322", "#f6ead2", "#c8b291", "#e8a33d", "#c8502b", "#5e4330"], ["Alfa Slab One", "Roboto Slab", "Alfa Slab One"]], ["miami", "Miami Neon", "Night-club teal and hot pink", ["#0b0f1e", "#151a33", "#1e2547", "#f2fbff", "#8fd6e8", "#2ef2ff", "#ff3fa4", "#2b3566"], ["Audiowide", "Exo 2", "Audiowide"]], ["windy", "Windy City '90s", "Red and black dynasty years", ["#0e0e0e", "#1c1416", "#2a1b1e", "#ffffff", "#c2a8ac", "#ce1141", "#ce1141", "#3d2428"], ["Anton", "Roboto Condensed", "Anton"]], ["garden", "Garden Green", "Parquet green, cream and old-school gold", ["#0c2116", "#123122", "#1a4430", "#f7f1df", "#b9cbb8", "#e8c35a", "#e05a3b", "#24553c"], ["Abril Fatface", "Libre Franklin", "Oswald"]], ["handheld", "Handheld", "Four shades of green from a pocket game console", ["#0f1f0f", "#1f3a1f", "#2d4f2d", "#c4f0c2", "#8bb88a", "#e0ff9e", "#f2ff5e", "#3f6b3f"], ["VT323", "VT323", "VT323"]], ["console16", "16-Bit Console", "Living-room console blues and bright yellow", ["#101034", "#1c1c5c", "#28287a", "#ffffff", "#a9a9e8", "#ffcc00", "#ff4f4f", "#3a3aa0"], ["Silkscreen", "Pixelify Sans", "Silkscreen"]], ["broadcast", "Modern Broadcast", "Clean slate graphics of today's TV coverage", ["#0f141a", "#19212b", "#232e3b", "#f5f7fa", "#9aa7b6", "#3fa9ff", "#ff5c5c", "#2f3c4c"], ["Barlow Condensed", "Barlow", "Barlow Condensed"]], ["amber", "Amber Scoreboard", "The arena's old bulb scoreboard", ["#120a00", "#1f1404", "#2b1d08", "#ffd89a", "#b88a4a", "#ffb000", "#ff6a00", "#4a3210"], ["Orbitron", "Share Tech Mono", "Orbitron"]], ["boxscore", "Box Score Print", "Newspaper sports page: paper, ink and red headlines", ["#efe9dc", "#f8f4ea", "#e6dfcf", "#1d1a16", "#6b6457", "#b3261e", "#b3261e", "#c9bfa9"], ["Old Standard TT", "Libre Franklin", "Oswald"]], ["street", "Street Court", "Concrete grey and safety orange from the playground", ["#1e1e1e", "#2b2b2b", "#393939", "#f2f2f2", "#b0b0b0", "#ff8c1a", "#ff8c1a", "#4a4a4a"], ["Permanent Marker", "Rubik", "Bungee"]], ["varsity", "Varsity", "College gym: maroon, cream and block letters", ["#2a0d12", "#3b141b", "#4d1c25", "#f6ecd8", "#cdb59a", "#f2c14e", "#e8e0c8", "#5e2531"], ["Graduate", "Roboto Slab", "Graduate"]], ["dream92", "Dream '92", "Summer-games blue, white and red", ["#0b1d4a", "#13296b", "#1b378a", "#ffffff", "#b3c3ea", "#ffffff", "#e2231a", "#2a4aa3"], ["Montserrat", "Montserrat", "Montserrat"]], ["hologram", "Hologram", "Future arena: dark glass and cyan light", ["#050a12", "#0a1622", "#102236", "#dffcff", "#7fb3c2", "#00e5ff", "#7c4dff", "#18344d"], ["Exo 2", "Exo 2", "Orbitron"]], ["sunset", "Sunset Coast", "West-coast evening: orange and pink", ["#1c0d1f", "#2d1530", "#3d1d40", "#fff1e6", "#e0b4c4", "#ff9f1c", "#ff4f79", "#55284f"], ["Righteous", "Nunito", "Righteous"]], ["blackout", "Blackout", "All black with silver, for the night games", ["#000000", "#0d0d0f", "#18181c", "#e8e8ec", "#8a8a93", "#c0c0c8", "#ffffff", "#2a2a30"], ["Rajdhani", "Rajdhani", "Rajdhani"]]];

/* ============ read the game file ============ */
function readGame(text){
  const lines=text.split('\n');
  const want=/^(const (VOX_DATA|SFX_DATA|MUSIC_LONG|TM_KEY|NAMEOFF|HEMAP|PB|TN_META|JX_META|LINE_META|ABBR|LEAGUE_REC|KITS|DEFAULT_LOOK|DEFAULT_MUSIC_USE)\b|let MUSIC_LONG\b|Object\.assign\((VOX|SFX)_DATA|VOX_DATA\.|SFX_DATA\.)/;
  let code='';for(const l of lines)if(want.test(l))code+=l+'\n';
  const a=text.indexOf('const LEAGUE=[\n');const b=text.indexOf(']];',a);if(a<0||b<0)throw new Error('This does not look like the Vintage Basket game file (no team list found).');
  code+=text.slice(a,b+3)+'\n';
  const ls=lines.find(l=>l.startsWith('const LOGO_SETS='));if(ls)code+=ls.slice(0,ls.indexOf(';const LOGO_DATA'))+';\n';
  code+='return{VOX_DATA,SFX_DATA,MUSIC_LONG,HEMAP,PB,TN_META,JN_META,TI_META,JT_META,JX_META,LEAGUE,ABBR:typeof ABBR!=="undefined"?ABBR:{},LEAGUE_REC:typeof LEAGUE_REC!=="undefined"?LEAGUE_REC:{},KITS:typeof KITS!=="undefined"?KITS:{},LOGO_SETS:typeof LOGO_SETS!=="undefined"?LOGO_SETS:{},DEFAULT_LOOK:typeof DEFAULT_LOOK!=="undefined"?DEFAULT_LOOK:null,DEFAULT_MUSIC_USE:typeof DEFAULT_MUSIC_USE!=="undefined"?DEFAULT_MUSIC_USE:null};';
  const D=(new Function(code))();
  if(!D.VOX_DATA||!D.PB)throw new Error('The game file has no commentary data.');
  return D;}

function clip(src,o={}){return Object.assign({src,orig:true,text:'',cut:'',len:null},o);}
function initState(){
  const V=G.VOX_DATA;S={teams:{},arr:{},obj:{},meta:{},music:[],notes:{},look:baseLook()};
  for(const[k,city,nick,,cols]of G.LEAGUE){const L=G.LOGO_SETS[k]||[];
    S.teams[k]={key:k,city,nick,abbr:G.ABBR[k]||k,pri:cols[0],sec:cols[1],numc:cols[2],kit:JSON.parse(JSON.stringify(G.KITS[k]||{h:['#f4f1ea',cols[0],cols[0],cols[1]],a:[cols[0],cols[2],cols[1],cols[1]]})),
      logos:L.slice(),orig:{city,nick},voiced:!G.LEAGUE_REC[k]};}
  for(const[, c]of ARR)if(Array.isArray(V[c]))S.arr[c]=V[c].map((src,i)=>clip(src,{i}));
  for(const v of['pb','tn','jn','jx','ti','city','nick','team','jt','pn','pnum','pbn','ppos','th','tmx']){S.obj[v]={};for(const k in V[v]||{})S.obj[v][k]=clip(V[v][k]);}
  S.meta={pb:clone(G.PB),tn:clone(G.TN_META),jn:clone(G.JN_META),jx:clone(G.JX_META),ti:clone(G.TI_META)};
  S.music=(G.SFX_DATA.music||[]).map((src,i)=>clip(src,{use:useDefault(i,i<G.MUSIC_LONG)}));
  S.hemap=clone(G.HEMAP);}
const clone=o=>JSON.parse(JSON.stringify(o||{}));

/* ============ audio ============ */
let AC=null;const BUF=new Map();let playing=[];
async function dec(src){if(BUF.has(src))return BUF.get(src);AC=AC||new AudioContext();const ab=await (await fetch(src)).arrayBuffer();const b=await AC.decodeAudioData(ab);BUF.set(src,b);return b;}
function stopAll(){for(const s of playing)try{s.stop();}catch(e){}playing=[];}
async function playParts(parts){stopAll();AC=AC||new AudioContext();if(AC.state==='suspended')await AC.resume();let t=AC.currentTime+0.05;
  for(const p of parts){if(p.pause){t+=p.pause;continue;}if(!p.src)continue;const b=await dec(p.src);const off=p.off||0,dur=p.dur!=null?p.dur:b.duration-off;
    const s=AC.createBufferSource();s.buffer=b;s.connect(AC.destination);s.start(t,off,Math.max(0.01,dur));playing.push(s);t+=dur+(p.gap!=null?p.gap:0.03);}}
async function lenOf(c){if(c.len==null){try{c.len=(await dec(c.src)).duration;}catch(e){c.len=-1;}}return c.len;}

// a random team / player for the fills, the way the game says them
const rnd=a=>a[(Math.random()*a.length)|0];
// like the game: a renamed team without new name clips is called by its city (if that stayed) or not named at all
function teamParts(key,form){const o=S.obj,T=S.teams[key],f=form||rnd(['city','nick','team']);const ok=T.voiced?[f,'city','team','nick']:T.city===T.orig.city?['city']:[];const pick=ok.find(x=>o[x]&&o[x][key]);
  if(!pick)return{parts:[],label:'(no recorded name)'};return{parts:[{src:o[pick][key].src}],label:`${pick==='city'?S.teams[key].city:pick==='nick'?S.teams[key].nick:S.teams[key].city+' '+S.teams[key].nick} (${pick==='team'?'city + name':pick==='city'?'city':'name'})`};}
function randomTeam(){const ks=Object.keys(S.teams).filter(k=>S.obj.city[k]||S.obj.team[k]||S.obj.nick[k]);return rnd(ks.length?ks:Object.keys(S.teams));}
function playerParts(){const ks=Object.keys(S.obj.pn);if(!ks.length)return{parts:[],label:''};const n=rnd(ks);return{parts:[{src:S.obj.pn[n].src}],label:n};}
function numParts(){const ks=Object.keys(S.obj.pnum).filter(k=>+k>0&&+k<20);const n=rnd(ks.length?ks:['7']);return S.obj.pnum[n]?{parts:[{src:S.obj.pnum[n].src}],label:'#'+n}:{parts:[],label:''};}

/* ============ phrase markers → game metadata ============ */
const MARK={X:'A',Y:'B',P:'P',P2:'P2','#':'X'};
function tokens(text){return String(text||'').trim().split(/\s+/).filter(Boolean);}
// where the fills go: returns [{f,pos:'start'|'end'|'mid'}] in order
function fillsOf(text){const t=tokens(text).map(w=>w.replace(/[.,!?;:'’"]+$/,'').replace(/^['"]+/,''));const out=[];
  t.forEach((w,i)=>{const m=w.replace(/'s$/,'');if(MARK[m])out.push({f:MARK[m]+(w.endsWith("'s")&&MARK[m]!=='P'&&MARK[m]!=='P2'&&MARK[m]!=='X'?'n':''),pos:i===0?'start':i===t.length-1?'end':'mid'});});return out;}
function metaFor(c,len){const F=fillsOf(c.text),cuts=String(c.cut||'').split(/[,;\s]+/).map(Number).filter(x=>x>0&&x<len);let ci=0;const p=[];let at=0;
  for(const f of F){if(f.pos==='start'){p.push({f:f.f});continue;}if(f.pos==='end')continue;const cut=cuts[ci++];if(cut==null)return{err:'Mark where the name goes: give a cut time in seconds.'};p.push([at,cut],{f:f.f});at=cut;}
  p.push([at,len]);for(const f of F)if(f.pos==='end')p.push({f:f.f});return{p,len};}

/* ============ what a row sounds like in the game ============ */
async function rowParts(kind,c,ctx){const len=await lenOf(c);let label=[];const out=[];
  const team=randomTeam(),other=rnd(Object.keys(S.teams).filter(k=>k!==team));
  const fill=f=>{if(f==='A'||f==='An'){const r=teamParts(team);label.push(r.label);return r.parts;}if(f==='B'||f==='Bn'||f==='V'){const r=teamParts(other);label.push(r.label);return r.parts;}
    if(f==='P'||f==='P2'){const r=playerParts();label.push(r.label);return r.parts;}if(f==='X'){const r=numParts();label.push(r.label);return r.parts;}return[];};
  if(kind==='tpl'){const M=c.orig?S.meta[ctx.v][ctx.key]:metaFor(c,len);if(!M||M.err){toast(M&&M.err||'No timing for this line yet.');return[{src:c.src}];}
    for(const p of M.p){if(Array.isArray(p))out.push({src:c.src,off:p[0],dur:p[1]-p[0],gap:0});else out.push({pause:0.03},...fill(p.f));}}
  else if(kind==='pb'){const m=c.orig?S.meta.pb[ctx.key]:(fillsOf(c.text)[0]?.pos==='start'?{he:0}:{});
    if(m&&m.he!=null&&Math.random()<0.6){out.push(...fill('P'),{pause:0.06},{src:c.src,off:m.he});}else out.push({src:c.src});}
  else if(kind==='arr'){const pre=ctx.pre;const H=c.orig?S.hemap[ctx.cat+c.i]:null;
    if(pre==='P'){const nm=fill('P');if(H&&H[0]==='rep')out.push({src:c.src,dur:H[1]},...nm,{src:c.src,off:H[2]});else if(H&&H[0]==='ins')out.push({src:c.src,dur:H[1]},{pause:0.06},...nm,{src:c.src,off:H[1]});
      else{const F=c.orig?[]:fillsOf(c.text);const cut=+c.cut;if(F[0]&&F[0].pos==='mid'&&cut>0)out.push({src:c.src,dur:cut},...nm,{src:c.src,off:cut});else out.push(...nm,{pause:0.15},{src:c.src});}}
    else if(pre==='X'){out.push(...fill('A'),{pause:0.05},{src:c.src});}
    else if(ctx.cat==='atm1a'||ctx.cat==='atm5a'||ctx.cat==='atm6a'){out.push({src:c.src},...fill('A'));}
    else out.push({src:c.src});}
  else out.push({src:c.src});
  return{parts:out,label:label.join(', ')};}

const SECTIONS=[['','home','Start'],['League','look','Look & layout'],['League','teams','Teams, logos & kits'],['League','music','Music'],

 ['Commentary','players','Player names & numbers'],['Arena','arena','Crowd & arena sounds'],['Arena','horns','Home-arena horns']];
function renderNav(){let h='<h1>VINTAGE<br>BUILDER</h1>',g=null;for(const[grp,id,lab]of SECTIONS){if(grp!==g){g=grp;if(grp)h+=`<div class="grp">${grp.toUpperCase()}</div>`;}

const VIEWS={};
VIEWS.home=()=>{let h=`<h2>VINTAGE BUILDER</h2><p class="lead">Pick the music, logos, kits and commentary for Vintage Basket, listen to every line, then save a setup file (<b>vintage.vbf</b>). Put the setup file in the same folder as the game and the game uses it the next time it is opened.</p>`;
  if(!G)return h+`<div class="drop" id="drop"><p><b>1.</b> Open the game so the builder can read the current sounds, logos and teams.</p>

    <button ${FS_OK?'':'class="big"'} id="openGame">OPEN GAME FILE</button><p class="muted">You can also drag index.html here.</p></div>`;

  h+=`<div class="stat"><div><b>${Object.keys(S.teams).length}</b>teams</div><div><b>${S.music.length}</b>music tracks</div><div><b>${cnt.all}</b>commentary &amp; arena clips</div><div><b>${cnt.changed}</b>changes</div></div>
  <p class="muted">Game file: ${esc(gameName)}</p>
  <div class="row">${FS_OK?`<button class="big" id="updateGame">UPDATE GAME</button><button id="saveVbf">Save setup as a file</button>`:`<button class="big" id="saveVbf">SAVE SETUP (.VBF)</button>`}<button id="openVbf">Open a saved setup</button>${FS_OK?'<button id="openFolder">Open another game folder</button>':''}<button id="openGame">Open another game file</button><button id="resetAll" class="del">Undo all changes</button></div>
  <div class="guide"><b>How the setup reaches the game.</b> ${FS_OK?`<b>UPDATE GAME</b> writes <b>vintage.vbf</b> into the game folder${gameDir?` (“${esc(gameDir.name)}”)`:''}; reload the game to see the changes. `:''}A saved setup file must be named <b>vintage.vbf</b> and sit in the same folder as the game's index.html. If your browser saves it as vintage(1).vbf, rename it.</div>
  <div class="guide"><b>Sizes.</b> Logos: square PNG with a transparent background, at least 256 × 256 px (the game shows them at up to 160 px). Clip lengths are shown on each page; lines that are too long or short are marked in yellow.<br>
  <b>Fills.</b> In a phrase, write <b>X</b> where the team's name goes, <b>Y</b> for the other team, <b>P</b> for a player and <b>#</b> for a number. In the 1st quarter the game says the full name (city + nickname) one time in three; otherwise the city or the nickname. If the name goes in the middle of the recording, give the cut time in seconds.<br>
  <b>Check with Claude.</b> When everything is in place, bring the .vbf to Claude to check that every clip cuts in correctly.</div>`;
  return h;};
function countClips(){let all=0,changed=0;const chk=c=>{all++;if(!c.orig||c.dirty)changed++;};
  for(const c in S.arr)S.arr[c].forEach(chk);for(const v in S.obj)Object.values(S.obj[v]).forEach(chk);
  changed+=delCount();if(JSON.stringify(S.look)!==JSON.stringify(baseLook()))changed++;for(const k in S.teams)if(teamDirty(k))changed++;if(musicDirty())changed++;return{all,changed};}
function delCount(){let n=0;for(const c in S.arr){const kept=new Set(S.arr[c].filter(x=>x.orig).map(x=>x.i));n+=(G.VOX_DATA[c]||[]).filter((_,i)=>!kept.has(i)).length;}
  for(const v in S.obj)for(const k in G.VOX_DATA[v]||{})if(!S.obj[v][k])n++;return n;}

// one table row
function rowHTML(id,sit,name,c,o={}){const cls=!c.orig?'new':c.dirty?'changed':'';
  const phrase=c.orig&&!c.dirty?`<span>${esc(name)}</span>${o.tags||''}`:`<input class="phrase" type="text" data-phr="${id}" value="${esc(c.text)}" placeholder="${esc(o.ph||'Write the line, e.g. X needs to speed up their offense')}" aria-label="Phrase">${o.cutOK?` <input class="cut" type="text" data-cut="${id}" value="${esc(c.cut)}" placeholder="cut s" title="Where the name goes, in seconds (only for a name in the middle)" aria-label="Cut time">`:''}`;
  return`<tr class="${cls}"><td class="sit">${esc(sit)}</td><td>${phrase}</td><td class="len" data-len="${id}" data-lk="${o.lk||''}">…</td>
   <td class="act"><button data-play="${id}">Play</button><button class="del" data-del="${id}">Delete</button><button data-imp="${id}">Import</button></td></tr>`;}
const TABLE_HEAD='<table><thead><tr><th>Situation</th><th>Phrase</th><th>Length</th><th></th></tr></thead><tbody>';
// registry of the rows on screen: id -> handlers
let ROWS={};let rid=0;
function reg(o){const id='r'+(rid++);ROWS[id]=o;return id;}

VIEWS.story=()=>{ROWS={};let h=`<h2>GAME SITUATIONS</h2><p class="lead">Storylines from Tony (play-by-play) and Jeni (analyst). The game picks one line from the situation when it happens, once a quarter at most.</p>
  <div class="guide">Length <b>${LEN_TXT('story')}</b>. X = the team the line is about, Y = the other team, P = a player, # = a number (points).</div>${filterBox()}`;
  for(const[lab,cat,keys]of STORY){const rows=[];let n=0;
    for(const vk of keys){const[v,key]=vk.split(':');const all=Object.keys(S.obj[v]).filter(k=>k===key||k.startsWith(key+'~')).sort((a,b)=>S.obj[v][a].orig===S.obj[v][b].orig?0:S.obj[v][a].orig?-1:1);
      for(const k of all){const c=S.obj[v][k];const nm=c.orig?`${lab} ${ABC(n++)}`:'';if(!match(lab+' '+nm+' '+c.text))continue;
        rows.push(rowHTML(reg({kind:'tpl',ctx:{v,key:k},c,del:()=>delete S.obj[v][k],imp:x=>{S.obj[v][k]=Object.assign(x,{orig:false});}}),lab,nm,c,{tags:fillTags(S.meta[v][k]),cutOK:true,lk:'story'}));}}

    h+=`<h3>${esc(lab.toUpperCase())}</h3>${TABLE_HEAD}${rows.join('')}</tbody></table><button data-add="${reg({add:x=>addVariant(first[0],first[1],x)})}">+ Add a line</button>`;}
  const used=new Set(STORY.flatMap(s=>s[2]));const rest=[];let n=0;
  for(const v of['tn','jn'])for(const k of Object.keys(S.obj[v]).sort()){const base=k.split('~')[0];if(used.has(v+':'+base))continue;const c=S.obj[v][k];const nm=`${v==='tn'?'Tony':'Jeni'} storyline ${ABC(n++)}`;
    if(!match(nm+' '+c.text))continue;rest.push(rowHTML(reg({kind:'tpl',ctx:{v,key:k},c,del:()=>delete S.obj[v][k],imp:x=>{S.obj[v][k]=Object.assign(x,{orig:false});}}),'Other storyline',nm,c,{tags:fillTags(S.meta[v][k]),cutOK:true,lk:'story'}));}
  if(rest.length)h+=`<h3>OTHER STORYLINES</h3>${TABLE_HEAD}${rest.join('')}</tbody></table>`;
  const jx=Object.keys(S.obj.jx).sort().map((k,i)=>{const c=S.obj.jx[k];return rowHTML(reg({kind:'tpl',ctx:{v:'jx',key:k},c,del:()=>delete S.obj.jx[k],imp:x=>{S.obj.jx[k]=Object.assign(x,{orig:false});}}),'Jeni one-liner (once a game)',`One-liner ${ABC(i)}`,c,{tags:fillTags(S.meta.jx[k]),cutOK:true,lk:'story'});});
  h+=`<h3>JENI ONE-LINERS</h3>${TABLE_HEAD}${jx.join('')}</tbody></table>`;
  return h;};
function fillTags(M){if(!M||!M.p)return'';const f=M.p.filter(p=>!Array.isArray(p)).map(p=>({A:'X',An:"X's",B:'Y',Bn:"Y's",V:'visitors',P:'P',P2:'P2',X:'#'}[p.f]||p.f));return f.length?`<span class="tag">${esc(f.join(' · '))}</span>`:'';}
function addVariant(v,key,x){let n=2;while(S.obj[v][key+'~'+n])n++;S.obj[v][key+'~'+n]=Object.assign(x,{orig:false});}

  <div class="guide">Length <b>${LEN_TXT('pb')}</b>. With several lines for one call, the game picks one at random.</div>${filterBox()}<table><thead><tr><th>Situation</th><th>Phrase</th><th>Length</th><th></th></tr></thead><tbody>`;

/* ============ the game folder: read index.html and write vintage.vbf straight into it (Chrome and Edge) ============ */
const FS_OK=typeof window.showDirectoryPicker==='function';let gameDir=null,lastDir=null;
function idb(){return new Promise((ok,no)=>{const r=indexedDB.open('vintage-builder',1);r.onupgradeneeded=()=>r.result.createObjectStore('h');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error);});}
async function keepDir(h){try{const db=await idb();db.transaction('h','readwrite').objectStore('h').put(h,'dir');}catch(e){}}
async function lastDirLoad(){try{const db=await idb();lastDir=await new Promise(ok=>{const q=db.transaction('h').objectStore('h').get('dir');q.onsuccess=()=>ok(q.result||null);q.onerror=()=>ok(null);});}catch(e){lastDir=null;}if(lastDir&&!G)render();}
async function useFolder(h){if(await h.requestPermission({mode:'readwrite'})!=='granted'){toast('The builder needs permission to write into the game folder.');return;}
  let f;try{f=await (await h.getFileHandle('index.html')).getFile();}catch(e){toast(`No index.html in “${h.name}”. Pick the folder where the game is.`,7000);return;}
  toast('Reading '+h.name+'/index.html …',8000);G=readGame(await f.text());gameName=h.name+'/index.html';gameDir=h;keepDir(h);initState();BUF.clear();
  try{const v=await (await h.getFileHandle('vintage.vbf')).getFile();applyVbfToState(parseVbf(await v.text()));toast(`Game and its current setup read from “${h.name}”.`);}catch(e){toast(`Game read from “${h.name}”.`);}
  view='home';render();}
async function pickFolder(){try{await useFolder(await window.showDirectoryPicker({id:'vintage-game',mode:'readwrite'}));}catch(e){if(e.name!=='AbortError')toast('Could not open the folder: '+e.message,6000);}}
async function updateGame(){const V=buildVbf();
  try{if(!gameDir){const h=await window.showDirectoryPicker({id:'vintage-game',mode:'readwrite'});try{await h.getFileHandle('index.html');}catch(e){toast(`No index.html in “${h.name}”. Pick the folder where the game is.`,7000);return;}gameDir=h;keepDir(h);}
    if(await gameDir.requestPermission({mode:'readwrite'})!=='granted'){toast('The builder needs permission to write into the game folder.');return;}
    const w=await (await gameDir.getFileHandle('vintage.vbf',{create:true})).createWritable();await w.write(vbfText(V));await w.close();
    toast(`Game updated: vintage.vbf written to “${gameDir.name}”. Reload the game to see the changes.`+(V.problems.length?` ${V.problems.length} line(s) still need a cut time.`:''),8000);}
  catch(e){if(e.name!=='AbortError')toast('Could not update the game: '+e.message,7000);}}
lastDirLoad();
function loadGameFile(f){toast('Reading '+f.name+' …',8000);const r=new FileReader();r.onload=()=>{try{G=readGame(String(r.result));gameName=f.name;initState();BUF.clear();view='home';render();toast('Game file read: '+f.name);}
  catch(err){toast(err.message,8000);}};r.readAsText(f);}

/* ============ the setup file ============ */
function teamDirty(k){const T=S.teams[k],row=G.LEAGUE.find(r=>r[0]===k);if(!row)return true;
  return T.city!==row[1]||T.nick!==row[2]||T.abbr!==(G.ABBR[k]||k)||T.pri!==row[4][0]||T.sec!==row[4][1]||T.numc!==row[4][2]||JSON.stringify(T.kit)!==JSON.stringify(G.KITS[k])||JSON.stringify(T.logos)!==JSON.stringify(G.LOGO_SETS[k]||[])||T.voiced!==!G.LEAGUE_REC[k];}
function musicDirty(){const o=G.SFX_DATA.music||[];return S.music.length!==o.length||S.music.some((c,i)=>c.src!==o[i]||c.use!==useDefault(i,i<G.MUSIC_LONG));}
function buildVbf(){const V={format:'VBF',version:1,saved:new Date().toISOString(),teams:{},arr:{},hemap:{},obj:{},meta:{},notes:{},problems:[]};
  for(const k in S.teams)if(teamDirty(k)){const T=S.teams[k];V.teams[k]={city:T.city,nick:T.nick,abbr:T.abbr,pri:T.pri,sec:T.sec,numc:T.numc,kit:T.kit,logos:T.logos,voiced:T.voiced};}
  for(const c in S.arr){const o=G.VOX_DATA[c]||[],L=S.arr[c];const same=L.length===o.length&&L.every((x,i)=>x.orig&&x.i===i);if(same)continue;
    V.arr[c]=L.map(x=>x.src);L.forEach((x,i)=>{if(x.orig&&S.hemap[c+x.i])V.hemap[c+i]=S.hemap[c+x.i];else if(!x.orig){const F=fillsOf(x.text);const cut=parseFloat(x.cut);if(F[0]&&F[0].pos==='mid'&&cut>0)V.hemap[c+i]=['ins',cut];if(x.text)V.notes['arr.'+c+'.'+i]=x.text;}});}
  for(const v in S.obj){const o=G.VOX_DATA[v]||{},O={set:{},del:[]};
    for(const k in o)if(!S.obj[v][k])O.del.push(k);
    for(const k in S.obj[v]){const x=S.obj[v][k];if(x.orig)continue;O.set[k]=x.src;if(x.text)V.notes[v+'.'+k]=x.text;
      if(['tn','jn','jx','ti'].includes(v)){const M=metaFor(x,x.len||0);if(M.err)V.problems.push(`${v}.${k}: ${M.err}`);else(V.meta[v]=V.meta[v]||{})[k]=M;}
      if(v==='pb'){const F=fillsOf(x.text);(V.meta.pb=V.meta.pb||{})[k]=Object.assign({len:+(x.len||0).toFixed(3)},F[0]&&F[0].pos==='start'?{he:0}:{});}}
    if(Object.keys(O.set).length||O.del.length)V.obj[v]=O;}
  if(JSON.stringify(S.look)!==JSON.stringify(baseLook())){const T=THEMES.find(t=>t[0]===S.look.theme)||THEMES[0];V.look=Object.assign(clone(S.look),{vars:lookVars(T[0]),fonts:[...new Set(T[4])].map(f=>f.replace(/ /g,'+'))});}
  if(musicDirty())V.music={list:S.music.map(x=>x.src),use:S.music.map(x=>x.use),long:S.music.filter(x=>x.use.includes('t')).length};
  return V;}
const vbfText=V=>'/* Vintage Builder setup: keep this file next to the game (index.html) as vintage.vbf */\nwindow.VBF='+JSON.stringify(V)+';\n';
function saveVbf(){const V=buildVbf();const txt=vbfText(V);
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/octet-stream'}));a.download='vintage.vbf';document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);
  toast(V.problems.length?`Saved, but ${V.problems.length} line(s) need a cut time: ${V.problems.slice(0,3).join('; ')}`:'Saved vintage.vbf. Put it in the game folder.',7000);}
function parseVbf(txt){const i=txt.indexOf('{'),j=txt.lastIndexOf('}');const V=JSON.parse(txt.slice(i,j+1));if(V.format!=='VBF')throw new Error('not a Vintage Builder file');return V;}
function applyVbfToState(V){if(!G)throw new Error('open the game file first');initState();
  if(V.look)S.look={theme:V.look.theme||'vintage',scale:Object.assign(clone(LOOK0.scale),V.look.scale||{}),tip:Object.assign(clone(LOOK0.tip),V.look.tip||{}),court:Object.assign(clone(LOOK0.court),V.look.court||{})};
  for(const k in V.teams||{}){const T=S.teams[k];if(!T)continue;const t=V.teams[k];Object.assign(T,{city:t.city,nick:t.nick,abbr:t.abbr,pri:t.pri,sec:t.sec,numc:t.numc,kit:t.kit,logos:t.logos||T.logos,voiced:!!t.voiced});}
  for(const c in V.arr||{}){const o=G.VOX_DATA[c]||[];S.arr[c]=V.arr[c].map((src,i)=>{const j=o.indexOf(src);return j>=0?clip(src,{i:j}):clip(src,{orig:false,text:(V.notes||{})['arr.'+c+'.'+i]||'',cut:(V.hemap[c+i]&&V.hemap[c+i][0]==='ins')?String(V.hemap[c+i][1]):''});});}
  for(const v in V.obj||{}){const O=V.obj[v];S.obj[v]=S.obj[v]||{};for(const k of O.del||[])delete S.obj[v][k];
    for(const k in O.set||{}){const M=(V.meta[v]||{})[k];const cut=M&&M.p?M.p.filter(Array.isArray).slice(0,-1).map(p=>p[1]).join(','):'';S.obj[v][k]=clip(O.set[k],{orig:false,text:(V.notes||{})[v+'.'+k]||'',cut});}}
  if(V.music){S.music=V.music.list.map((src,i)=>{const j=(G.SFX_DATA.music||[]).indexOf(src);return clip(src,{orig:j>=0,use:V.music.use?V.music.use[i]:useDefault(i,i<V.music.long)});});}}

render();
</script>
