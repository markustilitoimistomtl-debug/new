<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Table Hockey</title>
<style>
  html,body{margin:0;height:100%;background:#0d1016;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#e8ecf2}
  canvas{display:block;width:100vw;height:100vh;cursor:crosshair}
  #menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(6,8,12,.72);backdrop-filter:blur(3px)}
  #menu.hidden{display:none}
  .card{background:#151a23;border:1px solid #2a3343;border-radius:14px;padding:26px 30px;max-width:640px;width:calc(100% - 32px);box-shadow:0 20px 60px rgba(0,0,0,.5)}
  h1{margin:0 0 4px;font-size:34px;letter-spacing:.06em}
  h1 span.b{color:#3d8bff} h1 span.r{color:#ff4a3a}
  .sub{color:#9aa6b8;margin:0 0 18px;font-size:14px}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
  button{font:inherit;font-weight:600;padding:11px 18px;border-radius:9px;border:1px solid #3a4558;background:#1f2633;color:#e8ecf2;cursor:pointer}
  button:hover{background:#2a3445}
  button.primary{background:#2a6ff0;border-color:#2a6ff0}
  button.primary:hover{background:#3a7cff}
  label{font-size:14px;color:#c4ccd8;display:flex;align-items:center;gap:8px}
  select{font:inherit;background:#1f2633;color:#e8ecf2;border:1px solid #3a4558;border-radius:7px;padding:5px 8px}
  .keys{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px;font-size:13px;color:#aeb8c8;line-height:1.55}
  .keys b{color:#fff}
  kbd{background:#0c1017;border:1px solid #3a4558;border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:12px;color:#fff}
  @media (max-width:560px){.keys{grid-template-columns:1fr}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="menu">
  <div class="card">
    <div style="float:right"><select id="lang" aria-label="Language"><option value="en">English</option><option value="fi">Suomi</option></select></div>
    <h1><span class="b" data-i="t1"></span><span class="r" data-i="t2"></span></h1>
    <p class="sub" data-i="sub"></p>
    <div class="row">
      <button class="primary" id="b1" data-i="b1"></button>
      <button id="b2" data-i="b2"></button>
      <button id="b0" data-i="b0"></button>
      <button id="bres" style="display:none" data-i="bres"></button>
    </div>
    <div class="row">
      <label><span data-i="diff"></span>
        <select id="diff"><option value="0" data-i="d0"></option><option value="1" selected data-i="d1"></option><option value="2" data-i="d2"></option></select>
      </label>
      <label><span data-i="plen"></span>
        <select id="plen"><option value="60">1 min</option><option value="120">2 min</option><option value="180" selected>3 min</option><option value="300">5 min</option></select>
      </label>
      <label><input type="checkbox" id="autog" checked> <span data-i="autog"></span></label>
    </div>
    <div class="keys">
      <div data-i="k1"></div>
      <div data-i="k2"></div>
    </div>
  </div>
</div>
<script src="assets/sprites.js"></script>
<script src="game.js"></script>
</body>
</html>
